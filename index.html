  document.title = (isPlan ? T.tabPlan : T.tabGuide) + ' · ' + T.app;
  const card = ([k, n, dsc], grp) => `<button data-open="${k}" data-nav${grp ? ` class="g-${grp}"` : ''}><span class="ix-txt"><span class="ix-t">${n}</span><span class="ix-d">${dsc}</span></span>${CHEV_R}</button>`;
  if (isPlan){
    const items = [['food', T.foodTool, T.foodShort], ['fuel', T.fuelTool, T.fuelShort], ['weight', T.weightTool, T.weightShort], ['water', T.water, T.waterShort]];
    main.innerHTML = `<p class="tool-sub">${T.planSub}</p><div class="index">` + items.map(x => card(x)).join('') + '</div>';
    return;
  }
  const G = GUIDE_TXT[state.lang] || GUIDE_TXT.en;
  const old = {knots:[T.knotTool, T.knotShort], sun:[T.sunTool, T.sunShort], winter:[T.winterTool, T.winterShort], stoveboard:[T.sbTool, T.sbShort], phone:[T.phoneTool, T.phoneShort]};
  const info = k => G[k] ? [k, G[k].title, G[k].short] : [k, old[k][0], old[k][1]];
  main.innerHTML = `<p class="tool-sub">${T.guideSub}</p>` + GUIDE_GROUPS.map(gr =>
    `<h2 class="ix-group g-${gr.key}"><i aria-hidden="true"></i>${gr[state.lang] || gr.en}</h2><div class="index">` + gr.items.map(k => card(info(k), gr.key)).join('') + '</div>').join('');
}
/* ---------- text guides (v17) ---------- */
const GUIDE_TXT = {
  no:{
    shell:{title:'Skalltøy', short:'Pust, vask og impregnering', sub:'En rask sjekk før og etter tur. Vaskeanvisningen og produsentens råd går først.', secs:[
      ['Hvorfor det betyr noe','<p>Ytterstoffet har et vannavstøtende belegg som får vannet til å perle og renne av. Når belegget slites, trekker stoffet til seg vann. Jakken lekker ikke, men slutter å puste og blir klam inni. Skitt, svette, solkrem og røyk sliter belegget raskere.</p>'],
      ['Før turen','<ul><li>Dryss litt vann på skuldrene. Perler det, er det greit. Blir stoffet mørkt og trekker det inn, bør plagget vaskes og impregneres.</li><li>Sjekk glidelåser, mansjetter, hettejustering og at tapen i sømmene ikke løsner.</li></ul>'],
      ['Etter turen','<ul><li>Heng plagget til tørk før du legger det bort, ikke rett ved sterk varme.</li><li>Børst av tørr gjørme, og oppbevar det hengende, ikke presset sammen.</li></ul>'],
      ['Vask','<ul><li>Vask når plagget er skittent eller slutter å perle, etter vaskeanvisningen (ofte 30–40 °C).</li><li>Lukk alle glidelåser og borrelåser, og bruk flytende vaskemiddel eller et vaskemiddel for funksjonstøy.</li><li>Aldri tøymykner, blekemiddel eller rens. Skyll godt.</li></ul>'],
      ['Ny impregnering','<ul><li>Varme gir ofte tilbake den vannavstøtende effekten: tørketrommel på lav eller middels varme i omtrent 20 minutter, hvis vaskeanvisningen tillater det.</li><li>Perler det fortsatt ikke, bruk impregnering på spray utenpå, og varm etter det produktet beskriver.</li></ul>']]},
    boots:{title:'Fjellsko', short:'Lærsko, tekniske sko og skistøvler', sub:'En rask sjekk før og etter tur. Vaskeanvisningen og produsentens råd går først.', secs:[
      ['Før turen','<ul><li>Sjekk såle og mønster, sømmer, gummikanten, lisser og maljer.</li><li>Se at skoene er behandlet siden forrige tur.</li></ul>'],
      ['Etter turen, alle sko','<ul><li>Ta ut innleggssålene, løsne lissene, og børst eller skyll av gjørme. Tørket gjørme trekker fuktighet ut av lær.</li><li>Tørk skoene langsomt i romtemperatur, med avispapir inni som byttes når det er vått.</li><li>Aldri ved bål, ovn eller panelovn. Varme sprekker lær og svekker limet.</li><li>Oppbevar dem tørt og luftig, ikke i plastpose eller i en varm bil.</li></ul>'],
      ['Lærsko','<ul><li>Når de er rene, behandle dem med voks eller pleiemiddel for lærtypen. Glatt lær og nubuk trenger ulike produkter.</li><li>Har skoene membran, unngå tungt fett. Det mykner læret og gir dårligere pust. Bruk et produkt laget for sko med membran.</li></ul>'],
      ['Tekniske sko (stoff og syntet)','<ul><li>Rengjør med vann, og mild såpe ved behov. Ikke bruk voks på stoffet.</li><li>Impregner med spray når vannet ikke lenger perler.</li></ul>'],
      ['Skistøvler','<p>Som for fjellsko: tørk langsomt i romtemperatur, aldri ved bål eller ovn, og behandle skistøvler i lær som lærsko.</p><ul><li>Kan innerstøvlene tas ut, ta dem ut etter hver dag og tørk dem for seg. Det er der fuktigheten sitter. I telt kan de ligge i soveposen om natten, så de ikke fryser.</li><li>Før turen, sjekk delen som møter bindingen (sålekant, bøyle eller innfestinger) for slitasje og sprekker, og at den ikke er full av is eller skitt.</li><li>Sjekk spenner, stropper og lisser.</li><li>Oppbevar plaststøvler med spennene løst lukket, så skallet holder formen.</li></ul>','ski']]},
    tent:{title:'Telt', short:'Sjekk før og etter tur', sub:'En rask sjekk før og etter tur. Produsentens råd går først.', secs:[
      ['Før turen','<ul><li>Etter lagring, eller før sesongens første tur: slå opp teltet hjemme og sjekk at alt er med: innertelt, duk, stenger, plugger og barduner.</li><li>Sjekk stangledd og strikken inni, glidelåser, tapen i sømmene og at vannet perler på duken.</li><li>Se at lappesett og reparasjonshylse til stengene ligger i reparasjonssettet.</li></ul>'],
      ['På tur','<ul><li>Selve teltet (innertelt og duk) kan pakkes inni sekken i stedet for utenpå. Det holder seg tørt, henger ikke fast i greiner og sekken blir bedre balansert. Stengene utenpå eller langs ryggen.</li><li>En våt duk kan pakkes i egen pose eller i en ytterlomme, så resten av sekken holder seg tørr.</li><li>Unngå å la teltet stå i sterk sol i dagevis. Sollys sliter på stoffet.</li></ul>'],
      ['Etter turen','<ul><li>Tørk teltet helt innen en dag eller to, selv om det virket tørt da du pakket det. Lagres det fuktig, blir det mugg og sur lukt, og belegget brytes ned.</li><li>Rist ut sand og barnåler, og tørk av gjørme med vann og svamp. Ikke vaskemiddel eller vaskemaskin.</li><li>Rengjør og tell pluggene.</li><li>Stapp duken i posen, eller brett den langs nye linjer hver gang. De samme brettene om og om igjen sliter på belegget.</li><li>Oppbevar teltet løst pakket, tørt og kjølig, ikke hardt komprimert.</li></ul><p>Kveil teltets barduner på samme måte som tarpens. <button class="btn small" data-nav data-act="openGuide" data-guide="tarp" data-sec="guy">Tarp ›</button></p>']]},
    tarp:{title:'Tarp', short:'Til telt, alene eller over hengekøye', sub:'Det grunnleggende for å komme i gang.', secs:[
      ['Bruk','<ul><li><b>Sammen med teltet:</b> et tørt sted å lage mat og sitte ute når det regner.</li><li><b>Alene:</b> lettere og luftigere enn telt, men mindre ly mot vind og insekter. Best om sommeren og under tregrensen.</li><li><b>Over hengekøye:</b> taket, hengt lengre enn hengekøya.</li><li><b>Som skygge</b> på varme dager og i midtdagssola.</li><li><b>I en nødsituasjon</b> kan en vindsekk eller Jervenduk rigges som et enkelt ly.</li></ul>'],
      ['Oppsett, det grunnleggende','<ul><li>Strekk en stram mønelinje mellom to trær: pålestikk i den ene enden og teltstikk i den andre, så du kan stramme den.</li><li>Bruk teltstikk på bardunene, så de kan justeres.</li><li>I dårlig vær: lavt, med ryggen mot vinden. I fint vær: høyere og mer åpent.</li><li>Stram tarpen godt og med fall, så den ikke blafrer og vannet ikke samler seg.</li></ul><p><button class="btn small" data-nav data-act="openGuide" data-guide="knots">Knuter ›</button></p>'],
      ['Pakking','<ul><li>Børst av skitt og se at tarpen er tørr. Må du pakke den våt, tørk den innen en dag eller to.</li><li><b>Rask bretting:</b> ta den midterste maljen på den ene siden i den ene hånden, og den midterste på motsatt side i den andre. Før dem sammen, ta tak midt i bretten og dra den bakover. Nå er tarpen brettet i fire, og resten brettes raskt til størrelsen på posen.</li><li>Brett langs nye linjer hver gang, eller stapp tarpen i posen. Bretter du likt hver gang, slites belegget i brettene.</li><li>Til lagring hjemme: løst pakket, som teltet.</li></ul>'],
      ['Barduner uten floker','<ul><li>Kveil hver bardun for seg før tarpen går i posen. Surr tauet i et åttetall rundt tommel og lillefinger, la ca. 10 cm være igjen, surr det rundt midten av bunten og stikk enden gjennom den siste løkken.</li><li>Har tarpen lommer i hjørnene, kan tauet stappes rett inn i dem. Ellers holder en liten strikk eller borrelåsstropp rundt hver bunt den samlet.</li><li>Lengre og tykkere tau kan hekles til en daisy chain, som åpnes med ett drag.</li><li>Løsne knuter som har strammet seg før tarpen legges bort. Teltstikkene på bardunene kan bli sittende.</li><li>Barduner med reflekstråd er lettere å se i mørket, så du ikke snubler i dem.</li></ul>','guy'],
      ['Vedlikehold','<p>Som for telt: tørk tarpen helt før den legges bort.</p>']]},
    aval:{title:'Topptur og skred', short:'Skredvarsel, terreng og faretegn', sub:'Det grunnleggende for turer i og nær skredterreng. Appen erstatter ikke et skredkurs.', secs:[
      ['Før turen','<ul><li>Sjekk skredvarselet på <a href="https://www.varsom.no" target="_blank" rel="noopener">varsom.no</a> samme dag: faregrad (1–5) og hvilket skredproblem det gjelder.</li><li>Se på bratthetskart og aktsomhetskart for snøskred når du planlegger ruten. De viser også hvor et skred kan gå.</li><li>Avtal på forhånd hvor dere snur.</li></ul>'],
      ['Terreng','<ul><li>Skred løsner som regel i heng brattere enn 30 grader. Du kan likevel bli tatt lenger ned, i utløpssonen, og et skred kan gå langt ut på flatt terreng.</li><li>Terrengfeller som renner, bekkedaler, stup og skog gjør konsekvensen av et lite skred mye verre.</li><li>Rygger er ofte tryggere enn flanker og renner, men hold god avstand til kanten. Skavler kan brekke langt inn, og ikke oppholde deg under dem.</li></ul>'],
      ['Faretegn underveis','<ul><li>Ferske skred, sprekker som skyter ut fra skiene, og drønn i snøen når den setter seg betyr ustabil snø. Snu eller velg slakere terreng.</li><li>Mye fersk snø, sterk vind som flytter snø, og rask oppvarming øker faren.</li></ul>'],
      ['Utstyr og rutiner','<ul><li>Skredsøker, søkestang og spade til hver person, og øv på å bruke dem.</li><li>Test skredsøkerne i gruppen før dere går, som står i Forberedelser.</li><li>En skredsekk er et tillegg, ikke en erstatning for gode valg.</li><li>Kjør én og én i bratte heng, og stopp på trygge steder utenfor skredløpet.</li></ul><p><b>Ta et skredkurs før du går i skredterreng.</b></p>']]},
    fire:{title:'Bål', short:'Godt bål og ild i en nødsituasjon', sub:'Det grunnleggende om bål på tur.', secs:[
      ['Før du tenner','<ul><li><b>Bålforbud:</b> det er forbudt å gjøre opp ild i eller nær skog og annen utmark fra 15. april til 15. september, med mindre det åpenbart ikke kan føre til brann. Kommunen kan ha strengere regler.</li><li>Bruk et eksisterende bålsted hvis det finnes. Unngå bart fjell, som sprekker og får merker, og hold avstand til teltet. Gnister smelter stoffet.</li><li>Sjekk vinden, og ha vann klart.</li></ul>'],
      ['Tenning','<ul><li>Samle alt før du tenner: never eller annet opptenningsmateriale, tynne kvister, tykkere pinner og ved.</li><li>Bjørkenever brenner også når den er våt. Døde kvister nederst på grantrær er som regel tørre.</li><li>Kløyv våt ved. Innsiden er ofte tørr.</li><li>Start smått og legg på gradvis. Et lite bål er lettere å holde i gang og gir bedre varme til matlaging.</li></ul>'],
      ['I en nødsituasjon','<ul><li>Bålet skal gi varme og tørke klær. Hold det lite og i le for vinden.</li><li>Tennbriketter og tennstål ligger i Ild i reparasjonssettet.</li><li>I en reell nødsituasjon går liv og helse foran.</li></ul>'],
      ['Etterpå','<ul><li>Slokk med vann til asken er kald å ta på.</li><li>Ikke brenn plast eller søppel, og forlat stedet slik du fant det.</li></ul>']]}
  },
  en:{
    shell:{title:'Shell clothing', short:'Breathability, washing and re-proofing', sub:'A quick check before and after a trip. The care label and the manufacturer\'s advice come first.', secs:[
      ['Why it matters','<p>The outer fabric has a water-repellent coating that makes water bead and roll off. When the coating wears off, the fabric soaks up water. The jacket doesn\'t leak, but it stops breathing and feels clammy inside. Dirt, sweat, sunscreen and smoke wear the coating down faster.</p>'],
      ['Before the trip','<ul><li>Sprinkle some water on the shoulders. If it beads, it\'s fine. If it darkens and soaks in, wash and re-proof the garment.</li><li>Check zips, cuffs, the hood adjustment and that the seam tape isn\'t peeling.</li></ul>'],
      ['After the trip','<ul><li>Hang it up to dry fully before storing it, away from direct heat.</li><li>Brush off dry mud, and store it hanging, not compressed.</li></ul>'],
      ['Washing','<ul><li>Wash when it\'s dirty or stops beading, following the care label (usually 30–40 °C).</li><li>Close all zips and Velcro, and use liquid detergent or a technical wash.</li><li>Never use fabric softener, bleach or dry cleaning. Rinse well.</li></ul>'],
      ['Re-proofing','<ul><li>Heat often brings back the water repellency: tumble dry on low or medium for about 20 minutes, if the label allows.</li><li>If it still doesn\'t bead, use a spray-on proofing product on the outside, then heat as the product describes.</li></ul>']]},
    boots:{title:'Hiking boots', short:'Leather, technical and ski boots', sub:'A quick check before and after a trip. The care label and the manufacturer\'s advice come first.', secs:[
      ['Before the trip','<ul><li>Check the soles and tread, stitching, the rubber rand, laces and eyelets.</li><li>Make sure the boots have been treated since the last trip.</li></ul>'],
      ['After the trip, all boots','<ul><li>Take out the insoles, loosen the laces, and brush or rinse off mud. Dried mud draws moisture out of leather.</li><li>Dry them slowly at room temperature, with newspaper inside, changed when it\'s wet.</li><li>Never by a fire, stove or radiator. Heat cracks leather and weakens the glue.</li><li>Store them dry and airy, not in a plastic bag or a hot car.</li></ul>'],
      ['Leather boots','<ul><li>When clean, treat them with wax or care products for the leather type. Smooth leather and nubuck need different products.</li><li>For boots with a membrane, avoid heavy grease. It softens the leather and reduces breathability. Use a product meant for membrane boots.</li></ul>'],
      ['Technical boots (fabric and synthetic)','<ul><li>Clean with water, and mild soap if needed. Don\'t use wax on the fabric.</li><li>Re-proof with a spray when water no longer beads.</li></ul>'],
      ['Ski boots','<p>As for hiking boots: dry slowly at room temperature, never by a fire or stove, and treat leather ski boots like leather hiking boots.</p><ul><li>If the liners come out, take them out after each day and dry them separately. That\'s where the moisture sits. In a tent, they can go in the sleeping bag overnight so they don\'t freeze.</li><li>Before the trip, check the part that meets the binding (sole edge, bar or inserts) for wear and cracks, and that it isn\'t packed with ice or dirt.</li><li>Check buckles, straps and laces.</li><li>Store plastic boots with the buckles loosely closed, so the shell keeps its shape.</li></ul>','ski']]},
    tent:{title:'Tent', short:'Check before and after a trip', sub:'A quick check before and after a trip. The manufacturer\'s advice comes first.', secs:[
      ['Before the trip','<ul><li>After storage, or before the first trip of the season, pitch the tent at home and check that everything is there: inner tent, fly, poles, pegs and guylines.</li><li>Check the pole sections and the elastic cord, the zips, the seam tape, and that water still beads on the fly.</li><li>Make sure the patch kit and a pole repair sleeve are in the repair kit.</li></ul>'],
      ['On the trip','<ul><li>The tent itself (inner tent and fly) can be packed inside the backpack instead of strapped outside. It stays dry, doesn\'t catch on branches and keeps the pack balanced. The poles go outside or along the back.</li><li>A wet fly can go in its own bag or an outer pocket, so the rest of the pack stays dry.</li><li>Avoid leaving the tent pitched in strong sun for days. Sunlight wears down the fabric.</li></ul>'],
      ['After the trip','<ul><li>Dry the tent completely within a day or two, even if it seemed dry when you packed it. Stored damp, it gets mould and a sour smell, and the coating breaks down.</li><li>Shake out sand and needles, and wipe off mud with water and a sponge. No detergent or washing machine.</li><li>Clean and count the pegs.</li><li>Stuff the fly into the bag, or fold it along new lines each time. The same creases over and over wear the coating.</li><li>Store it loosely packed, dry and cool, not tightly compressed.</li></ul><p>Coil the tent\'s guylines the same way as the tarp\'s. <button class="btn small" data-nav data-act="openGuide" data-guide="tarp" data-sec="guy">Tarp ›</button></p>']]},
    tarp:{title:'Tarp', short:'With the tent, on its own or over a hammock', sub:'The basics to get started.', secs:[
      ['Uses','<ul><li><b>With the tent:</b> a dry place for cooking and sitting outside when it rains.</li><li><b>On its own:</b> lighter and airier than a tent, but less protection from wind and insects. Best in summer and below the tree line.</li><li><b>Over a hammock:</b> the roof, hung longer than the hammock.</li><li><b>As shade</b> on hot days and in the midday sun.</li><li><b>In an emergency,</b> a bivy sack or Jervenduk can be rigged as a simple shelter.</li></ul>'],
      ['Pitching, the basics','<ul><li>Tie a tight ridgeline between two trees: a bowline at one end and a taut-line hitch at the other, so you can tighten it.</li><li>Use taut-line hitches on the guylines, so they can be adjusted.</li><li>In bad weather: low, with the back to the wind. In good weather: higher and more open.</li><li>Pitch it tight and with a slope, so it doesn\'t flap and water doesn\'t collect.</li></ul><p><button class="btn small" data-nav data-act="openGuide" data-guide="knots">Knots ›</button></p>'],
      ['Packing','<ul><li>Brush off dirt and make sure the tarp is dry. If you have to pack it wet, dry it within a day or two.</li><li><b>Quick fold:</b> take the middle eyelet on one side in one hand, and the middle eyelet on the opposite side in the other. Bring them together, then grab the middle of the fold and pull it back. The tarp is now folded in four, and the rest is quick to fold to the size of the bag.</li><li>Fold along new lines each time, or stuff the tarp into the bag. Folding the same way every time wears the coating at the creases.</li><li>For storage at home: loosely packed, as for the tent.</li></ul>'],
      ['Guylines without tangles','<ul><li>Coil each guyline separately before the tarp goes in the bag. Wrap the cord in a figure of eight around your thumb and little finger, leave about 10 cm, wrap it around the middle of the bundle and tuck the end through the last loop.</li><li>If the tarp has corner pockets, the cord can be stuffed straight into them. Otherwise a small elastic band or Velcro strap around each bundle keeps it together.</li><li>Longer, thicker rope can be chained into a daisy chain, which opens with one pull.</li><li>Untie knots that have pulled tight before storing the tarp. The taut-line hitches on the guylines can stay.</li><li>Guylines with reflective thread are easier to see in the dark, so you don\'t trip over them.</li></ul>','guy'],
      ['Care','<p>As for the tent: dry the tarp completely before storing it.</p>']]},
    aval:{title:'Ski touring and avalanches', short:'Forecast, terrain and warning signs', sub:'The basics for trips in and near avalanche terrain. The app does not replace an avalanche course.', secs:[
      ['Before the trip','<ul><li>Check the avalanche forecast on <a href="https://www.varsom.no" target="_blank" rel="noopener">varsom.no</a> the same day: the danger level (1–5) and which avalanche problem it is about.</li><li>Look at slope-angle maps and avalanche hazard maps when planning the route. They also show where an avalanche can run.</li><li>Agree in advance where you will turn back.</li></ul>'],
      ['Terrain','<ul><li>Avalanches usually release on slopes steeper than 30 degrees. You can still be caught further down, in the runout zone, and an avalanche can run far out onto flat ground.</li><li>Terrain traps such as gullies, stream beds, cliffs and forest make the consequences of even a small avalanche much worse.</li><li>Ridges are often safer than open faces and gullies, but keep well back from the edge. Cornices can break far back, and don\'t stay underneath them.</li></ul>'],
      ['Warning signs on the way','<ul><li>Fresh avalanches, cracks shooting out from your skis, and whumpf sounds as the snow settles mean unstable snow. Turn back or choose gentler terrain.</li><li>Lots of new snow, strong wind moving snow, and rapid warming increase the danger.</li></ul>'],

function bestCans(g){
  let best = null;
  for (let a = 0; a <= 12; a++) for (let b = 0; b <= 6; b++) for (let c = 0; c <= 4; c++){
    const cap = a*450 + b*230 + c*100;
    if (cap < g) continue;
    const n = a + b + c;
    if (!best || n < best.n || (n === best.n && cap < best.cap)) best = {cap, n, a, b, c};
  }
  if (!best) return '';
  return [[best.a,450],[best.b,230],[best.c,100]].filter(x => x[0]).map(x => `${x[0]} × ${x[1]} g`).join(' + ');
}
function updateFuel(){

    const l = total / 1000;

}

const wTotal = g => { const w = packW(); return w.unit === 'kg' ? `${fmt2(g / 1000)} kg` : (g >= 1000 ? `${fmt(Math.round(g)).replace(/\s/g, ' ')} g` : `${fmt(Math.round(g))} g`); };

function updateWeight(){

  const row = (label, v, sm) => `<li><span>${label}</span><span class="q${sm ? ' sm' : ''}">${wTotal(v)}</span></li>`;
  out.innerHTML = `<span class="sum-label">${T.wYour}</span><span class="sum-big">${wTotal(total)}</span>
    <ul class="food-out">${cons > 0 ? row(T.wBase, total - cons, true) + row(T.wCons, cons, true) : ''}

async function weightAction(act, id){
  const T = t(), w = packW();
  if (act === 'wAddList'){
    const picked = await pickFromList();
    if (!picked || !picked.length) return;
    picked.forEach(p => w.items.push(Object.assign({id:uid(), g:0}, p)));
    save(); render(); return;
  }
  if (act === 'wAddOwn'){
    const v = await askWeightItem(T.wAddOwn, null);
    if (!v || v === 'delete') return;
    w.items.push(Object.assign({id:uid()}, v)); save(); render(); return;
  }
  if (act === 'wEdit'){
    const it = w.items.find(x => x.id === id); if (!it) return;
    const v = await askWeightItem(it.name, it);

    if (v === 'delete'){ withUndo(T.wDeleted, () => { const pw = packW(); pw.items = pw.items.filter(x => x.id !== id); }); return; }

  }

function top(){ try { window.scrollTo(0,0); } catch(e){} }

/* ---------- sheets ---------- */
let sheetResolve = null;
let sheetPushed = false, ignorePop = false;
function openSheet(html){
  const m = html.match(/^\s*<h3>([\s\S]*?)<\/h3>/);
  const title = m ? m[1] : '';
  const rest = m ? html.slice(m[0].length) : html;
  panel.innerHTML = `<div class="sheet-top"><h3>${title}</h3><button class="sheet-x" data-sheet-close aria-label="${t().close}">✕</button></div>` + rest;
  panel.querySelector('[data-sheet-close]').onclick = () => closeSheet(null);
  overlay.hidden = false;
  if (!sheetPushed){ sheetPushed = true; history.pushState(Object.assign({}, history.state || {}, {sheet:true}), ''); }
  const f = panel.querySelector('input,textarea');
  if (f) setTimeout(() => f.focus(), 30);
}
function closeSheet(val){
  overlay.hidden = true;
  panel.innerHTML = '';
  if (sheetResolve){ const r = sheetResolve; sheetResolve = null; r(val); }
  setTimeout(() => {
    if (overlay.hidden && sheetPushed){ sheetPushed = false; ignorePop = true; history.back(); }
  }, 0);
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(null); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(null); });

function askText(title, value, ok, allowEmpty){
  const T = t();
  return new Promise(res => {
    sheetResolve = res;
    openSheet(`<h3>${esc(title)}</h3>
      <input type="text" id="askInput" value="${esc(value || '')}">
      <div class="row"><button class="btn" data-s="cancel">${T.cancel}</button><button class="btn primary" data-s="ok">${esc(ok || T.save)}</button></div>`);
    const inp = $('askInput');
    const done = () => { const v = inp.value.trim(); closeSheet(allowEmpty ? v : (v || null)); };
    panel.querySelector('[data-s=ok]').onclick = done;
    panel.querySelector('[data-s=cancel]').onclick = () => closeSheet(null);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
    setTimeout(() => inp.select(), 40);
  });
}
function confirmBox(title, msg, ok){
  const T = t();
  return new Promise(res => {
    sheetResolve = res;
    openSheet(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="row"><button class="btn" data-s="cancel">${T.cancel}</button><button class="btn primary" data-s="ok">${esc(ok)}</button></div>`);
    panel.querySelector('[data-s=ok]').onclick = () => closeSheet(true);
    panel.querySelector('[data-s=cancel]').onclick = () => closeSheet(false);
  });
}

async function listAction(a, id){
  const T = t();
  if (state.field && ['new', 'copy', 'edit', 'rename', 'dup', 'reset', 'delete', 'backup', 'startOver'].indexOf(a) >= 0) return;
  const L = id && id !== 'std' ? ownList(id) : null;
  if (a === 'new'){
    const choice = await new Promise(res => {
      sheetResolve = res;
      openSheet(`<h3>${T.newList}</h3><p>${T.newListMsg}</p><div class="choices">
        <button class="choice" data-tpl="std"><span class="c-name">${esc(stdList().name)}</span><span class="c-sub">${T.fromStd}</span></button>
        <button class="choice" data-tpl="blank"><span class="c-name">${T.emptyList}</span><span class="c-sub">${T.emptySub}</span></button></div>`);
      panel.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => closeSheet(b.dataset.tpl));
    });
    if (!choice) return;
    const name = await askText(T.nameList, choice === 'blank' ? T.myList : stdList().name, T.create);
    if (!name) return;
    const nl = choice === 'blank' ? {id:uid(), name, notes:'', modes:{}, cats:[]} : cloneList(stdList(), false);
    nl.name = name; nl.tripType = false;
    state.lists.push(nl); selList = nl.id; save();
    go('list', 'edit:' + nl.id);
  } else if (a === 'copy'){
    const name = await askText(T.nameList, stdList().name, T.create);
    if (!name) return;
    const nl = cloneList(stdList(), false); nl.name = name; nl.tripType = false;
    state.lists.push(nl); selList = nl.id; save();
    go('list', 'edit:' + nl.id);
  } else if (a === 'edit' && L){
    go('list', 'edit:' + L.id);
  } else if (a === 'rename' && L){
    const v = await askText(T.renameList, L.name, T.rename);
    if (v){ L.name = v; save(); render(); }
  } else if (a === 'dup' && L){
    const v = await askText(T.copyName, L.name + T.copySuffix, T.duplicate);
    if (v){ const c = cloneList(L, false); c.name = v; c.tripType = false; state.lists.push(c); selList = c.id; save(); render(); }
  } else if (a === 'share' && L){
    shareList(L);
  } else if (a === 'startOver'){
    if (await confirmBox(T.startOverQ, T.startOverMsg, T.startOverOk)){
      withUndo(T.startOverDone, () => {
        state.std.done = {}; state.std.modes = {}; state.std.open = {};
        state.lists.forEach(x => { x.modes = {}; x.cats.forEach(c => { delete c.open; c.items.forEach(i => i.done = false); }); });
        state.main = 'std'; selList = 'std';
        state.field = false; state.rainLocked = false; rainLocked = false;
        state.hidePacked = false; state.listLock = false; editing = false;
        stdCache = null; tab = 'list'; view = null;
      });
      history.replaceState({tab:'list', view:null, depth:0}, '');
      updateWake(); top();
    }
  } else if (a === 'reset'){
    const target = L || stdList();
    if (await confirmBox(T.resetQ, T.resetMsg(target.name), T.resetOk)){
      withUndo(T.resetDone, () => {
        if (!L) state.std.done = {};
        else L.cats.forEach(c => c.items.forEach(i => i.done = false));
        stdCache = null;
      });
    }
  } else if (a === 'delete' && L){
    if (await confirmBox(T.delList, T.delListMsg(L.name), T.delListOk)){
      withUndo(T.listDeleted, () => {
        state.lists = state.lists.filter(x => x.id !== L.id);
        if (state.main === L.id) state.main = 'std';
        selList = state.main || 'std';
      });
    }
  } else if (a === 'backup'){
    backupSheet();
  } else if (a === 'howto'){
    go('list', 'howto');
  } else if (a === 'intro'){
    showIntro(0);
  }
}

function backupSheet(){
  const T = t();
  const data = JSON.stringify({app:'trip-checklist', version:2, lists:state.lists, notes:state.notes});
  openSheet(`<h3>${T.backup}</h3>
    <p>${T.bkMsg}</p>
    <textarea id="bkOut" readonly>${esc(data)}</textarea>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="bkCopy">${T.bkCopy}</button></div>
    <div class="status" id="bkStatus"></div>
    <div class="section-label">${T.restore}</div>
    <textarea id="bkIn" placeholder="${esc(T.bkPaste)}"></textarea>
    <div class="row"><button class="btn" data-s="cancel">${T.close}</button><button class="btn primary" id="bkRestore">${T.bkAdd}</button></div>`);
  const status = $('bkStatus');
  panel.querySelector('[data-s=cancel]').onclick = () => closeSheet(null);
  $('bkCopy').onclick = async () => {
    const ta = $('bkOut');
    try { await navigator.clipboard.writeText(ta.value); status.textContent = T.bkCopied; }
    catch(e){ ta.select(); try { document.execCommand('copy'); status.textContent = T.bkCopied; } catch(_){ status.textContent = T.bkManual; } }
  };
  $('bkRestore').onclick = () => {
    try {
      const obj = JSON.parse($('bkIn').value);
      if (!obj || !Array.isArray(obj.lists)) throw 0;
      let added = 0, notesIn = 0;
      obj.lists.forEach(l => {
        if (!l || typeof l.name !== 'string' || !Array.isArray(l.cats)) return;
        const c = cloneList(l, true); c.tripType = !!l.tripType; c.sharedIn = !!l.sharedIn; notesFromList(c); state.lists.push(c); added++;
      });
      if (Array.isArray(obj.notes)) obj.notes.forEach(n => {
        if (!n || typeof n.text !== 'string' || state.notes.some(x => x.id === n.id)) return;
        state.notes.push({id:typeof n.id === 'string' ? n.id : uid(), title:String(n.title || ''), text:n.text, t:+n.t || Date.now()}); notesIn++;
      });
      if (!added && !notesIn) throw 0;
      save(); render();
      status.textContent = T.bkAdded(added);
      $('bkIn').value = '';
    } catch(e){ status.textContent = T.bkBad; }
  };
}

/* ---------- main interactions ---------- */
main.addEventListener('click', async e => {
  const wu = e.target.closest('[data-wunit]');
  if (wu){ packW().unit = wu.dataset.wunit; save(); render(); return; }
  const fs_ = e.target.closest('[data-foodseason]');
  if (fs_){ foodState().season = fs_.dataset.foodseason; save(); render(); return; }
  const fdt = e.target.closest('[data-foodtoggle]');
  if (fdt){ const f = foodState(); f[fdt.dataset.foodtoggle] = !f[fdt.dataset.foodtoggle]; save(); render(); return; }
  const ft = e.target.closest('[data-fueltype]');
  if (ft){ fuelState().fuel = ft.dataset.fueltype; save(); render(); return; }
  const fm = e.target.closest('[data-fuelmode]');
  if (fm){ fuelState().mode = fm.dataset.fuelmode; save(); render(); return; }
  const cm = e.target.closest('[data-calcmode]');
  if (cm){ state.calc.mode = cm.dataset.calcmode; save(); render(); return; }
  const chip = e.target.closest('[data-mode]');
  if (chip){
    if (state.listLock){ showToast(t().lockedMsg); return; }
    const l = cur(); l.modes = l.modes || {};
    l.modes[chip.dataset.mode] = !l.modes[chip.dataset.mode];
    save(); render(); return;
  }
  const sl = e.target.closest('[data-sel]');
  if (sl){ selList = selList === sl.dataset.sel ? null : sl.dataset.sel; render(); return; }
  const rl = e.target.closest('[data-role]');
  if (rl){
    const id = rl.dataset.id;
    const L = ownList(id);
    const dropTrip = () => { if (!L) return; L.tripType = false; [stdList()].concat(state.lists).forEach(x => { if (x.modes) delete x.modes['L:' + id]; }); };
    if (rl.dataset.role === 'main'){
      // the two roles rule each other out; switching an own list off falls back to the standard list
      if (L && state.main === id) state.main = 'std';
      else { state.main = id; dropTrip(); }
    } else if (L){
      if (L.tripType) dropTrip();
      else { L.tripType = true; if (state.main === id) state.main = 'std'; }
    }
    save(); render(); return;
  }
  const la = e.target.closest('[data-la]');
  if (la){ listAction(la.dataset.la, la.dataset.id); return; }
  const sk = e.target.closest('.skin-btn[data-skin]');
  if (sk){ state.skin = sk.dataset.skin; save(); render(); return; }
  const lg = e.target.closest('[data-lang]');
  if (lg){ state.lang = lg.dataset.lang; stdCache = null; save(); render(); return; }
  const op = e.target.closest('[data-open]');
  if (op){ go(tab, 'tool:' + op.dataset.open); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const T = t(), act = b.dataset.act;
  if (act === 'back'){ goBack(); return; }
  if (act === 'cStart'){ startCompass(); return; }
  if (act === 'getPos'){ getPos(); return; }
  if (act === 'addLink'){
    const name = await askText(T.linkName, '', T.add); if (!name) return;
    const url = await askText(T.linkUrl, 'https://', T.add); if (!url) return;
    if (!/^https?:\/\/\S+\.\S+/.test(url)){ await confirmBox(T.addLink, T.linkBad, T.ok); return; }
    state.links = (state.links || []).concat([{n:name, u:url}]); save(); renderCompass(); return;
  }
  if (act === 'delLink'){ const n = +b.dataset.n; withUndo(T.linkDeleted, () => { state.links.splice(n, 1); }); return; }
  if (act === 'cHold'){ cHeld = !cHeld; renderCompass(); return; }
  if (act === 'cSkyNow'){ state.skyNow = !skyOn('now'); save(); renderCompass(); return; }
  if (act === 'cRiseSet'){ state.skyRiseSet = !skyOn('rs'); save(); renderCompass(); return; }
  if (act === 'fieldToggle'){ state.field = !state.field; if (!state.field){ rainLocked = false; state.rainLocked = false; } editing = false; save(); render(); updateWake(); return; }
  if (act === 'nightToggle'){ state.night = !state.night; save(); render(); return; }
  if (act === 'rainLock'){ lockRain(); return; }
  if (act === 'undoTick'){ if (lastTick){ const c = findCat(lastTick.cat); const it = c && c.items.find(i => i.id === lastTick.item); if (it){ setDone(c, it, lastTick.prev); save(); } lastTick = null; render(); } return; }
  if (act === 'hideToggle'){ state.hidePacked = !state.hidePacked; save(); render(); return; }
  if (act === 'lockToggle'){ state.listLock = !state.listLock; save(); render(); showToast(state.listLock ? T.lockedOn : T.lockedOff); return; }
  if (act === 'modesToggle'){ modesOpen = !modesOpen; render(); return; }
  if (act === 'resetRate'){ const f = fuelState(); delete f.perLc[f.fuel]; save(); render(); return; }
  if (act === 'fuelSnow'){ const f = fuelState(); f.snow = !f.snow; save(); render(); return; }
  if (act === 'fuelDog'){ const f = fuelState(); f.dog = !f.dog; save(); render(); return; }
  if (act === 'openBag'){ go(tab, b.dataset.bag); return; }
  if (act === 'wAddList' || act === 'wAddOwn' || act === 'wEdit'){ weightAction(act, b.dataset.id); return; }
  if (act === 'newNote' || act === 'editNote'){
    if (state.field) return;
    const n = act === 'editNote' ? state.notes.find(x => x.id === b.dataset.id) : null;
    const v = await askNote(n ? T.noteEdit : T.newNote, n);
    if (!v) return;
    if (n){ n.title = v.title; n.text = v.text; n.t = Date.now(); save(); render(); }
    else { const nn = {id:uid(), title:v.title, text:v.text, t:Date.now()}; state.notes.push(nn); save(); go('notes', 'note:' + nn.id); }
    return;
  }
  if (act === 'delNote'){
    if (state.field) return;
    const id = b.dataset.id;
    view = null; history.replaceState({tab, view:null, depth:(history.state && history.state.depth) || 0}, '');
    withUndo(T.noteDeleted, () => { state.notes = state.notes.filter(x => x.id !== id); });
    return;
  }
  if (act === 'openNote'){ go('notes', 'note:' + b.dataset.id); return; }
  if (act === 'openGuide'){ guideSec = b.dataset.sec || null; go('guide', 'tool:' + b.dataset.guide); return; }
  if (act === 'lightToggle'){ if (state.listLock){ showToast(T.lockedMsg); return; } const bg = findCat(view); if (bg){ setLight(bg, !bg.lightOnly); save(); render(); } return; }
  const catEl = b.closest('[data-cat]');
  const cat = catEl ? findCat(catEl.dataset.cat) : null;
  const itemEl = b.closest('[data-item]');
  const item = cat && itemEl ? cat.items.find(i => i.id === itemEl.dataset.item) : null;

  if (act === 'toggleCat'){ if (!view){ setOpen(cat, !cat.open); save(); render(); } }
  else if (act === 'toggleItem'){
    if (state.listLock && !editing){ showToast(T.lockedMsg); return; }
    if (state.field && !tapOk()) return;
    lastTick = {cat:cat.id, item:item.id, prev:item.done};
    setDone(cat, item, !item.done); save(); render();
  }
  else if (act === 'indentItem'){ item.sub = !item.sub; save(); render(); }
  else if (act === 'noteCat'){
    const v = await askText(T.editCatNote, cat.note || '', T.save, true);
    if (v !== null && v !== undefined){ cat.note = v; save(); render(); }
  }
  else if (act === 'renameItem'){
    const v = await askText(T.renameItem, item.text, T.save);
    if (v){ item.text = v; save(); render(); }
  }
  else if (act === 'deleteItem'){ withUndo(T.itemDeleted, () => { cat.items = cat.items.filter(i => i.id !== item.id); }); }
  else if (act === 'addItem'){ addItem(cat.id); }
  else if (act === 'renameCat'){
    const v = await askText(T.renameCat, cat.name, T.save);
    if (v){ cat.name = v; save(); render(); }
  }
  else if (act === 'deleteCat'){
    if (await confirmBox(T.delCatQ, T.delCatMsg(cat.name, cat.items.length), T.delCat)){
      withUndo(T.catDeleted, () => { cur().cats = cur().cats.filter(c => c.id !== cat.id); if (view === cat.id) view = null; });
    }
  }
  else if (act === 'addCat'){
    const v = await askText(T.newCat, '', T.addCat);
    if (v){
      const nc = {id:uid(), name:v, note:'', mode:null, bag:false, open:true, items:[]};
      cur().cats.push(nc); save(); render();
      const inp = main.querySelector(`[data-add="${nc.id}"]`); if (inp) inp.focus();
    }
  }
});
main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.add) addItem(e.target.dataset.add);
});
function addItem(catId){
  const inp = main.querySelector(`[data-add="${catId}"]`);
  const v = inp && inp.value.trim();
  if (!v) return;
  findCat(catId).items.push({id:uid(), text:v, done:false, sub:false, link:null, light:false});
  save(); render();
  const again = main.querySelector(`[data-add="${catId}"]`);
  if (again) again.focus();
}

$('hdrLock').onclick = () => { if (!rainLocked && (!state.field || tapOk())) lockRain(); };
$('listBtn').onclick = () => { if ($('listBtn').classList.contains('plain')) return; selList = null; go('list', 'lists'); };
$('tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  if (state.field && !tapOk()) return;
  if (b.dataset.tab === tab && !view) return;
  go(b.dataset.tab, null);
});

/* ---------- navigation history (Android back button) ---------- */
function go(newTab, newView){
  if (rainLocked) extendNav();
  tab = newTab; view = newView;
  const st = history.state || {};
  const depth = (st.depth || 0) + 1;
  if (sheetPushed && overlay.hidden){
    // a closed sheet still owns the top history entry: reuse it for the new screen
    sheetPushed = false;
    history.replaceState({tab, view, depth}, '');
  } else {
    history.pushState({tab, view, depth}, '');
  }
  render(); top();
}
function goBack(){
  if (history.state && history.state.depth > 0) history.back();
  else { view = null; history.replaceState({tab, view:null, depth:0}, ''); render(); top(); }
}
history.replaceState({tab, view, depth:0}, '');
window.addEventListener('popstate', e => {
  if (ignorePop){ ignorePop = false; return; }
  if (!$('intro').hidden){ $('intro').hidden = true; state.introDone = true; save(); const f = introThen; introThen = null; if (f) f(); return; }
  if (!overlay.hidden){ sheetPushed = false; closeSheet(null); return; }
  if (rainLocked && !navOpen()){ history.pushState(Object.assign({}, history.state || {}, {lock:true}), ''); return; }
  if (rainLocked) extendNav();
  const st = e.state || {tab:'list', view:null};
  tab = st.tab || 'list'; view = st.view || null;
  render(); top();
});

/* ---------- undo ---------- */
let toastTimer = null;
function showToast(msg){
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3000);
}
function withUndo(msg, fn){
  const snap = JSON.stringify(state);
  fn(); stdCache = null; save(); render();
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span><button>${t().undo}</button>`;
  el.hidden = false;
  el.querySelector('button').onclick = () => { state = JSON.parse(snap); stdCache = null; save(); el.hidden = true; render(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 7000);
}

/* ---------- outdoor mode: strict taps, rain lock, wake lock ---------- */
// Rain lock rule: anything that only changes what you see carries data-nav (fold-out sections count automatically).
// It works in the navigation window and restarts the timer; anything that changes data stays locked.
document.addEventListener('click', e => { if (rainLocked && navOpen() && e.target.closest('[data-nav], summary')) extendNav(); }, true);
const ptrs = new Map();
let multi = false, lastTap = {ok:true, t:0};
document.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, t:Date.now()});
  if (ptrs.size > 1) multi = true;
}, true);
document.addEventListener('pointerup', e => {
  const p = ptrs.get(e.pointerId);
  if (p){
    const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y), dt = Date.now() - p.t;
    lastTap = {ok: !multi && dist < 12 && dt < 700, t: Date.now()};
  }
  ptrs.delete(e.pointerId);
  if (!ptrs.size) setTimeout(() => { if (!ptrs.size) multi = false; }, 0);
}, true);
document.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); lastTap = {ok:false, t:Date.now()}; }, true);
function tapOk(){ return Date.now() - lastTap.t > 800 || lastTap.ok; }

let navUntil = 0, navTimer = null;
const NAV_MS = 3000;
function navOpen(){ return Date.now() < navUntil; }
function lockRain(){ if (!state.field) return; rainLocked = true; state.rainLocked = true; save(); navUntil = 0; render(); }
function lockUi(){
  // update only the lock state and the lock bar, so open sections and scroll position stay as they are
  document.body.classList.toggle('navopen', rainLocked && navOpen());
  if (rainLocked) renderLock();
}
function openNav(){
  navUntil = Date.now() + NAV_MS;
  clearTimeout(navTimer);
  navTimer = setTimeout(() => { navUntil = 0; if (rainLocked) lockUi(); }, NAV_MS + 30);
  lockUi();
}
function extendNav(){ if (navOpen()) openNav(); }
function holdButton(btn, ms, fn){
  let timer = null, holding = false;
  const start = e => {
    if (e.cancelable) e.preventDefault();
    if (holding) return;
    holding = true; btn.classList.add('holding');
    timer = setTimeout(() => { holding = false; btn.classList.remove('holding'); fn(); }, ms);
  };
  const stop = () => { holding = false; btn.classList.remove('holding'); clearTimeout(timer); };
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
  btn.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' || e.pointerType === 'pen') start(e); });
  btn.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') stop(); });
  btn.addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') stop(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function renderLock(){
  const T = t(), open = navOpen(), left = Math.max(0, navUntil - Date.now());
  $('rainlock').innerHTML = `<p class="lock-note">${open ? T.navOpenNote : T.lockNote}</p>
    <div class="nav-time"><i id="navTime"></i></div>
    <div class="lock-btns">
      <button class="unlock" id="navBtn"><span class="fill"></span><span>${T.navHold}<small>${T.holdShort}</small></span></button>
      <button class="unlock" id="unlockBtn"><span class="fill"></span><span>🔒 ${T.unlockTxt}<small>${T.holdLong}</small></span></button>
    </div>`;
  const bar = $('navTime');
  if (open){
    bar.style.width = (left / NAV_MS * 100) + '%';
    requestAnimationFrame(() => { bar.style.transition = `width ${left}ms linear`; bar.style.width = '0'; });
  }
  holdButton($('navBtn'), 1000, openNav);
  holdButton($('unlockBtn'), 1000, () => { rainLocked = false; state.rainLocked = false; save(); navUntil = 0; clearTimeout(navTimer); render(); });
}
let wakeLock = null;
async function updateWake(){
  try {
    if (state.field && document.visibilityState === 'visible'){
      if (!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', updateWake);

render();
updateWake();
if (!state.introDone) showIntro(0, checkShared); else checkShared();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  // a new version takes over: reload once so it is in use straight away
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(() => {}); });
}
})();
</script>
