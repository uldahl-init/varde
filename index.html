      ['Otter', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-otter.svg" style="width:100px"></div></figure><ul><li>About 5–7 cm, up to 7–9 cm with the heel pad. Five toes; the webbing seldom shows.</li><li>Tracks along water, riverbanks and the coast. In snow the otter often slides on its belly and leaves a groove.</li></ul>', 'otter'],
      ['Ptarmigan', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-grouse.svg" style="width:88px"></div></figure><ul><li>About 4.5 cm, three toes forward. In winter the feathered toes make the print broad and blurred.</li><li>Often many tracks together. Wing marks in the snow where a ptarmigan has landed or taken off, and hollows where it has dug in for the night.</li></ul>', 'grouse']]},
    animals:{title:'Meeting animals', short:'Moose, grazing animals, adders, ticks and bears', sub:'Most meetings with animals go well. Keep your distance, and give the animals plenty of room.', secs:[
      ['Moose', '<ul><li>Moose are normally shy and move away. Keep your distance: 50 metres can be too close. Go round or wait.</li><li>If the moose shows signs of irritation, you are too close. Take special care with a cow with a calf, which can be easier to provoke than a bull.</li><li>A moose that attacks kicks with its front legs. A cow without antlers is therefore as dangerous as a bull.</li><li>Do not send the dog towards the moose, and do not make half-hearted attempts to chase it away.</li></ul>', 'moose'],
      ['Grazing animals', '<ul><li>Cows are curious and may come close without being dangerous. Keep a good distance, especially with children and a dog.</li><li>Never walk up to a calf, and never between a cow and its calf.</li><li>Preferably do not take a dog into a pasture with cows: the cows see the dog as a predator.</li><li>In Norway dogs must be on a lead from 1 April to 20 August, also when you see no animals. Many municipalities have a longer period, so check where you walk.</li><li>Close gates behind you.</li></ul>', 'grazing'],
      ['Adder', '<ul><li>Norway’s only venomous snake. Found over most of southern Norway and north to Rana, mostly on sunny slopes, heather, bogs and by stone walls, also in the mountains where there is bilberry.</li><li>It usually slithers away, but bites if it is trodden on or you come too close. Good shoes or boots give some protection, but in summer adders can be almost anywhere: watch where you put your feet.</li><li><b>If someone is bitten:</b> keep the person still, and keep the limb raised and still. Contact a doctor or Poisons Information (Giftinformasjonen, 22 59 13 00). With severe symptoms: call [[em]].</li><li>The adder is protected.</li></ul>', 'adder'],
      ['Ticks', '<ul><li>Ticks are common along the coast from Østfold to Nordland, and are active from April to November, most in spring. They thrive in damp grass, bushes and scrub.</li><li>Wear long trousers, and keep your ankles well covered.</li><li>Check your body and hair for ticks after the trip, and check the dog daily.</li><li>Remove the tick as quickly as possible, with tweezers or a tick remover. Removed within a day, the risk of Lyme disease is low.</li><li>If a red ring grows around the bite, contact a doctor. It is the most common sign of Lyme disease.</li><li>There is a vaccine against tick-borne encephalitis (TBE). Ask a doctor whether you should have it.</li></ul>', 'ticks'],
      ['Bears', '<p><b>This advice is for brown bears in Norway and Sweden.</b> Other bear species behave differently, and advice for one species can be wrong and dangerous for another. Elsewhere: follow the advice that applies there.</p><ul><li>A bear usually notices you first and moves away. Make yourself heard: talk, step on twigs, and keep the dog on a lead.</li><li><b>If it has not seen you:</b> stop, stay calm, do not run, and back away quietly.</li><li><b>If it has seen you:</b> talk in a normal voice, do not shout or wave your arms, and back away calmly. A bear that stands up on its hind legs is only trying to get an overview.</li><li><b>If it stays put, or huffs:</b> go back the way you came, not around it. It may have cubs or food nearby.</li><li><b>If it follows you:</b> do not run, talk calmly, and drop something (a hat, a berry bucket) in front of you while you back away.</li><li><b>If it attacks</b>, which is extremely rare: play dead only as a last resort. Lie on your stomach or curl up, protect your neck with your hands, and lie still until the bear has gone.</li></ul><p><b>Polar bears on Svalbard are something else entirely,</b> and the advice above does not apply. Polar bears can be deadly dangerous. Outside the settlements the law requires you to know how to protect yourself against polar bears and to carry means of scaring them away, and you must keep at least 300 metres away (500 metres from 1 March to 30 June). The Governor of Svalbard (Sysselmesteren) says: do not leave the settlements without a suitable firearm and experience in using it. Follow the Governor’s advice, or go on an organised trip.</p><p><b>Black bears (North America) are different too:</b> if a black bear attacks, the advice is the opposite of that for brown bears. Do not play dead, get into a car or a building if you can, and otherwise fight back. Always follow the local advice where you are.</p>', 'bear']]},
    ski:{title:'Skis: wax and skins', short:'Grip wax, skins and glide wax', sub:'Grip on the climbs, glide on the way down, skins that stay on.', secs:[
      ['Grip wax','<ul><li><b>Wax or klister:</b> Grip wax comes as hard wax for dry snow and klister for wet snow. The colder the snow, the harder the wax. Klister is for wet, old, coarse-grained snow or icy tracks. On new snow, hard wax is usually best, even around zero.</li><li><b>Read your skis:</b> Wax that is too soft for cold snow lets the snow in: the skis clog and ice up. Scrape it off and use a harder wax. If the skis slip, use a softer wax.</li><li><b>Applying:</b> Wax indoors before the trip, in thin layers, corking each layer. Klister goes on in a herringbone pattern in the grip zone and is smoothed out. On hard or coarse snow, grip lasts longer with a base wax underneath. Let the skis cool outside before you set off, or snow will stick to the wax.</li><li><b>On the trip:</b> Bring hard wax, klister and a scraper, especially when the temperature changes during the day.</li></ul>', 'wax'],
      ['Skins','<ul><li><b>Short or long skins:</b> Short skins are common on fjellski and sit in a fitting on skis made for them. Long skins cover the whole base and are used for topptur, and sometimes on ordinary fjellski when it is steep. Care and storage are the same for both.</li><li><b>The glue side:</b> Keep the glue clean and dry: never against snow, floors, carpets or clothing. If snow gets on the glue, pull the glue side across the steel edge of the ski.</li><li><b>Skins icing up:</b> Skin wax on the plush stops clogging and icing. Keep it in your pack.</li><li><b>In the cold:</b> When the skins are off, carry them inside your jacket so the glue does not get too cold.</li><li><b>Heat:</b> Keep skins away from stoves and fires. The glue does not tolerate heat.</li><li><b>After the trip:</b> Dry the skins completely. Store them glue to glue or on the saver sheet they came with. Both work; choose whichever is more practical for you.</li></ul>', 'skins'],
      ['At home','<p>Clean the base before waxing. Glide wax is ironed in, left to cool, scraped and brushed. Scrape and brush well: glide wax residue can weaken skin glue. Use fluorine-free glide wax. Old fluoro wax is handed in as hazardous waste.</p>']]},
    pack:{title:'Packing your backpack', short:'Zones, keeping dry and adjusting', sub:'Heavy against your back, what you need on top.', secs:[
      ['How to pack','<figure class="sb-fig"><div data-svgsrc="guides/pack-zones.svg"></div></figure><ul><li><b>Heavy against your back:</b> Food, fuel, pot and water in the middle of the pack, close to your back and roughly between your shoulder blades.</li><li><b>Light and bulky at the bottom:</b> The sleeping bag and anything else you won\'t need before the evening.</li><li><b>On top and in the lid:</b> What you need on the way: an extra layer, rain gear, lunch, map, head torch and first aid kit. Snacks and sunscreen in the hip-belt or side pockets.</li><li><b>Outside:</b> As little as possible. It snags, gets wet and makes the pack sway.</li><li><b>Dry:</b> Pack in dry bags, or use a large bag as a liner, and keep the rain cover handy.</li></ul>', 'zones'],
      ['Adjusting the pack','<p>Tighten the hip belt first, so it carries most of the weight. Then the shoulder straps, and the load lifters last.</p><p>[[plan:weight]]</p>']]},
    repair:{title:'Repairs on the trip', short:'Fix it on the trip', sub:'Patching, sleeping pads and tent poles.', secs:[
      ['Patching fabric','<ul><li><b>Patching fabric:</b> Clean with an alcohol wipe and let it dry. Cut the patch with round corners and a good margin around the hole. Patch both sides when you can.</li><li><b>A tear at an edge:</b> Lay the nylon cord along the edge, fold the patch over it, and put a patch on the back too. That way it doesn\'t tear again when the fabric is under strain.</li></ul><figure class="sb-fig"><div data-svgsrc="guides/edge-repair.svg"></div></figure>', 'patch'],
      ['A leak in the sleeping pad','<p>Inflate it and listen, or spread on water with a little soap and look for bubbles. Mark the spot, dry it, and glue and patch as the repair kit describes. Let the glue dry before you inflate it again.</p>', 'pad'],
      ['A broken tent pole','<p>Slide the repair sleeve over the break and tape it at both ends with duct tape. Without a sleeve, splint it with a peg or a straight stick and tape it well.</p>', 'pole']]},
    fire:{title:'Campfire', short:'A good fire, and fire in an emergency', sub:'The basics of making a fire on a trip.', secs:[
      ['Before you light it','<ul><li><b>Fire ban:</b> in Norway, lighting fires in or near forest and other open country is banned from 15 April to 15 September, unless there is clearly no chance of a fire spreading. The municipality may have stricter rules.</li><li>Use an existing fire pit if there is one. Avoid bare rock, which cracks and gets marked, and keep away from the tent. Sparks melt the fabric.</li><li>Check the wind, and have water ready.</li></ul>'],
      ['Lighting it','<ul><li>Gather everything before you strike a match: tinder, thin twigs, thicker sticks and firewood.</li><li>Birch bark burns even when wet. Dead twigs at the bottom of spruce trees are usually dry.</li><li>Split wet wood. The inside is often dry.</li><li>Start small and add fuel gradually. A small fire is easier to keep going and gives better heat for cooking.</li></ul>'],
      ['Fire steel','<figure class="sb-fig"><div data-svgsrc="guides/firesteel.svg"></div></figure><ul><li><b>How to strike:</b> Hold the striker or a sharp knife spine still, close to the tinder, and pull the rod back towards you. That way you don\'t knock the tinder away.</li><li><b>Tinder:</b> Birch bark, firelighter pouches or anything else that catches from a spark. Have everything ready before you strike.</li></ul>', 'steel'],
      ['In an emergency','<ul><li>The fire is for warmth and drying out. Keep it small and sheltered from the wind.</li><li>Firelighter pouches and the fire steel are under Fire in the repair kit.</li><li>In a real emergency, life and health come first.</li></ul>'],
      ['Afterwards','<ul><li>Put it out with water until the ashes are cold to the touch.</li><li>Don\'t burn plastic or rubbish, and leave the place the way you found it.</li></ul>']]},
    nightdir:{title:"Directions at night", short:"North and south by the stars", sub:"Find north, south, east and west by the stars and the Moon. Knowledge and a backup, not a replacement for map and compass.", secs:[
      ["North by the North Star", "<figure class=\"sb-fig\"><div data-svgsrc=\"guides/sky-north.svg\"></div></figure><p>For the northern hemisphere.</p><ol><li>Find the Big Dipper (the Plough), the seven bright stars in Ursa Major.</li><li>Follow the line through the two outer stars of the bowl (Merak and Dubhe) about five times the distance between them.</li><li>That is Polaris, the North Star, less bright than many expect. Straight below it, at the horizon, is true north.</li></ol><p><b>Cassiopeia as a backup:</b> the W-shaped Cassiopeia sits on the opposite side of Polaris, about as far away as the Big Dipper. When one is low or hidden, the other is often well placed.</p><p>Everything in the sky turns around Polaris through the night. It stays put; other stars give a direction only there and then.</p>", "north"],
      ["South by the Southern Cross", "<figure class=\"sb-fig\"><div data-svgsrc=\"guides/sky-south.svg\"></div></figure><p>For the southern hemisphere, where there is no bright pole star.</p><ol><li>Find the Southern Cross and the two bright Pointers beside it, Alpha and Beta Centauri. The Pointers help you tell the true cross from similar patterns.</li><li>Extend the long axis of the cross.</li><li>Draw a line out at right angles from the midpoint between the two Pointers.</li><li>Where the lines meet is the south celestial pole. Straight below it, at the horizon, is south.</li></ol>", "south"],
      ["East and west by Orion's Belt", "<figure class=\"sb-fig\"><div data-svgsrc=\"guides/sky-orion.svg\"></div></figure><p>Orion's Belt is three stars in a row in the middle of Orion, and it is seen from both hemispheres. The westernmost of them (Mintaka) lies almost on the celestial equator. So it rises close to due east and sets close to due west, wherever you are.</p><p>From the southern hemisphere Orion is upside down.</p>", "eastwest"],
      ["Roughly by the crescent Moon", "<p>Draw a line through the two tips of a crescent Moon and extend it down to the horizon. In the northern hemisphere it points roughly south, in the southern hemisphere roughly north.</p><p>Best when the Moon is high. Low in the east or west, the error is large.</p><p>The crescent lies differently through the year and from place to place. <button class=\"btn small\" data-nav data-act=\"openGuide\" data-guide=\"nightsky\" data-sec=\"moon\">The night sky: The Moon ›</button></p>", "moon"],
      ["The North Star, latitude and compass", "<ul><li>Polaris lies less than one degree from the north celestial pole, so it shows true north, not magnetic north.</li><li><b>Latitude:</b> Polaris's height above the horizon roughly equals your latitude. At the equator it sits on the horizon, at the North Pole straight overhead.</li><li><b>Measure by hand:</b> a fist at arm's length covers about 10 degrees. Count fists from the horizon up to Polaris.</li><li><b>Check the compass:</b> compare the compass needle with Polaris. The difference is the declination where you are.</li><li>In the south, the Southern Cross gives direction, but not latitude with any accuracy.</li></ul><p>Stars are knowledge and a backup. Clouds can hide them when you need them most, so always carry map and compass.</p><p><button class=\"btn small\" data-nav data-act=\"openGuide\" data-guide=\"mapcompass\">Map and compass ›</button></p>", "measure"],
      ["Stories", "<p>The old traditions vary between peoples and were often written down late.</p><ul><li>In Sámi tradition the sky is a bowl held up by a support at the North Star: Boahji or Boahjenaste, «the sky support». If the support breaks, the world ends.</li><li>The hunter Fávdna (the star Arcturus) has the Big Dipper as his bow and arrow. He must aim well: if he hits Boahjenaste, the world ends.</li><li>The Norwegian name Karlsvogna goes back to Old Norse Karlavagn, «the men's wagon», and a similar, smaller pattern in Ursa Minor was called Kvennavagn, «the women's wagon». In North Sámi the Big Dipper is Dávggát.</li><li>Polaris has only been close to the pole for the last thousand years or so, because Earth's axis slowly changes direction. The stories may have changed with the sky.</li><li>In Swedish tradition Orion's Belt is Friggerocken, «Frigg's distaff», after the spinning tool of the goddess Frigg. In medieval Icelandic time-reckoning texts the Belt is called Fiskikarlar, «the fishermen».</li><li>In Finland the Belt is Väinämöinen's Belt, and the stars hanging below it are Kaleva's Sword.</li></ul><p>More about the stars: <button class=\"btn small\" data-nav data-act=\"openGuide\" data-guide=\"nightsky\">The night sky ›</button></p>", "stories"]]},
    nightsky:{title:"The night sky", short:"Stars, planets and the Milky Way", sub:"Constellations, bright stars, planets and the Milky Way in the northern and southern hemispheres, with old stories about them.", secs:[
      ["Before you look up", "<ul><li><b>Give your eyes time:</b> it takes 20–30 minutes in the dark before your eyes see faint things like the Milky Way. White light ruins that in seconds. Use dim red light, like Red night light in the app or the red light on a headlamp.</li><li><b>Look slightly to the side:</b> faint things show better when you look a little beside them rather than straight at them.</li><li><b>The Moon:</b> a bright Moon washes out the Milky Way and faint stars. The best nights are around new moon, or before moonrise and after moonset.</li><li><b>Light nights:</b> from about May to July it never gets dark enough to see stars in much of Norway, and further north there is midnight sun.</li></ul><p>Directions by the stars: <button class=\"btn small\" data-nav data-act=\"openGuide\" data-guide=\"nightdir\">Directions at night ›</button></p>", "before"],
      ["Northern sky", "<ul><li><b>All year</b> (they never set in the Nordic countries): the Big Dipper, part of Ursa Major; Ursa Minor with Polaris; Cassiopeia. Further south, the Big Dipper sits low or below the horizon part of the year.</li><li><b>Autumn evenings:</b> the Summer Triangle, three bright stars: Vega (Lyra), Deneb (Cygnus) and Altair (Aquila).</li><li><b>Winter:</b> Orion, the Pleiades, Taurus with Aldebaran, Gemini with Castor and Pollux, and Auriga with Capella.</li><li><b>The Andromeda Galaxy:</b> the most distant thing you can see with the naked eye, about 2.5 million light-years away, and the only spiral galaxy clearly visible without binoculars. It looks like a faint, misty patch under a dark, moonless sky; ordinary binoculars show a small oval cloud. Find it about a fist and a half below the W of Cassiopeia. In Norway it is above the horizon all year, best on autumn evenings. The light you see left it 2.5 million years ago.</li></ul><figure class=\"sb-fig\"><div data-svgsrc=\"guides/sky-north.svg\"></div></figure>", "north"],
      ["Stories: the northern sky", "<ul><li><b>The Sámi hunt in the sky:</b> the reindeer bull or elk Sarvvis appears first, followed by the hunter Fávdna. The hunt goes on night after night in balance, so the world does not end.</li><li>In some Sámi stories the Pleiades are a flock of reindeer calves, and the Milky Way is called the Birds' Ladder. There is no single Sámi sky: the stories vary between the Sámi peoples, and much was written down late.</li><li><b>«The Star»:</b> in Old Norse, stjarna, «the star», on its own meant the Pleiades, used to keep track of time at night in winter. In the Middle Ages they were also called sjaustirni, «the seven-star».</li><li><b>How it works:</b> in late autumn the Pleiades rise in the east in the evening, and in November and December they are up all night. Through the night they travel from east, highest in the south, to west. Someone who knew where they stood at a given time could read the time from them. They reach the same place about four minutes earlier each night, around two hours earlier each month. Exactly how the Norse did it is not known.</li><li>Sámi reindeer herders also used the Pleiades to know the time through the long winter night. Far north, Polaris stands so high that it is of little help for direction, so people oriented themselves by other stars depending on the season.</li><li>The Persian astronomer al-Sufi described the Andromeda Galaxy as a «little cloud» in his Book of Fixed Stars in 964, long before the telescope. Who saw it first is unknown. In Greek myth Andromeda is the daughter of Cassiopeia, and the two constellations sit side by side.</li></ul>", "northst"],
      ["Southern sky", "<ul><li>The Southern Cross with the Pointers, Alpha and Beta Centauri.</li><li>Scorpius is high in the southern winter sky.</li><li>The Magellanic Clouds: two hazy patches, visible under a dark sky. They are galaxies, small companion galaxies of the Milky Way, and the most prominent galaxies to see with the naked eye. They are never seen from Europe.</li><li>Orion is visible here too, but upside down. Seasons are reversed: the northern winter sky is the southern summer sky.</li></ul>", "south"],
      ["Stories: the southern sky", "<ul><li><b>Māori of New Zealand:</b> the Tainui tribes saw an anchor in the Southern Cross, while people from the Wairarapa saw a plug that the storm winds blew through. The names vary between tribes.</li><li>Matariki (the Pleiades) rises in midwinter and for many Māori marks the start of a new year.</li><li><b>Aboriginal Australia:</b> the «Emu in the Sky» is drawn by dark clouds in the Milky Way, not by stars. Its head is the Coalsack, the dark patch next to the Southern Cross. How the Emu sits through the year told people when to hunt emus and collect their eggs.</li></ul>", "southst"],
      ["Bright stars", "<figure class=\"sb-fig\"><div data-svgsrc=\"guides/sky-orion.svg\"></div></figure><ul><li><b>Sirius</b>, the brightest star: follow Orion's Belt down and to the left (seen from the north). The other way, the Belt points to Aldebaran and the Pleiades.</li><li><b>Arcturus and Spica:</b> follow the curve of the Big Dipper's handle to orange Arcturus, then go on as far again to blue-white Spica.</li><li>Others worth knowing: Vega, Capella, Betelgeuse (reddish) and Rigel in Orion.</li><li>In the south: Canopus, the second-brightest star (not visible from Norway, only south of about 37° N), and Alpha Centauri.</li></ul><p><b>From the stories:</b> many star names come from Arabic. Aldebaran means «the follower»: it seems to follow the Pleiades across the sky. Mintaka means «the belt». Arcturus is the hunter Fávdna in Sámi tradition.</p>", "stars"],
      ["The Milky Way", "<ul><li><b>What it is:</b> our own galaxy, around 300 billion stars, the Sun among them. We see it from the inside, along its disk, so it looks like a faint, glowing band across the sky. It needs a dark sky without the Moon; in towns it disappears.</li><li><b>Why it runs all round the sky:</b> the galaxy is a flat disk, only about 1,000 light-years thick, and the Sun lies inside it, about 26,000 light-years from the centre. Looking along the disk we see stars in every direction around us, so the band runs as a ring right round the sky. Half the ring is always below the horizon. Looking above or below the band, we look out of the disk, and the stars thin out fast. Towards the centre, in Sagittarius, we look into the dense, bright middle. The opposite way, where Auriga meets Taurus, we look outwards towards the edge of the galaxy, so the band is thinner and fainter there.</li><li><b>The arms:</b> the Sun lies in a small arm, the Orion Arm, between the Sagittarius Arm further in and the Perseus Arm further out. Looking away from the centre, we look through the Perseus Arm, about 6,000 light-years out.</li><li><b>The brightest part</b> lies towards the centre of the galaxy, in Sagittarius next to Scorpius. From the southern hemisphere the centre passes high overhead in winter (June–August). From the northern hemisphere it sits low in the south in summer, and it is only seen south of about 55° N. So from most of Norway you never see it, and the light summer nights hide it anyway.</li><li><b>In Norway</b> we see the fainter, outer part. On autumn evenings the band runs high across the sky through Cassiopeia and Cygnus, in the middle of the Summer Triangle. In winter it runs from Cepheus in the north, through Perseus and Auriga overhead, down to Canis Major in the south.</li><li><b>How it moves:</b> the Milky Way turns with the rest of the sky around the pole through the night, and its angle changes. At times it arches straight overhead from north to south, at other times it lies lower and more slanted. Through the year, which part is up in the evening shifts.</li><li><b>The dark lane</b> down the middle of the band, clear in Cygnus, is clouds of dust and gas hiding the stars behind.</li></ul>", "milky"],
      ["Stories: the Milky Way", "<ul><li>Vinterbrauta, «the winter way», is an old Nordic name, like Icelandic vetrarbrautin and Swedish Vintergatan. Far north the Milky Way is best seen in winter, because summer nights are too light. Old Norwegian texts also call it mjólkhringr and vetrhringr.</li><li>The Greeks called it galaxias kyklos, «the milky circle»: in myth it is milk from the goddess Hera, sprayed across the sky. The word galaxy comes from this.</li><li>In Finland it is Linnunrata, «the birds' path»: migrating birds were believed to follow it to Lintukoto, the birds' warm home. Estonians call it Linnutee. In Sámi tradition it is the Birds' Ladder.</li><li>For Māori the Milky Way is the canoe (waka) of Tama-rereti: Orion and Scorpius are bow and stern, the Southern Cross and the Pointers the anchor and rope.</li><li>Many Aboriginal peoples in Australia see the Milky Way as a river in the sky, and read figures in its dark patches, such as the Emu.</li></ul>", "milkyst"],
      ["Moving lights", "<ul><li><b>Satellite:</b> a steady white point gliding smoothly across the sky without blinking, over a few minutes. It can vanish suddenly as it enters Earth's shadow. The International Space Station is the brightest, almost as bright as Venus. A row of similar points following each other is satellites launched together.</li><li><b>Aircraft:</b> blinking lights, often red and green on the wingtips, and it can change direction.</li><li><b>Shooting star (meteor):</b> a quick streak gone in a second or two.</li><li><b>Major meteor showers each year:</b> the Quadrantids around 3–4 January, the Perseids around 12–13 August (in Norway often in light nights) and the Geminids around 14 December. The Moon decides how many you see.</li></ul>", "moving"],
      ["The planets", "<ul><li><b>Venus:</b> brightest after the Moon. Never far from the Sun, so seen in the west after sunset («evening star») or in the east before sunrise («morning star»), never in the middle of the night.</li><li><b>Jupiter:</b> very bright and steady, can be up all night.</li><li><b>Mars:</b> clearly reddish. Its brightness varies a lot; it is brightest when closest to Earth, about every two years.</li><li><b>Saturn:</b> yellowish and fainter. Its brightness also follows how much of the rings we see.</li><li><b>Rule of thumb:</b> stars twinkle, planets shine more steadily. Near the horizon both can twinkle. The planets always lie along the same band across the sky as the Sun and Moon. They move, so they are not on fixed star charts.</li></ul><p>Almost no native Norse names for the planets survive: medieval Icelandic writers used the Latin names.</p>", "planets"],
      ["The Moon", "<ul><li><b>The phases:</b> half of the Moon is always lit by the Sun. How much of the lit half we see changes over about 29.5 days, from new moon to full moon and back.</li><li><b>The lit side points to the Sun:</b> so the crescent lies differently through the year and from place to place. In Norway the evening crescent mostly stands slanted or on its side; near the equator it can lie like a boat. In Australia the crescent is mirrored: it is lit from the left.</li><li><b>The face turns:</b> the Moon always shows us the same side, but it does not always stand the same way. Through the night it turns slowly as it crosses the sky, and through the year its axis leans east and west in turn. Seen from Norway when the full moon stands highest in the south, the crater Tycho moves from lower left in autumn to straight down, or a little to the right, in spring.</li><li><b>We see a little more than half the Moon:</b> it rocks a little (libration), because its orbit is oval and its axis is tilted a little to its orbit, about 6.7 degrees. Over time we see about 59 per cent of its surface.</li><li><b>In the south it stands on its head:</b> from Australia you see the same seas, but upside down, because you look north to the Moon. At the equator the full moon passes almost straight overhead, and how it stands then depends on which way you face. As it rises or sets, it lies on its side.</li><li><b>What you see with the naked eye:</b> the dark patches are «seas», solidified lava. The clearest crater at full moon is Tycho, with bright rays across the southern part.</li></ul><div class='moon-anim' data-anim='full'></div><div class='moon-anim' data-anim='cres'></div>", "moon"]]},
    aurora:{title:"Northern lights", short:"What they are, and when to see them", sub:"What the northern lights are, where and when you see them, and old stories about them.", secs:[
      ["What the northern lights are", "<ul><li>The Sun constantly sends out charged particles, the solar wind. Earth's magnetic field guides them towards the regions around the poles, where they collide with the gases of the upper atmosphere, from about 80 to rarely above 500 km up, and make them glow.</li><li><b>Colours:</b> green comes from oxygen about 100–150 km up, and is the most common. Red is also oxygen, but higher, and is seen mostly when the aurora is strong. Blue and violet come from nitrogen lower down.</li><li>The Norwegian Kristian Birkeland explained around 1900 that the aurora is caused by particles from the Sun captured by Earth's magnetic field.</li></ul>", "what"],
      ["Where and when", "<ul><li>The aurora lies in a belt around the magnetic pole, the auroral oval. Northern Norway lies beneath it, so there you can see aurora even when activity is low. Further south, higher activity is needed, and the aurora then sits lower in the northern sky.</li><li>Activity is often measured with the Kp index, from 0 (low) to 9 (high). The higher the number, the further south it can be seen.</li><li>You need a dark, clear sky. In northern Norway the season runs from about late September to early April; in summer it is too light. It is often best between 20:00 and 02:00, but the aurora can appear any time in the dark.</li><li>The Sun has a cycle of about 11 years. The peak was in 2024–25. Activity is now declining, but some of the strongest eruptions often come one to three years after the peak.</li><li>Check an aurora forecast and the weather before the trip. That needs internet, so it is not in the app.</li></ul>", "when"],
      ["Tips", "<ul><li>Give your eyes 20–30 minutes in the dark, and use red light.</li><li>Faint aurora can look like a pale, greyish cloud, because the eye sees colours poorly in the dark. If the «cloud» seems to move and change shape, it may be aurora.</li><li>A bright Moon makes faint aurora harder to see.</li><li>Clear aurora nights are often cold. Dress for standing still a long time.</li></ul><p><button class=\"btn small\" data-nav data-act=\"openGuide\" data-guide=\"nightsky\" data-sec=\"before\">The night sky: Before you look up ›</button></p>", "tips"],
      ["Stories", "<ul><li>The oldest Norse name is norðrljós. It first appears in the King's Mirror (Konungs skuggsjá), written in Norway around 1250, which tells of the lights the Greenlanders saw. The author says he does not know what they are, and gives guesses: fire circling the ocean at the edge of the world, or sunlight shining up from below the earth at night.</li><li>The sagas and the Norse myths do not mention the aurora. Ideas that it was Bifröst or light from the Valkyries are later interpretations.</li><li>In many places people were warned not to tease or mock the aurora. In northern Norway many still learn as children not to wave, whistle or sing at it, or it may come down and take you. The Sámi in Finnmark believed the aurora could kill children.</li><li>Along the Norwegian coast the aurora has also been called sildeblikk, «herring gleam»: the reflection of great shoals of herring, thrown up onto the sky.</li><li>In Finnish the aurora is revontulet, «the fox's fires», after the fire fox of old folk belief. In a story from Lapland the fox makes the aurora when its tail strikes sparks from branches and bushes as it runs.</li></ul>", "stories"]]}
  }
};

    if (overlay.hidden && sheetPushed){ sheetPushed = false; ignorePop = true; history.back(); }
  }, 0);
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(null); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(null); });

function askText(title, value, ok, allowEmpty){
  const T = t();
  return new Promise(res => {
    sheetResolve = res;
    openSheet(`<h3>${esc(title)}</h3>
      <input type="text" id="askInput" value="${esc(value || '')}">
      <div class="row"><button class="btn" data-s="cancel">${T.cancel}</button><button class="btn primary" data-s="ok">${esc(ok || T.save)}</button></div>`);
    const inp = $('askInput');
    const done = () => { const v = inp.value.trim(); closeSheet(allowEmpty ? v : (v || null)); };
    panel.querySelector('[data-s=ok]').onclick = done;
    panel.querySelector('[data-s=cancel]').onclick = () => closeSheet(null);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
    setTimeout(() => inp.select(), 40);
  });
}
function confirmBox(title, msg, ok){
  const T = t();
  return new Promise(res => {
    sheetResolve = res;
    openSheet(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="row"><button class="btn" data-s="cancel">${T.cancel}</button><button class="btn primary" data-s="ok">${esc(ok)}</button></div>`);
    panel.querySelector('[data-s=ok]').onclick = () => closeSheet(true);
    panel.querySelector('[data-s=cancel]').onclick = () => closeSheet(false);
  });
}

async function listAction(a, id){
  const T = t();
  if (state.field && ['new', 'copy', 'edit', 'rename', 'dup', 'reset', 'delete', 'backup', 'bkLater', 'startOver'].indexOf(a) >= 0) return;
  const L = id && id !== 'std' ? ownList(id) : null;
  if (a === 'new'){
    const choice = await new Promise(res => {
      sheetResolve = res;
      openSheet(`<h3>${T.newList}</h3><p>${T.newListMsg}</p><div class="choices">
        <button class="choice" data-tpl="std"><span class="c-name">${esc(stdList().name)}</span><span class="c-sub">${T.fromStd}</span></button>
        <button class="choice" data-tpl="blank"><span class="c-name">${T.emptyList}</span><span class="c-sub">${T.emptySub}</span></button></div>`);
      panel.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => closeSheet(b.dataset.tpl));
    });
    if (!choice) return;
    const name = await askText(T.nameList, choice === 'blank' ? T.myList : stdList().name, T.create);
    if (!name) return;
    const nl = choice === 'blank' ? {id:uid(), name, notes:'', modes:{}, cats:[]} : cloneList(stdList(), false);
    nl.name = name; nl.tripType = false;
    state.lists.push(nl); selList = nl.id; save();
    go('list', 'edit:' + nl.id);
  } else if (a === 'copy'){
    const name = await askText(T.nameList, stdList().name, T.create);
    if (!name) return;
    const nl = cloneList(stdList(), false); nl.name = name; nl.tripType = false;
    state.lists.push(nl); selList = nl.id; save();
    go('list', 'edit:' + nl.id);
  } else if (a === 'edit' && L){
    go('list', 'edit:' + L.id);
  } else if (a === 'rename' && L){
    const v = await askText(T.renameList, L.name, T.rename);
    if (v){ L.name = v; save(); render(); }
  } else if (a === 'dup' && L){
    const v = await askText(T.copyName, L.name + T.copySuffix, T.duplicate);
    if (v){ const c = cloneList(L, false); c.name = v; c.tripType = false; state.lists.push(c); selList = c.id; save(); render(); }
  } else if (a === 'share' && L){
    shareList(L);
  } else if (a === 'startOver'){
    if (await confirmBox(T.startOverQ, T.startOverMsg, T.startOverOk)){
      withUndo(T.startOverDone, () => {
        state.std.done = {}; state.std.modes = {}; state.std.light = {}; state.folds = {}; modesOpen = false;
        state.lists.forEach(x => { x.modes = {}; x.cats.forEach(c => { c.lightOnly = false; c.items.forEach(i => i.done = false); }); });
        foldStart(); // 0.10.0: the start state, every category folded
        state.main = 'std'; selList = 'std';
        state.field = false; state.night = false; state.rainLocked = false; rainLocked = false;
        state.hidePacked = false; state.listLock = false; delete state.lockPrev; editing = false;
        stdCache = null; tab = 'list'; view = null;
      });
      history.replaceState({tab:'list', view:null, depth:0}, '');
      updateWake(); top();
    }
  } else if (a === 'reset'){
    const target = L || stdList();
    if (await confirmBox(T.resetQ, T.resetMsg(target.name), T.resetOk)){
      withUndo(T.resetDone, () => {
        if (!L) state.std.done = {};
        else L.cats.forEach(c => c.items.forEach(i => i.done = false));
        stdCache = null;
      });
    }
  } else if (a === 'delete' && L){
    if (await confirmBox(T.delList, T.delListMsg(L.name), T.delListOk)){
      withUndo(T.listDeleted, () => {
        state.lists = state.lists.filter(x => x.id !== L.id);
        if (state.main === L.id) state.main = 'std';
        selList = state.main || 'std';
      });
    }
  } else if (a === 'backup'){
    backupSheet();
  } else if (a === 'bkLater'){
    state.bkSnooze = Date.now() + BK_SNOOZE_MS; save(); render();
  } else if (a === 'howto'){
    go('list', 'howto');
  } else if (a === 'intro'){
    showIntro(0);
  }
}

function backupSheet(){
  const T = t();
  const plain = bkData(), rt = rescueText();
  let data = plain, sealed = false;   // 0.18.0: data becomes the locked copy after Lås kopien
  const canShare = !!navigator.share;
  openSheet(`<h3>${T.backup}</h3>
    <div class="bk-warn"><p>${T.bkWarn}</p><p class="bk-how">${T.bkWarnHow}</p></div>

      <p class="pw-st" id="bkPwSt" role="alert"></p>

    <div class="bk-btns">${canShare ? `<button class="btn primary" id="bkShare">${T.bkShare}</button>` : ''}<button class="btn${canShare ? '' : ' primary'}" id="bkSave">${T.bkSave}</button><button class="btn" id="bkCopy">${T.bkCopy}</button></div>
    <div class="bk-msg" id="bkStatus" role="status" hidden></div>

    <div class="section-label">${T.restore}</div>
    <p class="bk-covers">${T.bkRestoreNote}</p>
    <input type="file" id="bkFileIn" accept=".json,.txt,application/json,text/plain" hidden>
    <div class="row" style="justify-content:flex-start;margin-bottom:14px"><button class="btn primary" id="bkFile">${T.bkFile}</button></div>
    <textarea id="bkIn" placeholder="${esc(T.bkPaste)}"></textarea>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="bkRestore">${T.bkAdd}</button></div>
    <div class="bk-msg" id="bkRStatus" role="status" hidden></div>
    <div id="bkRPwBox" hidden><p class="sh-hint" id="bkRPwMsg"></p>
      <label class="sh-lbl" for="bkRPw">${T.pwLbl}</label><input type="password" id="bkRPw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="pw-st" id="bkRPwSt" role="alert"></p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="bkRPwOk">${T.bkRPwOk}</button><button class="btn" id="bkRPwSkip" hidden>${T.bkSkipPriv}</button></div></div>
    ${rt ? `<div class="section-label">${T.rescueLbl}</div><p class="bk-covers">${T.rescueNote}</p>
    <details class="bk-text"><summary>${T.bkShow}</summary><textarea id="rsOut" readonly>${esc(rt)}</textarea></details>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="rsCopy">${T.bkCopy}</button><button class="btn" id="rsDel">${T.rescueDel}</button></div>` : ''}
    <div class="row"><button class="btn" data-s="cancel">${T.close}</button></div>`);
  if (rt){
    $('rsCopy').onclick = async () => {
      const ta = $('rsOut');
      try { await navigator.clipboard.writeText(ta.value); $('rsCopy').textContent = T.bkDoneCopy; }
      catch(e){ ta.closest('details').open = true; ta.select(); try { document.execCommand('copy'); } catch(_){} }
    };
    $('rsDel').onclick = async () => {
      if (await confirmBox(T.rescueDel, T.rescueDelQ, T.rescueDel)){ try { localStorage.removeItem(RESCUE_KEY); } catch(e){} }
      backupSheet();
    };
  }
  const status = $('bkStatus');
  const say = (msg, ok) => { status.textContent = msg; status.className = 'bk-msg' + (ok ? ' ok' : ''); status.hidden = !msg; };
  const flash = (btn, label) => {
    const was = btn.dataset.label || btn.textContent; btn.dataset.label = was;
    btn.classList.add('done'); btn.innerHTML = T_MARK + esc(label);
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('done'); btn.textContent = was; }, 3000);
  };
  const done = (msg, btn, label) => { bkMarkDone(); say(msg, true); if (btn) flash(btn, label); };
  panel.querySelector('[data-s=cancel]').onclick = () => { closeSheet(null); render(); };
  // 0.18.0: an optional password; the copy is locked first (Lås kopien), so Del still runs straight from the tap
  const pwOn = () => CRYPTO_OK && $('bkPwOn').checked;
  const waitLock = () => { if (pwOn() && !sealed){ say(T.bkPwFirst, false); return true; } return false; };
  const unseal = () => { sealed = false; data = plain; $('bkOut').value = plain; };
  if (CRYPTO_OK){
    $('bkPwOn').onchange = e => { $('bkPwBox').hidden = !e.target.checked; unseal(); say('', false); if (e.target.checked) $('bkPw1').focus(); };
    $('bkPwShow').onchange = e => { ['bkPw1', 'bkPw2'].forEach(id => { $(id).type = e.target.checked ? 'text' : 'password'; }); };
    ['bkPw1', 'bkPw2'].forEach(id => $(id).addEventListener('input', () => { if (sealed){ unseal(); say('', false); } }));
    $('bkPwLock').onclick = async () => {
      const a = $('bkPw1').value, st = $('bkPwSt');
      if (pwLen(a) < PW_MIN){ st.textContent = T.pwShort; return; }
      if (a !== $('bkPw2').value){ st.textContent = T.pwDiff; return; }
      st.textContent = ''; $('bkPwLock').disabled = true;
      try { data = await bkSeal(plain, a); sealed = true; $('bkOut').value = data; say(T.bkPwDone, true); }
      catch(e){ unseal(); say(T.bkManual, false); }
      $('bkPwLock').disabled = false;
    };
  }
  if (canShare) $('bkShare').onclick = async () => {
    if (waitLock()) return;
    // Android's share sheet takes plain text files, not .json, so the shared file is a .txt (restore reads both).
    const name = bkFileName().replace(/\.json$/, '.txt');
    let file = null;
    try { file = new File([data], name, {type:'text/plain'}); } catch(e){}
    const tries = [];
    if (file && navigator.canShare && navigator.canShare({files:[file]})) tries.push({files:[file], title:name});
    tries.push({title:name, text:data});
    for (const d of tries){
      try { await navigator.share(d); done(T.bkShared, $('bkShare'), T.bkDoneShare); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    say(T.bkShareFail, false);
  };
  $('bkSave').onclick = () => {
    if (waitLock()) return;
    try {
      const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = bkFileName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      done(T.bkSaved, $('bkSave'), T.bkDoneSave);
    } catch(e){ say(T.bkManual, false); }
  };
  $('bkCopy').onclick = async () => {
    if (waitLock()) return;
    const ta = $('bkOut');
    const btn = $('bkCopy');
    try { await navigator.clipboard.writeText(ta.value); done(T.bkCopied, btn, T.bkDoneCopy); }
    catch(e){ ta.closest('details').open = true; ta.select(); try { if (document.execCommand('copy')) done(T.bkCopied, btn, T.bkDoneCopy); else throw 0; } catch(_){ say(T.bkManual, false); } }
  };
  const rstatus = $('bkRStatus');
  const sayR = (msg, ok) => { rstatus.textContent = msg; rstatus.className = 'bk-msg' + (ok ? ' ok' : ''); rstatus.hidden = !msg; };
  // 0.18.0: one password box for a locked backup and for private notes with another password
  let rPend = null;
  const rBox = (msg, skip) => { $('bkRPwBox').hidden = !msg; $('bkRPwMsg').textContent = msg || ''; $('bkRPwSkip').hidden = !skip; $('bkRPwSt').textContent = ''; $('bkRPw').value = ''; if (msg) $('bkRPw').focus(); };
  // build 73: pasted text that starts like a backup but does not parse was cut off on the way (long texts often are)
  const looksCut = text => { const x = String(text || '').trim(); if (!/^\{\s*"app"\s*:\s*"trip-checklist"/.test(x)) return false; try { JSON.parse(x); return false; } catch(e){ return true; } };
  const restore = (text, fromFile) => {
    // 0.14.1: a pasted share link (#share= or #note=) is added the same way as when the link is opened
    const m = /#(share|note)=([A-Za-z0-9_-]+)/.exec(text || '');
    if (m){ closeSheet(null); render(); importHash('#' + m[1] + '=' + m[2]); return; }
    rPend = null; rBox(null);
    let o = null; try { o = JSON.parse(text); } catch(e){}
    if (bkIsSealed(o)){
      if (!CRYPTO_OK){ sayR(T.bkBad, false); return; }
      sayR('', false); rPend = {kind:'enc', o}; rBox(T.bkLockedMsg, false); return;
    }
    const a = bkRestore(text);
    if (!a){ sayR(!fromFile && looksCut(text) ? T.bkCut : T.bkBad, false); return; }
    $('bkIn').value = '';
    if (a.pend){ rPend = {kind:'priv', p:a.pend}; rBox(state.priv ? T.bkPrivOther : T.bkPrivAsk, true); }
    if (!(a.l || a.n || a.w || a.k || a.p)){ sayR(a.pend ? '' : T.bkNothing, true); return; }
    save(); render();
    sayR(T.bkAddedAll(a), true);
  };
  $('bkRPwSkip').onclick = () => { rPend = null; rBox(null); };
  $('bkRPwOk').onclick = async () => {
    const pw = $('bkRPw').value, st = $('bkRPwSt'), btn = $('bkRPwOk');
    if (!rPend || !pw || btn.disabled) return;
    btn.disabled = true; st.textContent = T.pwBusy;
    try {
      if (rPend.kind === 'enc'){
        const inner = await bkUnseal(rPend.o, pw);
        if (inner == null){ st.textContent = T.pwWrong; return; }
        restore(inner); return;
      }
      const opened = await privAddForeign(rPend.p, pw);
      if (!opened){ st.textContent = T.pwWrong; return; }
      rPend = null;
      // no private password on this phone yet: the same password, with a new data key made here
      if (!state.priv) await privCreate(pw);
      if (!privKey){
        // this phone's own private notes must be open to seal the new ones with its key
        closeSheet(null); render();
        if (!(await privEnsure())){ showToast(T.privSkipped); return; }
        const k = await privStoreOpened(opened); render(); showToast(T.privAdded(k)); return;
      }
      const k = await privStoreOpened(opened); rBox(null); render(); sayR(T.privAdded(k), true);
    } finally { if (panel.contains(btn)){ btn.disabled = false; if (st.textContent === T.pwBusy) st.textContent = ''; } }
  };
  $('bkRPw').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('bkRPwOk').click(); } });
  $('bkRestore').onclick = () => restore($('bkIn').value);
  $('bkFile').onclick = () => $('bkFileIn').click();
  $('bkFileIn').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => restore(String(r.result || ''), true);
    r.onerror = () => sayR(T.bkBad, false);
    r.readAsText(f);
    e.target.value = '';
  };
}

/* ---------- main interactions ---------- */
main.addEventListener('click', async e => {
  const wu = e.target.closest('[data-wunit]');
  if (wu){ packW().unit = wu.dataset.wunit; save(); render(); return; }
  const fs_ = e.target.closest('[data-foodseason]');
  if (fs_){ foodState().season = fs_.dataset.foodseason; save(); render(); return; }
  const fdt = e.target.closest('[data-foodtoggle]');
  if (fdt){ const f = foodState(); f[fdt.dataset.foodtoggle] = !f[fdt.dataset.foodtoggle]; save(); render(); return; }
  const ft = e.target.closest('[data-fueltype]');
  if (ft){ fuelState().fuel = ft.dataset.fueltype; save(); render(); return; }
  const fm = e.target.closest('[data-fuelmode]');
  if (fm){ fuelState().mode = fm.dataset.fuelmode; save(); render(); return; }
  const cm = e.target.closest('[data-calcmode]');
  if (cm){ state.calc.mode = cm.dataset.calcmode; save(); render(); return; }
  const chip = e.target.closest('[data-mode]');
  if (chip){
    if (state.listLock){ showToast(t().lockedMsg); return; }
    const l = cur(); l.modes = l.modes || {};
    l.modes[chip.dataset.mode] = !l.modes[chip.dataset.mode];
    save(); render(); return;
  }
  const sl = e.target.closest('[data-sel]');
  if (sl){ selList = selList === sl.dataset.sel ? null : sl.dataset.sel; render(); return; }
  const rl = e.target.closest('[data-role]');
  if (rl){
    const id = rl.dataset.id;
    const L = ownList(id);
    const dropTrip = () => { if (!L) return; L.tripType = false; [stdList()].concat(state.lists).forEach(x => { if (x.modes) delete x.modes['L:' + id]; }); };
    if (rl.dataset.role === 'main'){
      // the two roles rule each other out; switching an own list off falls back to the standard list
      if (L && state.main === id) state.main = 'std';
      else { state.main = id; dropTrip(); }
    } else if (L){
      if (L.tripType) dropTrip();
      else { L.tripType = true; if (state.main === id) state.main = 'std'; }
    }
    save(); render(); return;
  }
  const la = e.target.closest('[data-la]');
  if (la){ listAction(la.dataset.la, la.dataset.id); return; }
  const sk = e.target.closest('.skin-btn[data-skin]');
  if (sk){ state.skin = sk.dataset.skin; save(); render(); return; }
  const lg = e.target.closest('[data-lang]');
  if (lg){ state.lang = lg.dataset.lang; stdCache = null; save(); render(); return; }
  const op = e.target.closest('[data-open]');
  if (op){ planFrom = null; go(tab, 'tool:' + op.dataset.open); return; }
  // 0.15.0: fold a Guider group in place (no redraw, so the page does not jump)
  const gf = e.target.closest('[data-gfold]');
  if (gf){
    const k = gf.dataset.gfold, open = gf.getAttribute('aria-expanded') !== 'true';
    state.gOpen = Object.assign({}, state.gOpen, {[k]: open}); save();
    gf.setAttribute('aria-expanded', String(open));
    const body = $('gx-' + k); if (body) body.classList.toggle('gf-closed', !open);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const T = t(), act = b.dataset.act;
  if (act === 'back'){ goBack(); return; }
  if (act === 'cStart'){ startCompass(); return; }
  if (act === 'getPos'){ getPos(); return; }
  if (act === 'addLink' || act === 'sugLink'){
    // sugLink (v29): a suggested link from a guide, filled in; the user confirms or edits it
    const sug = act === 'sugLink';
    const name = await askText(T.linkName, sug ? b.dataset.n : '', T.add); if (!name) return;
    const url = await askText(T.linkUrl, sug ? b.dataset.u : 'https://', T.add); if (!url) return;
    if (!/^https?:\/\/\S+\.\S+/.test(url)){ await confirmBox(T.addLink, T.linkBad, T.ok); return; }
    if (!(state.links || []).some(l => l.u === url)) state.links = (state.links || []).concat([{n:name, u:url}]);
    save(); if (sug) render(); else renderCompass(); return;
  }
  if (act === 'delLink'){ const n = +b.dataset.n; withUndo(T.linkDeleted, () => { state.links.splice(n, 1); }); return; }
  if (act === 'cHold'){ cHeld = !cHeld; renderCompass(); return; }
  if (act === 'cStars'){ go('compass', 'stars'); return; }
  if (act === 'moonAnim'){
    const a = b.closest('.moon-anim') && b.closest('.moon-anim')._ma; if (!a) return;
    a.run = !a.run; b.setAttribute('aria-pressed', String(!a.run)); b.textContent = a.run ? t().maPause : t().maPlay; return;
  }
  if (act === 'stSort'){
    state.stSort = b.dataset.v === 'high' ? 'high' : 'bright'; save();
    document.querySelectorAll('[data-act="stSort"]').forEach(x => x.setAttribute('aria-pressed', String((x.dataset.v === 'high') === stHigh())));
    const n = new Date(); if ($('stList') && state.pos) $('stList').innerHTML = starList(skyVisible(n), milkyWay(n), n);
    return;
  }
  if (act === 'autoRelock'){ state.autoRelock = !state.autoRelock; save(); if (!state.autoRelock) clearTimeout(relockTimer); render(); return; }
  if (act === 'cSkyNow'){ state.skyNow = !skyOn('now'); save(); renderCompass(); return; }
  if (act === 'cRiseSet'){ state.skyRiseSet = !skyOn('rs'); save(); renderCompass(); return; }
  if (act === 'fieldToggle'){
    state.field = !state.field;
    // v30: Lås listen is on in Utemodus and goes back to how it was afterwards
    if (state.field){ state.lockPrev = !!state.listLock; state.listLock = true; }
    else { rainLocked = false; state.rainLocked = false; state.listLock = !!state.lockPrev; delete state.lockPrev; }
    editing = false; save(); render(); updateWake();
    // v31: no toast; Lås listen pulses for about 3 s when Utemodus locked it
    if (state.field && !state.lockPrev) pulseLock();
    return; }

function pop(at, big){

  const f = ac.createBiquadFilter(); f.type = 'bandpass';

/* tap or hold on the light buttons (delegated, since the row is redrawn with the page) */

/* ---------- Nødmodus / emergency mode (0.11.0) ----------

   Avslutt nødmodus (a normal tap) or Back closes it. If the app was closed while it was open, it opens again, with no time limit.

   Numbers come from emPlace() like everywhere else. Calls and SMS go through the phone's own apps, only when you press. */

const SOS_OLD_MS = 15 * 60000, SOS_ROUGH_M = 100; // 0.11.3: older than 15 min = old; worse than ±100 m = uncertain
function sosBtn(small){

}
function sosCoord(p){

  return Math.abs(p.lat).toFixed(5) + '° ' + (p.lat >= 0 ? 'N' : 'S') + ', ' + Math.abs(p.lon).toFixed(5) + '° ' + (p.lon >= 0 ? (no ? 'Ø' : 'E') : (no ? 'V' : 'W'));

  } catch(e){}
}
/* 0.11.3: Nødmodus says plainly how fresh the position is: getting it, found (with time), old (with age) or uncertain */

  const A = t().sos.ago, m = Math.max(1, Math.round(ms / 60000));

  if (!sosBusy && !sosFailed) h += `<p class="sos-st sos-ok">${S.posFound(new Date(p.t).toLocaleTimeString(state.lang === 'no' ? 'nb-NO' : 'en-GB', {hour:'2-digit', minute:'2-digit'}))}</p>`;

function sosStatTick(){ const e = $('sosStat'); if (e && !sosEl.hidden) e.innerHTML = sosStat(); }

  const T = t(), S = T.sos, E = T.em, pl = emPlace(region(state.pos)), p = state.pos, G = GUIDE_TXT[state.lang] || GUIDE_TXT.en;
  sosEl.className = 'sos' + (state.sosHue === 'red' ? ' h-red' : state.sosHue === 'green' ? ' h-green' : '');
  const call = (n, lbl) => `<a class="sos-call" href="tel:${n}"><b>${n}</b><span>${lbl}</span></a>`;
  const calls = pl === 'no' ? call('113', E.med) + call('112', E.police) + call('110', E.fire) : pl === 'eu' ? call('112', E.eu112) : `<p>${E.noteFar}</p>`;
  const gl = (k, sec, lbl) => `<button class="sos-glink" data-sg="${k}"${sec ? ` data-ss="${sec}"` : ''}>${lbl} ›</button>`;
  let pos;

    const when = sosWhen(p);

      <div class="sos-row"><a class="sos-act" href="sms:?body=${encodeURIComponent(S.smsText(sosCoord(p), when))}">${S.sms}</a><button data-sa="pos">${T.updPos}</button></div>

    <section class="sos-sec"><h2>${S.light}</h2><div class="sos-row"><button data-sa="white">${S.white}</button><button data-sa="six">${S.six}</button><button data-sa="sosl">${S.sosL}</button></div><p class="s-mut">${S.lightNote}</p></section>
    <section class="sos-sec"><h2>${S.sig}</h2><p>${S.sigTxt}</p>${gl('emergency', 'signals', G.emergency.title)}</section>

    <section class="sos-sec"><h2>${S.bat}</h2><p class="s-mut" id="sosBat"></p><p>${S.batTxt}</p>${gl('emergency', 'battery', G.emergency.title)}</section>

function openSos(here){

function closeSos(fromPop){

function sosGetPos(){

sosEl.addEventListener('click', e => {
  const g = e.target.closest('[data-sg]');
  if (g){
    // open a guide from Nødmodus; its back button leads back here. The Nødmodus history entry stays below the guide.
    state.sosOpen = false; save(); sosEl.hidden = true; document.body.classList.remove('sosopen');
    sosBack = true; guideSec = g.dataset.ss || null;
    go('guide', 'tool:' + g.dataset.sg);
    return;
  }
  const a = e.target.closest('[data-sa]');
  if (!a) return;

  if (k === 'exit') closeSos();
  else if (k === 'hue'){ state.sosHue = a.dataset.h || null; save(); renderSos(); } // 0.11.2: Vanlig, Rødt or Grønt, any time
  else if (k === 'pos') sosGetPos();
  else if (k === 'white') openLight('white');
  else if (k === 'six') openLight('six');
  else if (k === 'sosl') openLight('sos');

/* hold a Nødmodus button 1 s (delegated, the buttons are redrawn with the page; works in Regnlås) */
(function(){
  let btn = null, timer = null, held = false, sx = 0, sy = 0;
  const pt = e => e.touches ? e.touches[0] : e;
  const cancel = () => { clearTimeout(timer); if (btn) btn.classList.remove('holding'); btn = null; };
  const start = (b, e) => {
    if (e.cancelable) e.preventDefault();

    b.classList.add('holding');

     Another tap starts the 3 s again. Reduce motion: the size changes at once (no transitions). */
  let gBtn = null, gTimer = null, gEnd = null;
  const GROW_H = 134, GROW_MS = 3000;
  function shrink(){
    const b = gBtn; gBtn = null; clearTimeout(gTimer);
    if (!b || !b.isConnected) return;
    b.classList.add('shrink'); b.style.height = b.dataset.gh + 'px'; b.style.marginTop = ''; b.style.marginBottom = '';
    clearTimeout(gEnd); gEnd = setTimeout(() => { b.classList.remove('grow', 'shrink'); b.style.height = ''; delete b.dataset.gh; }, 650);
  }

    if (gBtn && gBtn !== b) shrink();
    clearTimeout(gTimer); clearTimeout(gEnd);

let wakeLock = null;
async function updateWake(){
  try {
    // 0.12.1: a burned-out Bål lets go of the screen, even in Utemodus, so the phone can turn it off
    if ((state.field || slMode) && !(slMode === 'fire' && Fire.sleeping) && document.visibilityState === 'visible'){
      if (!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', updateWake);

render();
updateWake();
// 0.14.1: tell once that stored data could not be read (a copy is kept, see the backup sheet)
const startChecks = async () => { if (rescued){ rescued = false; const T = t(); if (await confirmBox(T.rescueQ, T.rescueMsg, T.backup)){ backupSheet(); return; } } checkShared(); };
if (!state.introDone) showIntro(0, startChecks); else startChecks();

// v32: ask the browser to keep the data when space runs low (installed app only; nothing is sent anywhere)

  // 0.11.4: an open Nødmodus counts as busy too, so an update never reloads the page in an emergency
  const busy = () => !!sortDrag || !overlay.hidden || !$('intro').hidden || !!slMode || !sosEl.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
