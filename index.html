const GUIDE_TXT = {
  no:{
    shell:{title:'Skalltøy', short:'Pust, vask og impregnering', sub:'En rask sjekk før og etter tur. Vaskeanvisningen og produsentens råd går først.', secs:[
      ['Hvorfor det betyr noe','<p>Ytterstoffet har et vannavstøtende belegg som får vannet til å perle og renne av. Når belegget slites, trekker stoffet til seg vann. Jakken lekker ikke, men slutter å puste og blir klam inni. Skitt, svette, solkrem og røyk sliter belegget raskere.</p>'],
      ['Før turen','<ul><li>Dryss litt vann på skuldrene. Perler det, er det greit. Blir stoffet mørkt og trekker det inn, bør plagget vaskes og impregneres.</li><li>Sjekk glidelåser, mansjetter, hettejustering og at tapen i sømmene ikke løsner.</li></ul>'],
      ['Etter turen','<ul><li>Heng plagget til tørk før du legger det bort, ikke rett ved sterk varme.</li><li>Børst av tørr gjørme, og oppbevar det hengende, ikke presset sammen.</li></ul>'],
      ['Vask','<ul><li>Vask når plagget er skittent eller slutter å perle, etter vaskeanvisningen (ofte 30–40 °C).</li><li>Lukk alle glidelåser og borrelåser, og bruk flytende vaskemiddel eller et vaskemiddel for funksjonstøy.</li><li>Aldri tøymykner, blekemiddel eller rens. Skyll godt.</li></ul>'],
      ['Ny impregnering','<ul><li>Varme gir ofte tilbake den vannavstøtende effekten: tørketrommel på lav eller middels varme i omtrent 20 minutter, hvis vaskeanvisningen tillater det.</li><li>Perler det fortsatt ikke, bruk impregnering på spray utenpå, og varm etter det produktet beskriver.</li></ul>']]},
    boots:{title:'Fjellsko', short:'Lærsko, tekniske sko og skistøvler', sub:'En rask sjekk før og etter tur. Vaskeanvisningen og produsentens råd går først.', secs:[
      ['Før turen','<ul><li>Sjekk såle og mønster, sømmer, gummikanten, lisser og maljer.</li><li>Se at skoene er behandlet siden forrige tur.</li></ul>'],
      ['Etter turen, alle sko','<ul><li>Ta ut innleggssålene, løsne lissene, og børst eller skyll av gjørme. Tørket gjørme trekker fuktighet ut av lær.</li><li>Tørk skoene langsomt i romtemperatur, med avispapir inni som byttes når det er vått.</li><li>Aldri ved bål, ovn eller panelovn. Varme sprekker lær og svekker limet.</li><li>Oppbevar dem tørt og luftig, ikke i plastpose eller i en varm bil.</li></ul>'],
      ['Lærsko','<ul><li>Når de er rene, behandle dem med voks eller pleiemiddel for lærtypen. Glatt lær og nubuk trenger ulike produkter.</li><li>Har skoene membran, unngå tungt fett. Det mykner læret og gir dårligere pust. Bruk et produkt laget for sko med membran.</li></ul>'],
      ['Tekniske sko (stoff og syntet)','<ul><li>Rengjør med vann, og mild såpe ved behov. Ikke bruk voks på stoffet.</li><li>Impregner med spray når vannet ikke lenger perler.</li></ul>'],
      ['Skistøvler','<p>Som for fjellsko: tørk langsomt i romtemperatur, aldri ved bål eller ovn, og behandle skistøvler i lær som lærsko.</p><ul><li>Kan innerstøvlene tas ut, ta dem ut etter hver dag og tørk dem for seg. Det er der fuktigheten sitter. I telt kan de ligge i soveposen om natten, så de ikke fryser.</li><li>Før turen, sjekk delen som møter bindingen (sålekant, bøyle eller innfestinger) for slitasje og sprekker, og at den ikke er full av is eller skitt.</li><li>Sjekk spenner, stropper og lisser.</li><li>Oppbevar plaststøvler med spennene løst lukket, så skallet holder formen.</li></ul>','ski']]},
    tent:{title:'Telt', short:'Sjekk før og etter tur', sub:'En rask sjekk før og etter tur. Produsentens råd går først.', secs:[
      ['Før turen','<ul><li>Etter lagring, eller før sesongens første tur: slå opp teltet hjemme og sjekk at alt er med: innertelt, duk, stenger, plugger og barduner.</li><li>Sjekk stangledd og strikken inni, glidelåser, tapen i sømmene og at vannet perler på duken.</li><li>Se at lappesett og reparasjonshylse til stengene ligger i reparasjonssettet.</li></ul>'],
      ['På tur','<ul><li>Selve teltet (innertelt og duk) kan pakkes inni sekken i stedet for utenpå. Det holder seg tørt, henger ikke fast i greiner og sekken blir bedre balansert. Stengene utenpå eller langs ryggen.</li><li>En våt duk kan pakkes i egen pose eller i en ytterlomme, så resten av sekken holder seg tørr.</li><li>Unngå å la teltet stå i sterk sol i dagevis. Sollys sliter på stoffet.</li></ul>'],
      ['Etter turen','<ul><li>Tørk teltet helt innen en dag eller to, selv om det virket tørt da du pakket det. Lagres det fuktig, blir det mugg og sur lukt, og belegget brytes ned.</li><li>Rist ut sand og barnåler, og tørk av gjørme med vann og svamp. Ikke vaskemiddel eller vaskemaskin.</li><li>Rengjør og tell pluggene.</li><li>Stapp duken i posen, eller brett den langs nye linjer hver gang. De samme brettene om og om igjen sliter på belegget.</li><li>Oppbevar teltet løst pakket, tørt og kjølig, ikke hardt komprimert.</li></ul><p>Kveil teltets barduner på samme måte som tarpens. <button class="btn small" data-nav data-act="openGuide" data-guide="tarp" data-sec="guy">Tarp ›</button></p>']]},
    tarp:{title:'Tarp', short:'Til telt, alene eller over hengekøye', sub:'Det grunnleggende for å komme i gang.', secs:[
      ['Bruk','<ul><li><b>Sammen med teltet:</b> et tørt sted å lage mat og sitte ute når det regner.</li><li><b>Alene:</b> lettere og luftigere enn telt, men mindre ly mot vind og insekter. Best om sommeren og under tregrensen.</li><li><b>Over hengekøye:</b> taket, hengt lengre enn hengekøya.</li><li><b>Som skygge</b> på varme dager og i midtdagssola.</li><li><b>I en nødsituasjon</b> kan en vindsekk eller Jervenduk rigges som et enkelt ly.</li></ul>'],
      ['Oppsett, det grunnleggende','<ul><li>Strekk en stram mønelinje mellom to trær: pålestikk i den ene enden og teltstikk i den andre, så du kan stramme den.</li><li>Bruk teltstikk på bardunene, så de kan justeres.</li><li>I dårlig vær: lavt, med ryggen mot vinden. I fint vær: høyere og mer åpent.</li><li>Stram tarpen godt og med fall, så den ikke blafrer og vannet ikke samler seg.</li></ul><p><button class="btn small" data-nav data-act="openGuide" data-guide="knots">Knuter ›</button></p>'],
      ['Pakking','<ul><li>Børst av skitt og se at tarpen er tørr. Må du pakke den våt, tørk den innen en dag eller to.</li><li><b>Rask bretting:</b> ta den midterste maljen på den ene siden i den ene hånden, og den midterste på motsatt side i den andre. Før dem sammen, ta tak midt i bretten og dra den bakover. Nå er tarpen brettet i fire, og resten brettes raskt til størrelsen på posen.</li><li>Brett langs nye linjer hver gang, eller stapp tarpen i posen. Bretter du likt hver gang, slites belegget i brettene.</li><li>Til lagring hjemme: løst pakket, som teltet.</li></ul>'],
      ['Barduner uten floker','<ul><li>Kveil hver bardun for seg før tarpen går i posen. Surr tauet i et åttetall rundt tommel og lillefinger, la ca. 10 cm være igjen, surr det rundt midten av bunten og stikk enden gjennom den siste løkken.</li><li>Har tarpen lommer i hjørnene, kan tauet stappes rett inn i dem. Ellers holder en liten strikk eller borrelåsstropp rundt hver bunt den samlet.</li><li>Lengre og tykkere tau kan hekles til en daisy chain, som åpnes med ett drag.</li><li>Løsne knuter som har strammet seg før tarpen legges bort. Teltstikkene på bardunene kan bli sittende.</li><li>Barduner med reflekstråd er lettere å se i mørket, så du ikke snubler i dem.</li></ul>','guy'],
      ['Vedlikehold','<p>Som for telt: tørk tarpen helt før den legges bort.</p>']]},
    aval:{title:'Topptur og skred', short:'Skredvarsel, terreng og faretegn', sub:'Det grunnleggende for turer i og nær skredterreng. Appen erstatter ikke et skredkurs.', secs:[
      ['Før turen','<ul><li>Sjekk skredvarselet på <a href="https://www.varsom.no" target="_blank" rel="noopener">varsom.no</a> samme dag: faregrad (1–5) og hvilket skredproblem det gjelder.</li><li>Se på bratthetskart og aktsomhetskart for snøskred når du planlegger ruten. De viser også hvor et skred kan gå.</li><li>Avtal på forhånd hvor dere snur.</li></ul>'],
      ['Terreng','<ul><li>Skred løsner som regel i heng brattere enn 30 grader. Du kan likevel bli tatt lenger ned, i utløpssonen, og et skred kan gå langt ut på flatt terreng.</li><li>Terrengfeller som renner, bekkedaler, stup og skog gjør konsekvensen av et lite skred mye verre.</li><li>Rygger er ofte tryggere enn flanker og renner, men hold god avstand til kanten. Skavler kan brekke langt inn, og ikke oppholde deg under dem.</li></ul>'],
      ['Faretegn underveis','<ul><li>Ferske skred, sprekker som skyter ut fra skiene, og drønn i snøen når den setter seg betyr ustabil snø. Snu eller velg slakere terreng.</li><li>Mye fersk snø, sterk vind som flytter snø, og rask oppvarming øker faren.</li></ul>'],
      ['Utstyr og rutiner','<ul><li>Skredsøker, søkestang og spade til hver person, og øv på å bruke dem.</li><li>Test skredsøkerne i gruppen før dere går, som står i Forberedelser.</li><li>En skredsekk er et tillegg, ikke en erstatning for gode valg.</li><li>Kjør én og én i bratte heng, og stopp på trygge steder utenfor skredløpet.</li></ul><p><b>Ta et skredkurs før du går i skredterreng.</b></p><p>Feller og smøring: <button class="btn small" data-nav data-act="openGuide" data-guide="ski" data-sec="skins">Ski: smøring og feller ›</button></p>']]},
    mapcompass:{title:'Kart og kompass', short:'Ta ut kursen og hold den', sub:'Ta ut kursen i tre steg, og hold den.', secs:[
      ['Kompasset','<figure class="sb-fig"><div data-svgsrc="guides/compass-parts.svg"></div><ul class="fig-legend"><li><b class="fig-num">1</b><span>Kurspil: viser retningen du skal gå.</span></li><li><b class="fig-num">2</b><span>Kanten: legges langs streken på kartet.</span></li><li><b class="fig-num">3</b><span>Kompasshuset med gradskive: kan dreies.</span></li><li><b class="fig-num">4</b><span>Nordlinjene og N-merket (kompasshuspila) i bunnen av kompasshuset.</span></li><li><b class="fig-num">5</b><span>Kompassnåla: den røde enden peker mot magnetisk nord.</span></li></ul></figure>', 'parts'],
      ['Ta ut kursen','<figure class="sb-fig"><div data-svgsrc="guides/compass-steps.svg"></div></figure><ol><li>Legg kanten av kompasset langs streken fra der du står til dit du skal. Kurspila, ikke kompassnåla, skal peke dit du skal.</li><li>Vri kompasshuset til linjene i bunnen er parallelle med kartets nord–sør-linjer, og N-merket peker opp på kartet.</li><li>Ta kompasset bort fra kartet og hold det flatt. Drei deg til den røde nåla ligger i kompasshuspila. Nå viser kurspila retningen du skal gå.</li></ol>', 'steps'],
      ['Gå på kursen','<ul><li>Sikt på et punkt kurspila peker mot, et tre i skogen eller en knaus på fjellet. Gå dit og sikt på nytt.</li><li>Del turen i etapper mellom sikre punkter på kartet, som vann, veikryss eller bekkekryss, og ta ut ny kurs der.</li><li>Metall og kraftledninger kan dra i nåla. Selv en klokke eller kniv tett inntil kompasset kan gi feil kurs.</li></ul>'],
      ['Misvisning','<p>Kartets nord–sør-linjer peker ikke mot magnetisk nord. Forskjellen kalles misvisning, og den varierer med hvor du er i landet. Du finner den på turkartet du lager på norgeskart.no.</p><p>For en nøyaktig kurs: drei kompasshuset like mange grader som misvisningen etter steg 2, med klokka hvis den er østlig og mot klokka hvis den er vestlig.</p><p>Med 5 graders misvisning bommer du med om lag 90 meter på én kilometer.</p>', 'decl'],
      ['Kart','<p>Turkartet «Norge 1:50 000» kan skrives ut gratis fra norgeskart.no. Ha alltid med kart og kompass, ikke bare mobilen.</p>[[web:https://www.norgeskart.no|Norgeskart]]', 'maps']]},
    emergency:{title:'Nødsituasjon', short:'Når du trenger hjelp', sub:'Når du trenger hjelp på tur.', secs:[
      ['Ring etter hjelp','[[calls]]<p>Du kan ringe 112 selv om ditt eget mobilselskap ikke har dekning der du er, så lenge et annet nett har det. De fleste nyere mobiler sender posisjonen din automatisk når du ringer et nødnummer.</p>', 'call'],
      ['Hva du sier','<p>Operatøren leder deg gjennom faste spørsmål: hva som har skjedd, hvor, og om noen er skadet. Svar kort og rolig.</p><p>Vær klar til å si hvor du er: koordinatene fra kartappen eller Nødmodus, stedsnavn, terrenget rundt deg og hvordan dere kom dit. Følg rådene du får mens du venter på hjelp.</p>', 'say'],
      ['Signaler','<p>Gi seks signaler i minuttet med fløyte, lys eller rop, vent ett minutt, og gjenta. Svaret er tre signaler i minuttet. Dette er det alpine nødsignalet, som brukes i fjellet.</p><p>SOS (tre korte, tre lange, tre korte: • • • — — — • • •) er nødsignalet fra sjøen og er lett å kjenne igjen. Lys i Nødmodus kan blinke begge. I en nødsituasjon er ethvert signal som tiltrekker oppmerksomhet godt nok, så bruk det du kan.</p><p>Mot helikopter: begge armene rett opp betyr «ja, vi trenger hjelp». Én arm opp og én ned betyr «nei».</p>', 'signals'],
      ['Hold varmen og vent','<p>Spar på kreftene og søk ly i tide: bruk vindsekken, eller grav deg ned i snøen. Isoler mot bakken, og skift til tørre klær hvis du kan. Har du med refleksvest eller hodelykt, bruk dem, så du er lettere å finne.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="kantgrop">Kantgrop ›</button> <button class="btn small" data-nav data-act="openGuide" data-guide="winter">Vinterråd ›</button></p>', 'wait'],
      ['Spar batteri','<p>Bruk mobilen bare til det som trengs, og hold den varm. Følg rådene fra nødsentralen.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="phone" data-sec="battery">Mobilen på tur ›</button></p>', 'battery'],
      ['Førstehjelp','<p>Førstehjelp lærer du best på et kurs, helst før turen. Mens du venter på hjelp, følg rådene fra nødsentralen. Har førstehjelpssettet en veiledning eller plakat, ta den fram.</p>[[web:https://www.helsenorge.no|Helsenorge]][[web:https://nrr.org|Norsk Resuscitasjonsråd: retningslinjer for hjerte-lunge-redning]]', 'firstaid']]},
    kantgrop:{title:'Kantgrop', short:'Raskt ly i snøen', sub:'Et raskt ly i snøen, for en planlagt natt eller i en nødsituasjon. Blant annet etter Norges idrettshøgskole.', secs:[
      ['Hvorfor kantgrop','<p>Den er raskere å lage enn en snøhule, rundt en time mot flere timer. Den trenger bare en lav snøkant, ikke en dyp fonn. Den lages i små kanter der skredfaren er lav. Vær to per grop, så begge kan jobbe hele tiden.</p>', 'why'],
      ['Velg stedet','<p>En snøkant eller fonn på rundt to meter. Sjekk at det er dypt nok med søkestang eller stav. Ikke under bratte heng, i renner eller nær en skavl. Lager dere flere groper, hold minst to meter mellom dem.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="aval">Topptur og skred ›</button></p>', 'site'],
      ['Slik bygger du den','<p>Grav en grøft rett inn i kanten, rundt 2,5 meter lang, skulderbred og ikke dypere enn til halsen; kast snøen ut og ned. Grav litt inn til sidene nederst, så det blir plass til å ligge.</p><p>Skjær ut snøblokker og legg dem skrått mot hverandre over grøfta, som et saltak; tett fugene med snø og klapp lett.</p><p>Lag inngangen lavere enn liggeflaten, med trinn ned: den kalde luften blir liggende i den lave delen (kuldelåsen). Stikk et lufthull i taket med staven. Merk inngangen med staven eller søkestanga.</p>', 'build'],
      ['Inne','<p>Ta spaden og utstyret inn, i tilfelle det snør igjen i løpet av natten. Ligg på underlag. Hold lufthullet åpent, og sett staven i det så det ikke blåser tett. Bruk hodelykt til lys. Sjekk inngangen om morgenen etter snøfall.</p>', 'inside'],
      ['Brenner og kullos','<p>Bruk brenner eller levende lys i gropa bare i en nødsituasjon, for eksempel for å smelte snø til drikke. Kullos er en giftig gass uten lukt og farge, og dannes når noe brenner ufullstendig; i et lite rom kan også oksygenet bli for lite.</p><p>Sørg for rikelig lufting: hold lufthullet og inngangen åpne mens brenneren er i bruk, og kok aldri med inngangen tettet. Sett brenneren på et stødig underlag, som brennerplata, en spade eller en flat stein, så den ikke synker ned i snøen. Det er trangt: hold flammen godt unna tak, vegger, sovepose og klær.</p><p>Følg med på flammen: en gul, urolig flamme på brenneren er et tegn på dårlig forbrenning. En blå flamme betyr likevel ikke at det er trygt, særlig ikke med en gryte over. Slukk brenneren før dere legger dere.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="stoveboard">Brennerplate ›</button></p>', 'stove'],
      ['Andre ly i snøen','<ul><li><b>Snøhule:</b> gravd vannrett inn i en dyp fonn; varm, men tar lang tid og trenger mye snø. Lages med kuldelås og lufthull, som kantgropa.</li><li><b>Snøgrop:</b> grøft rett ned i flat snø med tak av ski, staver eller snøblokker, når det ikke finnes noen kant.</li><li><b>Vindsekk:</b> ingen graving, det raskeste lyet når det haster.</li></ul>', 'other'],
      ['Øv først','<p>Grav en kantgrop på en fin dag før du må gjøre det i dårlig vær.</p>', 'practice']]},
    meds:{title:'Medisiner på tur', short:'Hva tablettene er til, og når du skal la være', sub:'Ingen doser her. Les alltid pakningsvedlegget, og spør lege eller apotek hvis du er usikker.', secs:[
      ['Før turen','<ul><li>Les pakningsvedlegget hjemme, mens du har nett. Pakningsvedleggene finnes også på felleskatalogen.no.</li><li><b>Personlige medisiner:</b> Ta med nok til hele turen, og litt ekstra i tilfelle turen blir lengre enn planlagt.</li><li><b>Adrenalinpenn:</b> Ha den lett tilgjengelig, ikke nederst i sekken, og fortell turfølget hvor den er.</li><li>Har du en sykdom, bruker andre medisiner, er gravid eller ammer: spør lege eller apotek før turen om hva du kan ta.</li></ul>[[web:https://www.felleskatalogen.no|Felleskatalogen (pakningsvedlegg)]]', 'prep'],
      ['Smertestillende','<p>Paracetamol og ibuprofen brukes mot milde til moderate smerter og feber. De lindrer, men fjerner ikke årsaken.</p><ul><li><b>Paracetamol:</b> For mye kan gi alvorlig leverskade. Mange legemidler inneholder paracetamol, så ikke ta flere slike samtidig uten å spørre lege eller apotek. Vær forsiktig hvis du drikker mye alkohol.</li><li><b>Ibuprofen</b> (betennelsesdempende): Ikke bruk hvis du har hatt magesår eller mageblødning, hvis slike midler har gitt deg astma, utslett eller rennende nese, ved alvorlig hjerte-, lever- eller nyresvikt, eller hvis du er mer enn 6 måneder gravid. Snakk med lege eller apotek først hvis du har astma, nedsatt nyre- eller leverfunksjon, bruker blodfortynnende eller er gravid.</li><li><b>Ibuprofen og væske:</b> Sterkt væsketap øker faren for nyreskade. Drikk nok, og vær særlig varsom etter oppkast, diaré eller en dag med lite drikke.</li><li>Ikke ta ibuprofen sammen med andre betennelsesdempende midler. Alkohol øker faren for blødning. Ibuprofen kan skjule tegn på infeksjon, som feber og smerter.</li></ul><p>Blir du ikke bedre, eller verre, kontakt lege. Pakningsvedlegget sier når.</p>', 'pain'],
      ['Diaré','<ul><li>Det viktigste er å drikke rikelig. Glukose-elektrolyttpulver i rent eller kokt vann erstatter salt og sukker.</li><li>Middel mot diaré gjør avføringen fastere, men fjerner ikke årsaken.</li><li>Ikke bruk det ved høy feber (over 39 °C) eller blod i avføringen. Kontakt lege.</li><li>Ikke til barn under 12 år uten at lege har sagt det.</li></ul>', 'diarrhea'],
      ['Allergi og stikk','<ul><li>Reseptfrie allergitabletter (antihistamin) brukes mot øye- og neseplager ved allergi, og noen også mot elveblest. Les hva pakningsvedlegget til din sier.</li><li>De kan svekke årvåkenheten hos noen, særlig sammen med alkohol.</li><li><b>Alvorlig allergisk reaksjon</b> (pustevansker, hevelse i munn eller hals, svimmelhet, blekhet): ring [[em]] med en gang. Har personen adrenalinpenn, bruk den, og ring likevel.</li><li>Stikk i munnen eller halsen kan gi hevelse og pustevansker, også hos dem som ikke er allergiske.</li></ul>', 'allergy'],
      ['Medisinsk kull','<ul><li>Medisinsk kull kan være nyttig ved noen forgiftninger, men det er ikke alltid riktig å gi det.</li><li>I Norge: ring alltid Giftinformasjonen før du gir kull, på 22 59 13 00, åpent hele døgnet. Ved alvorlige symptomer: ring [[em]].</li></ul>', 'charcoal'],
      ['Når du trenger hjelp','[[emergency]]', 'help']]},
    sleep:{title:'Sove godt på tur', short:'Varm og tørr om natta', sub:'Varm, tørr og uthvilt.', secs:[
      ['Varm om natta','<ul><li><b>Tørre klær:</b> Skift til tørre klær for natta. Klær du har gått i hele dagen er fuktige og stjeler varme. Lue eller balaklava hjelper.</li><li><b>Tiss før du legger deg:</b> Da slipper du å stå opp, kle på deg og gå ut i kulda midt på natta. Våkner du og må tisse, gjør det heller enn å ligge våken. Er det svært kaldt: ha en egen tisseflaske i teltet, tydelig merket og helt tett.</li><li><b>Isolasjon under deg:</b> Mye av varmen går ned i bakken. Om vinteren: to liggeunderlag. Ligg slik at du ikke klemmer sammen fyllet i posen.</li><li><b>Varmeflaske:</b> En flaske varmt vann, pakket inn i et klesplagg, gir varme langt utover natta. Bruk en flaske som tåler varmt vann og er helt tett.</li></ul>'],
      ['Lyse netter','<p>Sovemaske og ørepropper.</p>'],
      ['Om morgenen','<p>Luft soveposen så fukten slipper ut, gjerne mens den ennå er varm. Om vinteren kan du frysetørke soveposen og annet utstyr, men bare i godt vær: heng det ut i tørr kulde og rist av rimet.</p>']]},
    tracks:{title:'Dyrespor', short:'Hvem har gått her?', sub:'Mål sporet uten klørne, og følg sporrekken et stykke før du bestemmer deg.', secs:[
      ['Slik leser du et spor', '<ul><li>Mål lengden uten klør, og uten biklover hos hjortedyr.</li><li>Tell tærne: hundedyr og gaupe har fire, bjørn og mårdyr (jerv, oter) fem. Hjortedyr har to klover.</li><li>Se på formen: hundedyr setter symmetriske spor; gaupe, hare og mårdyr gjør det ikke.</li><li>Følg sporrekken: gangart, skrittlengde og retning sier ofte mer enn ett avtrykk.</li><li>Spor forandrer seg raskt i mildvær og sol, og utsmeltede spor blir større enn de var.</li><li>Følg ferske spor bakover, motsatt vei av dyret, så du ikke forstyrrer det. Legg en stav eller hanske ved sporet når du tar bilde.</li></ul><p><b>Tegningene:</b> forfoten til venstre og bakfoten til høyre der de er ulike. Streken under er 5 cm, og tegningene er vist i riktig størrelse i forhold til hverandre. Bleke puter vises bare av og til.</p>', 'read'],
      ['Elg, rein og rådyr', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-deer.svg" style="width:335px"></div></figure><p>Elg, rein og rådyr i samme målestokk. Rådyrets bakfot står under forfoten.</p><ul><li><b>Elg:</b> 12–16 cm. Med biklovene, som vises i løs snø og på bløt mark, opptil 26 cm. Kalver har 8–11 cm om høsten. Skrittlengden i gang er 1,5–2 m, og klovene spriker når elgen går fort.</li><li><b>Rein:</b> 8–10 cm. Runde avtrykk med brede klover og mye hår. Ofte mange dyr sammen, og gjerne på faste trekkveier.</li><li><b>Rådyr:</b> 4–5,5 cm. Små, spisse klover; i dyp snø blir avtrykkene små hull.</li></ul>', 'deer'],
      ['Hare og ekorn', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-hare.svg" style="width:256px"></div></figure><p>Til høyre: sprangmønsteret. Pila viser retningen.</p><ul><li><b>Hare:</b> bakfot 7–10 cm, forfot 5–7 cm. I sprang lander bakføttene side om side foran forføttene, som står etter hverandre bak. Fire tær, hårete under. Sprang i fart kan ligne en rev i trav: se på størrelsen og om sporet er symmetrisk.</li></ul><figure class="sb-fig trk"><div data-svgsrc="guides/track-squirrel.svg" style="width:138px"></div></figure><ul><li><b>Ekorn:</b> bakfot 5–6 cm, forfot 3–4 cm. Alltid sprang på bakken, med 40–80 cm mellom sporgruppene, og sporene fører raskt til et tre. Kongler med avrevne skjell i nærheten.</li></ul>', 'hare'],
      ['Rev og hund', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-foxdog.svg" style="width:190px"></div></figure><p>Rev til venstre, hund til høyre.</p><ul><li><b>Rødrev:</b> forfot 5,5–7 cm, bakfot 5–6 cm. Fire tær, symmetrisk, og klørne vises ofte. Smalt, ovalt avtrykk med store fremre tær og en liten, trekantet hovedpute. Går oftest i trav med bakfoten i forfotens spor, i en rett og målrettet linje.</li><li><b>Hund:</b> størrelsen varierer med rasen. Rundere avtrykk med stor hovedpute. Hundespor vimser mer rundt, er mer bredbente og mindre målrettet enn spor etter rev og ulv.</li></ul>', 'fox'],
      ['Ulv', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-wolf.svg" style="width:275px"></div></figure><ul><li>Forfot 9,5–12 cm, bakfot 8,5–11 cm. Fire tær, symmetrisk.</li><li>Går mest i trav i en rett, målbevisst linje, med 1,2–1,6 m skrittlengde. En flokk går ofte i hverandres spor i løs snø.</li><li>Ulv og stor hund kan ikke skilles sikkert på ett avtrykk. Se på sporrekken.</li></ul>', 'wolf'],
      ['Gaupe', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-lynx.svg" style="width:225px"></div></figure><ul><li>Forfot oftest 7–9 cm, bakfot 6–7 cm (forfoten 6–11 cm, bakfoten 5,5–10 cm).</li><li>Fire tær, rundt og usymmetrisk avtrykk med god avstand mellom tåputene. Klørne vises sjelden.</li><li>Går mest i gang. I løs snø vises ofte merker etter hasen bak bakfoten.</li></ul>', 'lynx'],
      ['Jerv', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-wolverine.svg" style="width:281px"></div></figure><ul><li>Forfot 9–18 cm (lengst med hælputen), bakfot 8–12 cm.</li><li>Fem tær i en halvsirkel. Typisk sporrekke er skrå «trespor» i galopp.</li><li>Kan ligne et lite bjørnespor, men bjørnetærne står mer på linje, og bjørnen skrever mer.</li></ul>', 'wolverine'],
      ['Brunbjørn', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-bear.svg" style="width:356px"></div></figure><ul><li>Bakfot 18–25 cm lang, forfot 11–17 cm bred. Fem tær nesten på linje, med tydelige kloavtrykk, tydeligst på forfoten.</li><li>Bakfoten ligner en bred menneskefot. Går mest i gang, med tærne litt innover.</li><li>Andre tegn: opprevne maurtuer, sundrevne stubber og klorisp i trær.</li></ul>', 'bear'],
      ['Oter', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-otter.svg" style="width:100px"></div></figure><ul><li>Rundt 5–7 cm, opptil 7–9 cm med hælputen. Fem tær; svømmehuden vises sjelden.</li><li>Spor langs vann, elvebredder og kyst. I snø sklir oteren ofte på magen, og etterlater en renne.</li></ul>', 'otter'],
      ['Rype', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-grouse.svg" style="width:88px"></div></figure><ul><li>Rundt 4,5 cm, tre tær fram. Om vinteren gjør de fjærkledte tærne avtrykket bredt og uklart.</li><li>Ofte mange spor sammen. Vingemerker i snøen der rypa har landet eller lettet, og groper der den har gravd seg ned for natta.</li></ul>', 'grouse']]},
    animals:{title:'Møte med dyr', short:'Elg, beitedyr, hoggorm, flått og bjørn', sub:'De fleste møter med dyr går fint. Hold avstand, og gi dyrene god plass.', secs:[
      ['Elg', '<ul><li>Elgen er normalt sky og trekker seg unna. Hold avstand: 50 meter kan være for nært. Gå rundt eller vent.</li><li>Viser elgen tegn til irritasjon, er du for nær. Vær særlig varsom med ku med kalv, som kan være lettere å provosere enn en okse.</li><li>En elg som angriper, sparker med frambeina. En ku uten gevir er derfor like farlig som en okse.</li><li>Ikke send hunden mot elgen, og ikke gjør halvhjertede forsøk på å jage den.</li></ul>', 'moose'],
      ['Beitedyr', '<ul><li>Kyr er nysgjerrige og kan komme tett på uten å være farlige. Hold god avstand, særlig med barn og hund.</li><li>Gå aldri bort til en kalv, og aldri mellom ku og kalv.</li><li>Ta helst ikke med hund inn i beite med kyr: kyrne ser hunden som et rovdyr.</li><li>Båndtvang gjelder i hele landet fra 1. april til 20. august, også når du ikke ser dyr. Mange kommuner har lengre båndtvang, så sjekk der du går.</li><li>Lukk grinder etter deg.</li></ul>', 'grazing'],
      ['Hoggorm', '<ul><li>Norges eneste giftige slange. Finnes over det meste av Sør-Norge og nord til Rana, helst i solvarme lier, lyng, myr og ved steingjerder, også i fjellet der det er blåbærlyng.</li><li>Den kryper som regel unna, men biter hvis den blir tråkket på eller du kommer for nær. Gode sko eller støvler gir litt beskyttelse, men om sommeren kan hoggorm være nesten hvor som helst: se hvor du setter føttene.</li><li><b>Blir noen bitt:</b> hold personen i ro, og hold kroppsdelen høyt og i ro. Kontakt lege eller Giftinformasjonen (22 59 13 00). Ved alvorlige symptomer: ring [[em]].</li><li>Hoggormen er fredet.</li></ul>', 'adder'],
      ['Flått', '<ul><li>Skogflått er vanlig langs kysten fra Østfold til Nordland, og er aktiv fra april til november, mest om våren. Den trives i fuktig gress, busker og kratt.</li><li>Bruk lange bukser, og vær godt dekket ved anklene.</li><li>Se etter flått på kroppen og i håret etter turen, og sjekk hunden daglig.</li><li>Fjern flåtten så raskt som mulig, med pinsett eller flåttfjerner. Fjernes den innen ett døgn, er risikoen for borreliose lav.</li><li>Får du en rød ring som vokser rundt bittet, kontakt lege. Det er det vanligste tegnet på borreliose.</li><li>Det finnes vaksine mot skogflåttencefalitt (TBE). Spør lege om du bør ta den.</li></ul>', 'ticks'],
      ['Bjørn', '<p><b>Rådene her gjelder brunbjørn i Norge og Sverige.</b> Andre bjørnearter oppfører seg annerledes, og råd for én art kan være feil og farlige for en annen. Andre steder: følg rådene som gjelder der.</p><ul><li>Bjørnen oppdager deg som regel først og trekker seg unna. Gjør deg hørt: snakk, tråkk på kvister, og hold hunden i bånd.</li><li><b>Har den ikke sett deg:</b> stopp, vær rolig, ikke løp, og trekk deg stille tilbake.</li><li><b>Har den sett deg:</b> snakk med vanlig stemme, ikke rop eller vift med armene, og trekk deg rolig tilbake. En bjørn som reiser seg på bakbeina, prøver bare å få oversikt.</li><li><b>Blir den stående, eller fnyser:</b> gå tilbake samme vei som du kom, ikke rundt den. Den kan ha unger eller mat i nærheten.</li><li><b>Følger den etter deg:</b> ikke løp, snakk rolig, og slipp noe (lue, bærspann) foran deg mens du trekker deg unna.</li><li><b>Angriper den</b>, noe som er ekstremt sjeldent: spill død bare som siste utvei. Legg deg på magen eller i fosterstilling, beskytt nakken med hendene, og ligg stille til bjørnen har gått.</li></ul><p><b>Isbjørn på Svalbard er noe helt annet,</b> og rådene over gjelder ikke. Isbjørn kan være dødelig farlig. Utenfor bosettingene krever loven at du kan sikre deg mot isbjørn og har med midler til å skremme den bort, og du må holde minst 300 meter avstand (500 meter fra 1. mars til 30. juni). Sysselmesteren sier: ikke forlat bosettingene uten egnet våpen og erfaring med å bruke det. Følg Sysselmesterens råd, eller gå med en organisert tur.</p><p><b>Svartbjørn (Nord-Amerika) er også annerledes:</b> angriper en svartbjørn, er rådet det motsatte av for brunbjørn. Ikke spill død, kom deg inn i en bil eller et hus hvis du kan, og ellers kjemp imot. Følg alltid de lokale rådene der du er.</p>', 'bear']]},
    ski:{title:'Ski: smøring og feller', short:'Festesmøring, feller og glider', sub:'Feste i motbakkene, glid i utforkjøringene, feller som sitter.', secs:[
      ['Festesmøring','<ul><li><b>Voks eller klister:</b> Festesmøring finnes som voks for tørr snø og klister for våt snø. Jo kaldere snø, jo hardere voks. Klister brukes når snøen er våt, gammel og grovkornet, eller sporet er isete. På nysnø er voks oftest best, også rundt null.</li><li><b>Les skiene:</b> For myk voks på kaldt føre gjør at snøen trenger inn: skiene kladder og iser. Skrap av og legg en hardere voks. Glipper skiene, legg en mykere voks.</li><li><b>Legg på:</b> Legg festesmøringen inne før turen, i tynne lag, og kork ut hvert lag. Klister legges i fiskebeinsmønster i festesonen og jevnes ut. På hardt eller kornete føre holder festet lenger med grunnvoks under. La skiene bli kalde ute før du går, ellers fester snøen seg i smøringen.</li><li><b>På tur:</b> Ta med både voks, klister og skrape, særlig når temperaturen skifter gjennom dagen.</li></ul>', 'wax'],
      ['Feller','<ul><li><b>Kortfeller eller langfeller:</b> Kortfeller er vanlige på fjellski og sitter i et feste på ski som er laget for dem. Langfeller dekker hele sålen og brukes på topptur, og noen ganger på vanlige fjellski når det er bratt. Stell og oppbevaring er likt for begge.</li><li><b>Limsiden:</b> Hold limet rent og tørt: aldri mot snø, gulv, tepper eller klær. Har det kommet snø på limet, dra limsiden over stålkanten på skia.</li><li><b>Feller som iser:</b> Fellevoks på hårsiden hindrer kladding og ising. Ha den med i sekken.</li><li><b>I kulde:</b> Når fellene er av, bær dem inne i jakka, så limet ikke blir for kaldt.</li><li><b>Varme:</b> Hold fellene unna ovn og bål. Limet tåler ikke varme.</li><li><b>Etter turen:</b> Tørk fellene helt. Oppbevar dem lim mot lim eller på beskyttelsesduken de kom med. Begge deler fungerer; velg det som er mest praktisk for deg.</li></ul>', 'skins'],
      ['Hjemme','<p>Rengjør sålen før du smører. Glider smeltes inn, kjøles, skrapes og børstes. Skrap og børst godt: rester av glider kan svekke limet på fellene. Bruk fluorfri glider. Gammel fluorsmøring leveres som farlig avfall.</p>']]},
    pack:{title:'Pakk sekken', short:'Soner, tørt og riktig justert', sub:'Tungt inntil ryggen, det du trenger øverst.', secs:[
      ['Slik pakker du','<figure class="sb-fig"><div data-svgsrc="guides/pack-zones.svg"></div></figure><ul><li><b>Tungt inntil ryggen:</b> Mat, brensel, kjele og vann midt i sekken, tett inntil ryggen og omtrent mellom skulderbladene.</li><li><b>Lett og stort nederst:</b> Soveposen og annet du ikke trenger før kvelden.</li><li><b>Øverst og i lokket:</b> Det du trenger underveis: ekstra lag, regntøy, matpakke, kart, hodelykt og førstehjelpssett. Snacks og solkrem i hoftebelte- eller sidelommer.</li><li><b>Utenpå:</b> Så lite som mulig. Det henger seg fast, blir vått og vipper sekken.</li><li><b>Tørt:</b> Pakk i pakkposer, eller bruk en stor pose som innerfôr, og ha regntrekk klart.</li></ul>', 'zones'],
      ['Juster sekken','<p>Stram hoftebeltet først, så det bærer det meste av vekten. Så skulderstroppene, og til slutt lastløfterne.</p><p>[[plan:weight]]</p>']]},
    repair:{title:'Reparasjoner på tur', short:'Fiks det på tur', sub:'Lapping, liggeunderlag og teltstenger.', secs:[
      ['Lapp på stoff','<ul><li><b>Lapp på stoff:</b> Rens med spritserviett og la det tørke. Klipp lappen med runde hjørner og god margin rundt hullet. Lapp begge sider når du kan.</li><li><b>Rift mot en kant:</b> Legg nylonsnoren langs kanten, brett lappen over den, og legg en lapp også på baksiden. Da river det ikke opp igjen når stoffet strammes.</li></ul><figure class="sb-fig"><div data-svgsrc="guides/edge-repair.svg"></div></figure>', 'patch'],
      ['Lekk i liggeunderlaget','<p>Blås det opp og lytt, eller smør på vann med litt såpe og se etter bobler. Merk stedet, tørk det, og lim og lapp etter anvisningen i reparasjonssettet. La limet tørke før du blåser opp igjen.</p>', 'pad'],
      ['Brukket teltstang','<p>Tre reparasjonshylsen over bruddet og tape den fast i begge ender med gaffatape. Har du ingen hylse, skinne med en plugg eller en rett pinne og tape godt.</p>', 'pole']]},
    fire:{title:'Bål', short:'Godt bål og ild i en nødsituasjon', sub:'Det grunnleggende om bål på tur.', secs:[
      ['Før du tenner','<ul><li><b>Bålforbud:</b> det er forbudt å gjøre opp ild i eller nær skog og annen utmark fra 15. april til 15. september, med mindre det åpenbart ikke kan føre til brann. Kommunen kan ha strengere regler.</li><li>Bruk et eksisterende bålsted hvis det finnes. Unngå bart fjell, som sprekker og får merker, og hold avstand til teltet. Gnister smelter stoffet.</li><li>Sjekk vinden, og ha vann klart.</li></ul>'],
      ['Tenning','<ul><li>Samle alt før du tenner: never eller annet opptenningsmateriale, tynne kvister, tykkere pinner og ved.</li><li>Bjørkenever brenner også når den er våt. Døde kvister nederst på grantrær er som regel tørre.</li><li>Kløyv våt ved. Innsiden er ofte tørr.</li><li>Start smått og legg på gradvis. Et lite bål er lettere å holde i gang og gir bedre varme til matlaging.</li></ul>'],
      ['Tennstål','<figure class="sb-fig"><div data-svgsrc="guides/firesteel.svg"></div></figure><ul><li><b>Slik slår du:</b> Hold skrapen eller en skarp knivrygg stille, tett inntil tennmaterialet, og trekk staven bakover mot deg. Da slår du ikke tennmaterialet bort.</li><li><b>Tennmateriale:</b> Bjørkenever, tennposer eller annet som tar fyr av en gnist. Ha alt klart før du slår.</li></ul>', 'steel'],
      ['I en nødsituasjon','<ul><li>Bålet skal gi varme og tørke klær. Hold det lite og i le for vinden.</li><li>Tennposer og tennstål ligger i Ild i reparasjonssettet.</li><li>I en reell nødsituasjon går liv og helse foran.</li></ul>'],
      ['Etterpå','<ul><li>Slokk med vann til asken er kald å ta på.</li><li>Ikke brenn plast eller søppel, og forlat stedet slik du fant det.</li></ul>']]}
  },
  en:{
    shell:{title:'Shell clothing', short:'Breathability, washing and re-proofing', sub:'A quick check before and after a trip. The care label and the manufacturer\'s advice come first.', secs:[
      ['Why it matters','<p>The outer fabric has a water-repellent coating that makes water bead and roll off. When the coating wears off, the fabric soaks up water. The jacket doesn\'t leak, but it stops breathing and feels clammy inside. Dirt, sweat, sunscreen and smoke wear the coating down faster.</p>'],
      ['Before the trip','<ul><li>Sprinkle some water on the shoulders. If it beads, it\'s fine. If it darkens and soaks in, wash and re-proof the garment.</li><li>Check zips, cuffs, the hood adjustment and that the seam tape isn\'t peeling.</li></ul>'],
      ['After the trip','<ul><li>Hang it up to dry fully before storing it, away from direct heat.</li><li>Brush off dry mud, and store it hanging, not compressed.</li></ul>'],
      ['Washing','<ul><li>Wash when it\'s dirty or stops beading, following the care label (usually 30–40 °C).</li><li>Close all zips and Velcro, and use liquid detergent or a technical wash.</li><li>Never use fabric softener, bleach or dry cleaning. Rinse well.</li></ul>'],
      ['Re-proofing','<ul><li>Heat often brings back the water repellency: tumble dry on low or medium for about 20 minutes, if the label allows.</li><li>If it still doesn\'t bead, use a spray-on proofing product on the outside, then heat as the product describes.</li></ul>']]},
    boots:{title:'Hiking boots', short:'Leather, technical and ski boots', sub:'A quick check before and after a trip. The care label and the manufacturer\'s advice come first.', secs:[
      ['Before the trip','<ul><li>Check the soles and tread, stitching, the rubber rand, laces and eyelets.</li><li>Make sure the boots have been treated since the last trip.</li></ul>'],
      ['After the trip, all boots','<ul><li>Take out the insoles, loosen the laces, and brush or rinse off mud. Dried mud draws moisture out of leather.</li><li>Dry them slowly at room temperature, with newspaper inside, changed when it\'s wet.</li><li>Never by a fire, stove or radiator. Heat cracks leather and weakens the glue.</li><li>Store them dry and airy, not in a plastic bag or a hot car.</li></ul>'],
      ['Leather boots','<ul><li>When clean, treat them with wax or care products for the leather type. Smooth leather and nubuck need different products.</li><li>For boots with a membrane, avoid heavy grease. It softens the leather and reduces breathability. Use a product meant for membrane boots.</li></ul>'],
      ['Technical boots (fabric and synthetic)','<ul><li>Clean with water, and mild soap if needed. Don\'t use wax on the fabric.</li><li>Re-proof with a spray when water no longer beads.</li></ul>'],
      ['Ski boots','<p>As for hiking boots: dry slowly at room temperature, never by a fire or stove, and treat leather ski boots like leather hiking boots.</p><ul><li>If the liners come out, take them out after each day and dry them separately. That\'s where the moisture sits. In a tent, they can go in the sleeping bag overnight so they don\'t freeze.</li><li>Before the trip, check the part that meets the binding (sole edge, bar or inserts) for wear and cracks, and that it isn\'t packed with ice or dirt.</li><li>Check buckles, straps and laces.</li><li>Store plastic boots with the buckles loosely closed, so the shell keeps its shape.</li></ul>','ski']]},
    tent:{title:'Tent', short:'Check before and after a trip', sub:'A quick check before and after a trip. The manufacturer\'s advice comes first.', secs:[
      ['Before the trip','<ul><li>After storage, or before the first trip of the season, pitch the tent at home and check that everything is there: inner tent, fly, poles, pegs and guylines.</li><li>Check the pole sections and the elastic cord, the zips, the seam tape, and that water still beads on the fly.</li><li>Make sure the patch kit and a pole repair sleeve are in the repair kit.</li></ul>'],
      ['On the trip','<ul><li>The tent itself (inner tent and fly) can be packed inside the backpack instead of strapped outside. It stays dry, doesn\'t catch on branches and keeps the pack balanced. The poles go outside or along the back.</li><li>A wet fly can go in its own bag or an outer pocket, so the rest of the pack stays dry.</li><li>Avoid leaving the tent pitched in strong sun for days. Sunlight wears down the fabric.</li></ul>'],
      ['After the trip','<ul><li>Dry the tent completely within a day or two, even if it seemed dry when you packed it. Stored damp, it gets mould and a sour smell, and the coating breaks down.</li><li>Shake out sand and needles, and wipe off mud with water and a sponge. No detergent or washing machine.</li><li>Clean and count the pegs.</li><li>Stuff the fly into the bag, or fold it along new lines each time. The same creases over and over wear the coating.</li><li>Store it loosely packed, dry and cool, not tightly compressed.</li></ul><p>Coil the tent\'s guylines the same way as the tarp\'s. <button class="btn small" data-nav data-act="openGuide" data-guide="tarp" data-sec="guy">Tarp ›</button></p>']]},
    tarp:{title:'Tarp', short:'With the tent, on its own or over a hammock', sub:'The basics to get started.', secs:[
      ['Uses','<ul><li><b>With the tent:</b> a dry place for cooking and sitting outside when it rains.</li><li><b>On its own:</b> lighter and airier than a tent, but less protection from wind and insects. Best in summer and below the tree line.</li><li><b>Over a hammock:</b> the roof, hung longer than the hammock.</li><li><b>As shade</b> on hot days and in the midday sun.</li><li><b>In an emergency,</b> a bivy sack or Jervenduk can be rigged as a simple shelter.</li></ul>'],
      ['Pitching, the basics','<ul><li>Tie a tight ridgeline between two trees: a bowline at one end and a taut-line hitch at the other, so you can tighten it.</li><li>Use taut-line hitches on the guylines, so they can be adjusted.</li><li>In bad weather: low, with the back to the wind. In good weather: higher and more open.</li><li>Pitch it tight and with a slope, so it doesn\'t flap and water doesn\'t collect.</li></ul><p><button class="btn small" data-nav data-act="openGuide" data-guide="knots">Knots ›</button></p>'],
      ['Packing','<ul><li>Brush off dirt and make sure the tarp is dry. If you have to pack it wet, dry it within a day or two.</li><li><b>Quick fold:</b> take the middle eyelet on one side in one hand, and the middle eyelet on the opposite side in the other. Bring them together, then grab the middle of the fold and pull it back. The tarp is now folded in four, and the rest is quick to fold to the size of the bag.</li><li>Fold along new lines each time, or stuff the tarp into the bag. Folding the same way every time wears the coating at the creases.</li><li>For storage at home: loosely packed, as for the tent.</li></ul>'],
      ['Guylines without tangles','<ul><li>Coil each guyline separately before the tarp goes in the bag. Wrap the cord in a figure of eight around your thumb and little finger, leave about 10 cm, wrap it around the middle of the bundle and tuck the end through the last loop.</li><li>If the tarp has corner pockets, the cord can be stuffed straight into them. Otherwise a small elastic band or Velcro strap around each bundle keeps it together.</li><li>Longer, thicker rope can be chained into a daisy chain, which opens with one pull.</li><li>Untie knots that have pulled tight before storing the tarp. The taut-line hitches on the guylines can stay.</li><li>Guylines with reflective thread are easier to see in the dark, so you don\'t trip over them.</li></ul>','guy'],
      ['Care','<p>As for the tent: dry the tarp completely before storing it.</p>']]},
    aval:{title:'Ski touring and avalanches', short:'Forecast, terrain and warning signs', sub:'The basics for trips in and near avalanche terrain. The app does not replace an avalanche course.', secs:[
      ['Before the trip','<ul><li>Check the avalanche forecast on <a href="https://www.varsom.no" target="_blank" rel="noopener">varsom.no</a> the same day: the danger level (1–5) and which avalanche problem it is about.</li><li>Look at slope-angle maps and avalanche hazard maps when planning the route. They also show where an avalanche can run.</li><li>Agree in advance where you will turn back.</li></ul>'],
      ['Terrain','<ul><li>Avalanches usually release on slopes steeper than 30 degrees. You can still be caught further down, in the runout zone, and an avalanche can run far out onto flat ground.</li><li>Terrain traps such as gullies, stream beds, cliffs and forest make the consequences of even a small avalanche much worse.</li><li>Ridges are often safer than open faces and gullies, but keep well back from the edge. Cornices can break far back, and don\'t stay underneath them.</li></ul>'],
      ['Warning signs on the way','<ul><li>Fresh avalanches, cracks shooting out from your skis, and whumpf sounds as the snow settles mean unstable snow. Turn back or choose gentler terrain.</li><li>Lots of new snow, strong wind moving snow, and rapid warming increase the danger.</li></ul>'],
      ['Gear and routines','<ul><li>Transceiver, probe and shovel for each person, and practise using them.</li><li>Test the transceivers in the group before you set off, as listed under Preparations.</li><li>An avalanche airbag is an addition, not a replacement for good choices.</li><li>Ski one at a time on steep slopes, and stop at safe spots out of the avalanche path.</li></ul><p><b>Take an avalanche course before you go into avalanche terrain.</b></p><p>Skins and wax: <button class="btn small" data-nav data-act="openGuide" data-guide="ski" data-sec="skins">Skis: wax and skins ›</button></p>']]},
    mapcompass:{title:'Map and compass', short:'Take a bearing and keep to it', sub:'Take a bearing in three steps, and keep to it.', secs:[
      ['The compass','<figure class="sb-fig"><div data-svgsrc="guides/compass-parts.svg"></div><ul class="fig-legend"><li><b class="fig-num">1</b><span>Direction-of-travel arrow: shows the way to go.</span></li><li><b class="fig-num">2</b><span>The edge: laid along the line on the map.</span></li><li><b class="fig-num">3</b><span>The compass housing with its degree ring, which turns.</span></li><li><b class="fig-num">4</b><span>The north lines and the N mark (orienting arrow) in the bottom of the housing.</span></li><li><b class="fig-num">5</b><span>The needle: the red end points to magnetic north.</span></li></ul></figure>', 'parts'],
      ['Taking a bearing','<figure class="sb-fig"><div data-svgsrc="guides/compass-steps.svg"></div></figure><ol><li>Lay the edge of the compass along the line from where you are to where you are going. The direction-of-travel arrow, not the needle, must point where you are going.</li><li>Turn the housing until the lines in its bottom are parallel with the map\'s north–south lines, with the N mark pointing up the map.</li><li>Take the compass off the map and hold it flat. Turn yourself until the red needle lies in the orienting arrow. The direction-of-travel arrow now shows the way to go.</li></ol>', 'steps'],
      ['Following the bearing','<ul><li>Aim at a point the arrow points to, a tree in the forest or a crag in the mountains. Walk there and aim again.</li><li>Split the route into legs between points you are sure of on the map, such as lakes, road junctions or stream junctions, and take a new bearing there.</li><li>Metal and power lines can pull the needle. Even a watch or knife close to the compass can give a wrong bearing.</li></ul>'],
      ['Declination','<p>The map\'s north–south lines do not point to magnetic north. The difference is called declination, and it varies with where you are in the country. You find it on the hiking map you make at norgeskart.no.</p><p>For an accurate bearing, turn the housing by as many degrees as the declination after step 2: clockwise if it is east, anticlockwise if it is west.</p><p>With 5 degrees of declination you miss by about 90 metres over one kilometre.</p>', 'decl'],
      ['Maps','<p>The «Norge 1:50 000» hiking map can be printed free from norgeskart.no. Always bring a map and compass, not just your phone.</p>[[web:https://www.norgeskart.no|Norgeskart]]', 'maps']]},
    emergency:{title:'Emergency', short:'When you need help', sub:'When you need help on a trip.', secs:[
      ['Call for help','[[calls]]<p>You can call 112 even if your own mobile operator has no coverage where you are, as long as another network has. Most newer phones send your position automatically when you call an emergency number.</p>', 'call'],
      ['What to say','<p>The operator takes you through set questions: what has happened, where, and whether anyone is injured. Answer briefly and calmly.</p><p>Be ready to say where you are: the coordinates from the map app or Emergency mode, place names, the terrain around you and how you got there. Follow the advice you are given while you wait for help.</p>', 'say'],
      ['Signals','<p>Give six signals a minute with a whistle, light or shouts, wait one minute, and repeat. The answer is three signals a minute. This is the alpine distress signal, used in the mountains.</p><p>SOS (three short, three long, three short: • • • — — — • • •) is the distress signal from the sea and is easy to recognise. Light in Emergency mode can flash both. In an emergency any signal that draws attention is good enough, so use what you can.</p><p>To a helicopter: both arms straight up means «yes, we need help». One arm up and one down means «no».</p>', 'signals'],
      ['Keep warm and wait','<p>Save your strength and find shelter in time: use the bivy sack, or dig yourself into the snow. Insulate yourself from the ground, and change into dry clothes if you can. If you have brought a reflective vest or a headlamp, use them, so you are easier to find.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="kantgrop">Snow trench shelter ›</button> <button class="btn small" data-nav data-act="openGuide" data-guide="winter">Winter advice ›</button></p>', 'wait'],
      ['Save battery','<p>Use the phone only for what is needed, and keep it warm. Follow the advice from the emergency centre.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="phone" data-sec="battery">Your phone outdoors ›</button></p>', 'battery'],
      ['First aid','<p>First aid is best learned on a course, ideally before the trip. While you wait for help, follow the advice from the emergency centre. If the first aid kit has a guide or poster, take it out.</p>[[web:https://www.helsenorge.no|Helsenorge (Norwegian health service)]][[web:https://nrr.org|Norwegian Resuscitation Council: CPR guidelines]]', 'firstaid']]},
    kantgrop:{title:'Snow trench shelter', short:'A quick shelter in the snow', sub:'A quick shelter in the snow (kantgrop), for a planned night or an emergency. Partly after the Norwegian School of Sport Sciences.', secs:[
      ['Why a snow trench','<p>It is quicker to make than a snow cave, about an hour against several hours. It only needs a low snow bank, not a deep snowdrift (fonn). It is made in small banks where the avalanche danger is low. Be two to a trench, so both can work all the time.</p>', 'why'],
      ['Choose the place','<p>A snow bank or drift of about two metres. Check that it is deep enough with a probe or pole. Not below steep slopes, in gullies or near a cornice. If you make several trenches, keep at least two metres between them.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="aval">Ski touring and avalanches ›</button></p>', 'site'],
      ['How to build it','<p>Dig a trench straight into the bank, about 2.5 metres long, shoulder wide and no deeper than your neck; throw the snow out and down. Dig a little into the sides at the bottom, so there is room to lie.</p><p>Cut snow blocks and lean them against each other over the trench, like a pitched roof; fill the joints with snow and pat lightly.</p><p>Make the entrance lower than the sleeping platform, with steps down: the cold air stays in the low part (the cold trap, kuldelås). Push an air vent through the roof with the pole. Mark the entrance with the pole or the probe.</p>', 'build'],
      ['Inside','<p>Take the shovel and your gear inside, in case it snows in during the night. Lie on a sleeping pad. Keep the air vent open, and leave the pole in it so it does not blow shut. Use a headlamp for light. Check the entrance in the morning after snowfall.</p>', 'inside'],
      ['Stove and carbon monoxide','<p>Use a stove or a candle in the trench only in an emergency, for example to melt snow for drinking. Carbon monoxide is a poisonous gas with no smell or colour, formed when something burns incompletely; in a small space the oxygen can also run low.</p><p>Make sure there is plenty of air: keep the air vent and the entrance open while the stove is in use, and never cook with the entrance closed. Put the stove on a steady base, such as the stove board, a shovel or a flat stone, so it does not sink into the snow. It is cramped: keep the flame well away from the roof, walls, sleeping bag and clothes.</p><p>Watch the flame: a yellow, flickering flame on the stove is a sign of poor burning. A blue flame still does not mean it is safe, especially with a pot over it. Turn the stove off before you go to sleep.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="stoveboard">Stove board ›</button></p>', 'stove'],
      ['Other snow shelters','<ul><li><b>Snow cave:</b> dug sideways into a deep snowdrift; warm, but takes a long time and needs a lot of snow. Made with a cold trap and an air vent, like the trench.</li><li><b>Snow pit:</b> a trench straight down into flat snow with a roof of skis, poles or snow blocks, when there is no bank.</li><li><b>Bivy sack:</b> no digging, the quickest shelter when time is short.</li></ul>', 'other'],
      ['Practise first','<p>Dig a snow trench on a fine day before you have to do it in bad weather.</p>', 'practice']]},
    meds:{title:'Medicines on the trip', short:'What the tablets are for, and when not to take them', sub:'No doses here. Always read the package leaflet, and ask a doctor or pharmacist if you are unsure.', secs:[
      ['Before the trip','<ul><li>Read the package leaflet at home, while you have a connection. Norwegian package leaflets are also on felleskatalogen.no.</li><li><b>Personal medicines:</b> Bring enough for the whole trip, and a little extra in case it takes longer than planned.</li><li><b>Adrenaline pen:</b> Keep it within easy reach, not at the bottom of the pack, and tell the group where it is.</li><li>If you have an illness, take other medicines, are pregnant or breastfeeding: ask a doctor or pharmacist before the trip what you can take.</li></ul>[[web:https://www.felleskatalogen.no|Felleskatalogen (package leaflets)]]', 'prep'],
      ['Painkillers','<p>Paracetamol (called acetaminophen in some countries) and ibuprofen are used for mild to moderate pain and fever. They relieve the symptoms but do not remove the cause.</p><ul><li><b>Paracetamol:</b> Too much can cause serious liver damage. Many medicines contain paracetamol, so do not take several at once without asking a doctor or pharmacist. Take care if you drink a lot of alcohol.</li><li><b>Ibuprofen</b> (anti-inflammatory): Do not use it if you have had a stomach ulcer or stomach bleeding, if such medicines have given you asthma, a rash or a runny nose, with severe heart, liver or kidney failure, or if you are more than 6 months pregnant. Talk to a doctor or pharmacist first if you have asthma, reduced kidney or liver function, take blood thinners or are pregnant.</li><li><b>Ibuprofen and fluids:</b> Losing a lot of fluid raises the risk of kidney damage. Drink enough, and take extra care after vomiting, diarrhoea or a day with little to drink.</li><li>Do not take ibuprofen together with other anti-inflammatory medicines. Alcohol raises the risk of bleeding. Ibuprofen can hide signs of infection, such as fever and pain.</li></ul><p>If you do not get better, or get worse, contact a doctor. The leaflet says when.</p>', 'pain'],
      ['Diarrhoea','<ul><li>The most important thing is to drink plenty. Glucose-electrolyte powder in clean or boiled water replaces salt and sugar.</li><li>Diarrhoea medicine makes the stool firmer, but does not remove the cause.</li><li>Do not use it with a high fever (over 39 °C) or blood in the stool. Contact a doctor.</li><li>Not for children under 12 unless a doctor has said so.</li></ul>', 'diarrhea'],
      ['Allergy and stings','<ul><li>Over-the-counter allergy tablets (antihistamines) are used for eye and nose symptoms from allergy, and some also for hives. Check what the leaflet for yours says.</li><li>They can reduce alertness in some people, especially with alcohol.</li><li><b>Severe allergic reaction</b> (difficulty breathing, swelling in the mouth or throat, dizziness, paleness): call [[em]] at once. If the person has an adrenaline pen, use it, and call anyway.</li><li>A sting in the mouth or throat can cause swelling and difficulty breathing, even in people who are not allergic.</li></ul>', 'allergy'],
      ['Medical charcoal','<ul><li>Medical charcoal can be useful for some poisonings, but it is not always right to give it.</li><li>In Norway: always call Poisons Information (Giftinformasjonen) before giving charcoal, on 22 59 13 00, open day and night. With severe symptoms: call [[em]].</li></ul>', 'charcoal'],
      ['When you need help','[[emergency]]', 'help']]},
    sleep:{title:'Sleeping well outdoors', short:'Warm and dry at night', sub:'Warm, dry and rested.', secs:[
      ['Warm at night','<ul><li><b>Dry clothes:</b> Change into dry clothes for the night. Clothes you have worn all day are damp and draw heat away. A hat or balaclava helps.</li><li><b>Pee before bed:</b> Then you don\'t have to get up, dress and go out into the cold in the middle of the night. If you wake up and need to pee, go rather than lie awake. When it is really cold: keep a pee bottle in the tent, clearly marked and fully sealed.</li><li><b>Insulation underneath:</b> Much of your heat goes into the ground. In winter: two sleeping pads. Lie so the filling of the bag is not squashed.</li><li><b>Hot water bottle:</b> A bottle of hot water wrapped in a piece of clothing gives warmth far into the night. Use a bottle that takes hot water and seals completely.</li></ul>'],
      ['Light nights','<p>Sleep mask and earplugs.</p>'],
      ['In the morning','<p>Air the sleeping bag so the moisture escapes, preferably while it is still warm. In winter you can freeze-dry the sleeping bag and other gear, but only in good weather: hang it out in dry cold and shake off the frost.</p>']]},
    tracks:{title:'Animal tracks', short:'Who walked here?', sub:'Measure the print without the claws, and follow the trail a while before you decide.', secs:[
      ['Reading a track', '<ul><li>Measure the length without the claws, and without the dewclaws on deer.</li><li>Count the toes: the dog family and lynx have four, bears and the weasel family (wolverine, otter) five. Deer have two hooves.</li><li>Look at the shape: the dog family leaves symmetric prints; lynx, hare and the weasel family do not.</li><li>Follow the trail: gait, stride and direction often tell you more than a single print.</li><li>Tracks change quickly in mild weather and sun, and melted-out tracks become larger than they were.</li><li>Follow fresh tracks backwards, the opposite way to the animal, so you do not disturb it. Lay a pole or glove beside the track when you take a photo.</li></ul><p><b>The drawings:</b> front foot on the left and hind foot on the right where they differ. The line below is 5 cm, and the drawings are shown at the right size compared with each other. Pale pads only show now and then.</p>', 'read'],
      ['Moose, reindeer and roe deer', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-deer.svg" style="width:335px"></div></figure><p>Moose, reindeer and roe deer at the same scale. The roe deer’s hind foot is below its front foot.</p><ul><li><b>Moose:</b> 12–16 cm. With the dewclaws, which show in loose snow and on soft ground, up to 26 cm. Calves are 8–11 cm in autumn. The stride when walking is 1.5–2 m, and the hooves spread when the moose moves fast.</li><li><b>Reindeer:</b> 8–10 cm. Round prints with broad hooves and a lot of hair. Often many animals together, and often on regular migration routes.</li><li><b>Roe deer:</b> 4–5.5 cm. Small, pointed hooves; in deep snow the prints become small holes.</li></ul>', 'deer'],
      ['Hare and squirrel', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-hare.svg" style="width:256px"></div></figure><p>On the right: the bounding pattern. The arrow shows the direction.</p><ul><li><b>Hare:</b> hind foot 7–10 cm, front foot 5–7 cm. When bounding, the hind feet land side by side in front of the front feet, which land one behind the other. Four toes, hairy underneath. A fast bound can look like a trotting fox: look at the size and whether the track is symmetric.</li></ul><figure class="sb-fig trk"><div data-svgsrc="guides/track-squirrel.svg" style="width:138px"></div></figure><ul><li><b>Red squirrel:</b> hind foot 5–6 cm, front foot 3–4 cm. Always bounds on the ground, with 40–80 cm between the groups of prints, and the tracks soon lead to a tree. Cones with the scales torn off nearby.</li></ul>', 'hare'],
      ['Fox and dog', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-foxdog.svg" style="width:190px"></div></figure><p>Fox on the left, dog on the right.</p><ul><li><b>Red fox:</b> front foot 5.5–7 cm, hind foot 5–6 cm. Four toes, symmetric, and the claws often show. A narrow, oval print with large front toes and a small, triangular main pad. Usually trots with the hind foot in the front foot’s print, in a straight, purposeful line.</li><li><b>Dog:</b> the size varies with the breed. A rounder print with a large main pad. Dog tracks wander more, are wider apart and less purposeful than fox and wolf tracks.</li></ul>', 'fox'],
      ['Wolf', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-wolf.svg" style="width:275px"></div></figure><ul><li>Front foot 9.5–12 cm, hind foot 8.5–11 cm. Four toes, symmetric.</li><li>Mostly trots in a straight, purposeful line, with a stride of 1.2–1.6 m. A pack often walks in each other’s tracks in loose snow.</li><li>A wolf and a large dog cannot be told apart for certain from one print. Look at the trail.</li></ul>', 'wolf'],
      ['Lynx', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-lynx.svg" style="width:225px"></div></figure><ul><li>Front foot usually 7–9 cm, hind foot 6–7 cm (front 6–11 cm, hind 5.5–10 cm).</li><li>Four toes, a round and asymmetric print with plenty of space between the toe pads. The claws seldom show.</li><li>Mostly walks. In loose snow there are often marks from the hock behind the hind foot.</li></ul>', 'lynx'],
      ['Wolverine', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-wolverine.svg" style="width:281px"></div></figure><ul><li>Front foot 9–18 cm (longest with the heel pad), hind foot 8–12 cm.</li><li>Five toes in a half circle. The typical trail is slanted groups of three prints when galloping.</li><li>Can look like a small bear print, but a bear’s toes sit more in a line, and a bear straddles more.</li></ul>', 'wolverine'],
      ['Brown bear', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-bear.svg" style="width:356px"></div></figure><ul><li>Hind foot 18–25 cm long, front foot 11–17 cm wide. Five toes almost in a line, with clear claw marks, clearest on the front foot.</li><li>The hind print looks like a broad human foot. Mostly walks, with the toes turned slightly in.</li><li>Other signs: anthills torn open, stumps ripped apart and claw marks on trees.</li></ul>', 'bear'],
      ['Otter', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-otter.svg" style="width:100px"></div></figure><ul><li>About 5–7 cm, up to 7–9 cm with the heel pad. Five toes; the webbing seldom shows.</li><li>Tracks along water, riverbanks and the coast. In snow the otter often slides on its belly and leaves a groove.</li></ul>', 'otter'],
      ['Ptarmigan', '<figure class="sb-fig trk"><div data-svgsrc="guides/track-grouse.svg" style="width:88px"></div></figure><ul><li>About 4.5 cm, three toes forward. In winter the feathered toes make the print broad and blurred.</li><li>Often many tracks together. Wing marks in the snow where a ptarmigan has landed or taken off, and hollows where it has dug in for the night.</li></ul>', 'grouse']]},
    animals:{title:'Meeting animals', short:'Moose, grazing animals, adders, ticks and bears', sub:'Most meetings with animals go well. Keep your distance, and give the animals plenty of room.', secs:[
      ['Moose', '<ul><li>Moose are normally shy and move away. Keep your distance: 50 metres can be too close. Go round or wait.</li><li>If the moose shows signs of irritation, you are too close. Take special care with a cow with a calf, which can be easier to provoke than a bull.</li><li>A moose that attacks kicks with its front legs. A cow without antlers is therefore as dangerous as a bull.</li><li>Do not send the dog towards the moose, and do not make half-hearted attempts to chase it away.</li></ul>', 'moose'],
      ['Grazing animals', '<ul><li>Cows are curious and may come close without being dangerous. Keep a good distance, especially with children and a dog.</li><li>Never walk up to a calf, and never between a cow and its calf.</li><li>Preferably do not take a dog into a pasture with cows: the cows see the dog as a predator.</li><li>In Norway dogs must be on a lead from 1 April to 20 August, also when you see no animals. Many municipalities have a longer period, so check where you walk.</li><li>Close gates behind you.</li></ul>', 'grazing'],
      ['Adder', '<ul><li>Norway’s only venomous snake. Found over most of southern Norway and north to Rana, mostly on sunny slopes, heather, bogs and by stone walls, also in the mountains where there is bilberry.</li><li>It usually slithers away, but bites if it is trodden on or you come too close. Good shoes or boots give some protection, but in summer adders can be almost anywhere: watch where you put your feet.</li><li><b>If someone is bitten:</b> keep the person still, and keep the limb raised and still. Contact a doctor or Poisons Information (Giftinformasjonen, 22 59 13 00). With severe symptoms: call [[em]].</li><li>The adder is protected.</li></ul>', 'adder'],
      ['Ticks', '<ul><li>Ticks are common along the coast from Østfold to Nordland, and are active from April to November, most in spring. They thrive in damp grass, bushes and scrub.</li><li>Wear long trousers, and keep your ankles well covered.</li><li>Check your body and hair for ticks after the trip, and check the dog daily.</li><li>Remove the tick as quickly as possible, with tweezers or a tick remover. Removed within a day, the risk of Lyme disease is low.</li><li>If a red ring grows around the bite, contact a doctor. It is the most common sign of Lyme disease.</li><li>There is a vaccine against tick-borne encephalitis (TBE). Ask a doctor whether you should have it.</li></ul>', 'ticks'],
      ['Bears', '<p><b>This advice is for brown bears in Norway and Sweden.</b> Other bear species behave differently, and advice for one species can be wrong and dangerous for another. Elsewhere: follow the advice that applies there.</p><ul><li>A bear usually notices you first and moves away. Make yourself heard: talk, step on twigs, and keep the dog on a lead.</li><li><b>If it has not seen you:</b> stop, stay calm, do not run, and back away quietly.</li><li><b>If it has seen you:</b> talk in a normal voice, do not shout or wave your arms, and back away calmly. A bear that stands up on its hind legs is only trying to get an overview.</li><li><b>If it stays put, or huffs:</b> go back the way you came, not around it. It may have cubs or food nearby.</li><li><b>If it follows you:</b> do not run, talk calmly, and drop something (a hat, a berry bucket) in front of you while you back away.</li><li><b>If it attacks</b>, which is extremely rare: play dead only as a last resort. Lie on your stomach or curl up, protect your neck with your hands, and lie still until the bear has gone.</li></ul><p><b>Polar bears on Svalbard are something else entirely,</b> and the advice above does not apply. Polar bears can be deadly dangerous. Outside the settlements the law requires you to know how to protect yourself against polar bears and to carry means of scaring them away, and you must keep at least 300 metres away (500 metres from 1 March to 30 June). The Governor of Svalbard (Sysselmesteren) says: do not leave the settlements without a suitable firearm and experience in using it. Follow the Governor’s advice, or go on an organised trip.</p><p><b>Black bears (North America) are different too:</b> if a black bear attacks, the advice is the opposite of that for brown bears. Do not play dead, get into a car or a building if you can, and otherwise fight back. Always follow the local advice where you are.</p>', 'bear']]},
    ski:{title:'Skis: wax and skins', short:'Grip wax, skins and glide wax', sub:'Grip on the climbs, glide on the way down, skins that stay on.', secs:[
      ['Grip wax','<ul><li><b>Wax or klister:</b> Grip wax comes as hard wax for dry snow and klister for wet snow. The colder the snow, the harder the wax. Klister is for wet, old, coarse-grained snow or icy tracks. On new snow, hard wax is usually best, even around zero.</li><li><b>Read your skis:</b> Wax that is too soft for cold snow lets the snow in: the skis clog and ice up. Scrape it off and use a harder wax. If the skis slip, use a softer wax.</li><li><b>Applying:</b> Wax indoors before the trip, in thin layers, corking each layer. Klister goes on in a herringbone pattern in the grip zone and is smoothed out. On hard or coarse snow, grip lasts longer with a base wax underneath. Let the skis cool outside before you set off, or snow will stick to the wax.</li><li><b>On the trip:</b> Bring hard wax, klister and a scraper, especially when the temperature changes during the day.</li></ul>', 'wax'],
      ['Skins','<ul><li><b>Short or long skins:</b> Short skins are common on fjellski and sit in a fitting on skis made for them. Long skins cover the whole base and are used for topptur, and sometimes on ordinary fjellski when it is steep. Care and storage are the same for both.</li><li><b>The glue side:</b> Keep the glue clean and dry: never against snow, floors, carpets or clothing. If snow gets on the glue, pull the glue side across the steel edge of the ski.</li><li><b>Skins icing up:</b> Skin wax on the plush stops clogging and icing. Keep it in your pack.</li><li><b>In the cold:</b> When the skins are off, carry them inside your jacket so the glue does not get too cold.</li><li><b>Heat:</b> Keep skins away from stoves and fires. The glue does not tolerate heat.</li><li><b>After the trip:</b> Dry the skins completely. Store them glue to glue or on the saver sheet they came with. Both work; choose whichever is more practical for you.</li></ul>', 'skins'],
      ['At home','<p>Clean the base before waxing. Glide wax is ironed in, left to cool, scraped and brushed. Scrape and brush well: glide wax residue can weaken skin glue. Use fluorine-free glide wax. Old fluoro wax is handed in as hazardous waste.</p>']]},
    pack:{title:'Packing your backpack', short:'Zones, keeping dry and adjusting', sub:'Heavy against your back, what you need on top.', secs:[
      ['How to pack','<figure class="sb-fig"><div data-svgsrc="guides/pack-zones.svg"></div></figure><ul><li><b>Heavy against your back:</b> Food, fuel, pot and water in the middle of the pack, close to your back and roughly between your shoulder blades.</li><li><b>Light and bulky at the bottom:</b> The sleeping bag and anything else you won\'t need before the evening.</li><li><b>On top and in the lid:</b> What you need on the way: an extra layer, rain gear, lunch, map, head torch and first aid kit. Snacks and sunscreen in the hip-belt or side pockets.</li><li><b>Outside:</b> As little as possible. It snags, gets wet and makes the pack sway.</li><li><b>Dry:</b> Pack in dry bags, or use a large bag as a liner, and keep the rain cover handy.</li></ul>', 'zones'],
      ['Adjusting the pack','<p>Tighten the hip belt first, so it carries most of the weight. Then the shoulder straps, and the load lifters last.</p><p>[[plan:weight]]</p>']]},
    repair:{title:'Repairs on the trip', short:'Fix it on the trip', sub:'Patching, sleeping pads and tent poles.', secs:[
      ['Patching fabric','<ul><li><b>Patching fabric:</b> Clean with an alcohol wipe and let it dry. Cut the patch with round corners and a good margin around the hole. Patch both sides when you can.</li><li><b>A tear at an edge:</b> Lay the nylon cord along the edge, fold the patch over it, and put a patch on the back too. That way it doesn\'t tear again when the fabric is under strain.</li></ul><figure class="sb-fig"><div data-svgsrc="guides/edge-repair.svg"></div></figure>', 'patch'],
      ['A leak in the sleeping pad','<p>Inflate it and listen, or spread on water with a little soap and look for bubbles. Mark the spot, dry it, and glue and patch as the repair kit describes. Let the glue dry before you inflate it again.</p>', 'pad'],
      ['A broken tent pole','<p>Slide the repair sleeve over the break and tape it at both ends with duct tape. Without a sleeve, splint it with a peg or a straight stick and tape it well.</p>', 'pole']]},
    fire:{title:'Campfire', short:'A good fire, and fire in an emergency', sub:'The basics of making a fire on a trip.', secs:[
      ['Before you light it','<ul><li><b>Fire ban:</b> in Norway, lighting fires in or near forest and other open country is banned from 15 April to 15 September, unless there is clearly no chance of a fire spreading. The municipality may have stricter rules.</li><li>Use an existing fire pit if there is one. Avoid bare rock, which cracks and gets marked, and keep away from the tent. Sparks melt the fabric.</li><li>Check the wind, and have water ready.</li></ul>'],
      ['Lighting it','<ul><li>Gather everything before you strike a match: tinder, thin twigs, thicker sticks and firewood.</li><li>Birch bark burns even when wet. Dead twigs at the bottom of spruce trees are usually dry.</li><li>Split wet wood. The inside is often dry.</li><li>Start small and add fuel gradually. A small fire is easier to keep going and gives better heat for cooking.</li></ul>'],
      ['Fire steel','<figure class="sb-fig"><div data-svgsrc="guides/firesteel.svg"></div></figure><ul><li><b>How to strike:</b> Hold the striker or a sharp knife spine still, close to the tinder, and pull the rod back towards you. That way you don\'t knock the tinder away.</li><li><b>Tinder:</b> Birch bark, firelighter pouches or anything else that catches from a spark. Have everything ready before you strike.</li></ul>', 'steel'],
      ['In an emergency','<ul><li>The fire is for warmth and drying out. Keep it small and sheltered from the wind.</li><li>Firelighter pouches and the fire steel are under Fire in the repair kit.</li><li>In a real emergency, life and health come first.</li></ul>'],
      ['Afterwards','<ul><li>Put it out with water until the ashes are cold to the touch.</li><li>Don\'t burn plastic or rubbish, and leave the place the way you found it.</li></ul>']]}
  }
};

function headingFrom(alpha, beta, gamma){
  const r = Math.PI / 180, cA = Math.cos(alpha * r), sA = Math.sin(alpha * r), cB = Math.cos(beta * r), sB = Math.sin(beta * r), cG = Math.cos(gamma * r), sG = Math.sin(gamma * r);

  return {e, n, upright};
}

  if (alpha === null || ev.beta === null || ev.gamma === null) return;
  cGot = true;
  if (cHeld) return;
  const h = headingFrom(alpha, ev.beta, ev.gamma);
  const len = Math.hypot(h.e, h.n) || 1, e = h.e / len, n = h.n / len;
  cVec = cVec ? {e: cVec.e * 0.75 + e * 0.25, n: cVec.n * 0.75 + n * 0.25} : {e, n};
  cHeading = (Math.atan2(cVec.e, cVec.n) * 180 / Math.PI + 360) % 360;

}

        stdCache = null; tab = 'list'; view = null;
      });

      updateWake(); top();
    }
  } else if (a === 'reset'){
    const target = L || stdList();
    if (await confirmBox(T.resetQ, T.resetMsg(target.name), T.resetOk)){
      withUndo(T.resetDone, () => {

function backupSheet(){
  const T = t();
  const data = bkData();
  const canShare = !!navigator.share;
  openSheet(`<h3>${T.backup}</h3>
    <div class="bk-warn"><p>${T.bkWarn}</p><p class="bk-how">${T.bkWarnHow}</p></div>

    <div class="bk-msg" id="bkStatus" role="status" hidden></div>
