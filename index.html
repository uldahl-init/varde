    <div class="bk-msg" id="bkRStatus" role="status" hidden></div>
    <div class="row"><button class="btn" data-s="cancel">${T.close}</button></div>`);
  const status = $('bkStatus');
  const say = (msg, ok) => { status.textContent = msg; status.className = 'bk-msg' + (ok ? ' ok' : ''); status.hidden = !msg; };
  const flash = (btn, label) => {
    const was = btn.dataset.label || btn.textContent; btn.dataset.label = was;
    btn.classList.add('done'); btn.innerHTML = T_MARK + esc(label);
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('done'); btn.textContent = was; }, 3000);
  };
  const done = (msg, btn, label) => { bkMarkDone(); say(msg, true); if (btn) flash(btn, label); };
  panel.querySelector('[data-s=cancel]').onclick = () => { closeSheet(null); render(); };
  if (canShare) $('bkShare').onclick = async () => {
    // Android's share sheet takes plain text files, not .json, so the shared file is a .txt (restore reads both).
    const name = bkFileName().replace(/\.json$/, '.txt');
    let file = null;
    try { file = new File([data], name, {type:'text/plain'}); } catch(e){}
    const tries = [];
    if (file && navigator.canShare && navigator.canShare({files:[file]})) tries.push({files:[file], title:name});
    tries.push({title:name, text:data});
    for (const d of tries){
      try { await navigator.share(d); done(T.bkShared, $('bkShare'), T.bkDoneShare); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    say(T.bkShareFail, false);
  };
  $('bkSave').onclick = () => {
    try {
      const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = bkFileName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      done(T.bkSaved, $('bkSave'), T.bkDoneSave);
    } catch(e){ say(T.bkManual, false); }
  };
  $('bkCopy').onclick = async () => {
    const ta = $('bkOut');
    const btn = $('bkCopy');
    try { await navigator.clipboard.writeText(ta.value); done(T.bkCopied, btn, T.bkDoneCopy); }
    catch(e){ ta.closest('details').open = true; ta.select(); try { if (document.execCommand('copy')) done(T.bkCopied, btn, T.bkDoneCopy); else throw 0; } catch(_){ say(T.bkManual, false); } }
  };
  const rstatus = $('bkRStatus');
  const sayR = (msg, ok) => { rstatus.textContent = msg; rstatus.className = 'bk-msg' + (ok ? ' ok' : ''); rstatus.hidden = !msg; };
  const restore = text => {
    const a = bkRestore(text);
    if (!a){ sayR(T.bkBad, false); return; }
    if (!(a.l || a.n || a.w || a.k || a.p)){ sayR(T.bkNothing, true); return; }
    save(); render();
    sayR(T.bkAddedAll(a), true);
    $('bkIn').value = '';
  };
  $('bkRestore').onclick = () => restore($('bkIn').value);
  $('bkFile').onclick = () => $('bkFileIn').click();
  $('bkFileIn').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => restore(String(r.result || ''));
    r.onerror = () => sayR(T.bkBad, false);
    r.readAsText(f);
    e.target.value = '';
  };
}

/* ---------- navigation history (Android back button) ---------- */
function go(newTab, newView){
  if (rainLocked) extendNav();
  tab = newTab; view = newView;
  const st = history.state || {};
  const depth = (st.depth || 0) + 1;
  if (sheetPushed && overlay.hidden){
    // a closed sheet still owns the top history entry: reuse it for the new screen
    sheetPushed = false;
    history.replaceState({tab, view, depth}, '');
  } else {
    history.pushState({tab, view, depth}, '');
  }
  render(); top();
}
function goBack(){
  if (history.state && history.state.depth > 0) history.back();
  else { view = null; history.replaceState({tab, view:null, depth:0}, ''); render(); top(); }
}
history.replaceState({tab, view, depth:0}, '');
window.addEventListener('popstate', e => {
  if (ignorePop){ ignorePop = false; return; }
  if (sortDrag){ sortCancel(); history.pushState({tab, view, depth:(history.state && history.state.depth || 0) + 1}, ''); return; }
  if (slMode){ history.pushState(Object.assign({}, history.state || {}, {light:true}), ''); return; }
  if (!sosEl.hidden){ closeSos(true); return; } // 0.11.0: back leaves Nødmodus
  if (e.state && e.state.sos && sosEl.hidden){ openSos(true); return; } // 0.11.1: back from a guide opened in Nødmodus
  if (!$('intro').hidden){ $('intro').hidden = true; state.introDone = true; save(); const f = introThen; introThen = null; if (f) f(); return; }
  if (!overlay.hidden){ sheetPushed = false; closeSheet(null); return; }
  if (rainLocked && !navOpen()){ history.pushState(Object.assign({}, history.state || {}, {lock:true}), ''); return; }
  if (rainLocked) extendNav();
  const st = e.state || {tab:'list', view:null};
  tab = st.tab || 'list'; view = st.view || null;
  render(); top();
});

/* ---------- 0.9.0: sorting in Rediger ----------
   Grip (⠿) at the left of each row: drag starts as soon as the finger moves. Long press (400 ms, still) on the row: lifts it,
   with a short vibration. Rows move within their own category. A main item moves with its sub-items and lands between
   blocks; a sub-item moves alone and never lands first in the category. Near the header or the tab bar the page scrolls.
   Letting go saves with Angre; the back button, Escape or pointercancel puts everything back. Only in Rediger. */
const GRIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';
const SORT_HOLD = 400, SORT_SLOP = 8, SORT_EDGE = 64;
let sortDrag = null, sortPending = null, sortNoClick = 0;
// units = what the dragged block can move between: whole blocks for a main item, single rows for a sub-item
function sortUnits(items, start, end){
  const rest = items.slice(0, start).concat(items.slice(end)), units = [];
  if (items[start].sub) rest.forEach(i => units.push([i]));
  else rest.forEach(i => { if (i.sub && units.length && !units[units.length - 1].mainless) units[units.length - 1].push(i); else { const u = [i]; if (i.sub) u.mainless = true; units.push(u); } });
  return units;
}
function sortBlock(items, idx){
  let e = idx + 1;
  if (!items[idx].sub) while (e < items.length && items[e].sub) e++;
  return [idx, e];
}
const sortMin = sub => sub ? 1 : 0;   // a sub-item never lands first in the category
function sortApply(cat, start, end, pos){
  const items = cat.items, block = items.slice(start, end), units = sortUnits(items, start, end);
  const out = [];
  units.forEach((u, n) => { if (n === pos) out.push(...block); out.push(...u); });
  if (pos >= units.length) out.push(...block);
  return out;
}
function sortStart(li, e){
  const catEl = li.closest('[data-cat]'), cat = catEl && findCat(catEl.dataset.cat);
  if (!cat || !editing) return;
  const idx = cat.items.findIndex(i => i.id === li.dataset.item);
  if (idx < 0) return;
  const [start, end] = sortBlock(cat.items, idx);

    const P = Lp.concat(Rp.slice().reverse());
    const lg = c.createLinearGradient(0, base, 0, base - h);
    if (inner){
      lg.addColorStop(0, `rgba(255,${Math.round(lerp(150, 250, L))},${Math.round(lerp(60, 210, L))},${a})`);
      lg.addColorStop(.6, `rgba(255,${Math.round(lerp(100, 200, L))},70,${a * .6})`);
      lg.addColorStop(1, 'rgba(255,150,40,0)');
    } else {
      lg.addColorStop(0, `rgba(255,${Math.round(lerp(120, 236, L))},${Math.round(lerp(40, 170, L))},${a})`);
      lg.addColorStop(.35, `rgba(255,${Math.round(lerp(70, 160, L))},40,${a * .75})`);
      lg.addColorStop(.75, `rgba(235,${Math.round(lerp(30, 80, L))},8,${a * .35})`);

    c.lineTo(P[P.length - 1][0], P[P.length - 1][1]); c.closePath(); c.fill();
    if (!inner) tips.push([Lp[N][0], base - h, w]);
  };
  for (let i = 0; i < n; i++){
    const rel = i / (n - 1) - .5, x = cxm + rel * fw * .75 + FL[i].jx * fw * .04;
    const h = fh * FL[i].hs * Math.max(.15, 1 - Math.abs(rel) * 1.25) * (.72 + .34 * nz(t * 1.4, i));
    const w = fw * .19 * FL[i].ws * (1 - Math.abs(rel) * .45);
    tongue(x, h, w, (nz(t * 1.9, (i + 3) % 10) * .45 + wind) * w, i, .55 + .2 * nz(t * 2.3, (i + 6) % 10), false);
  }
  for (let i = 3; i < n - 3; i++){
    const rel = i / (n - 1) - .5, w = fw * .1;
    tongue(cxm + rel * fw * .6, fh * .5 * (.8 + .3 * nz(t * 1.7, (i + 2) % 10)), w, (nz(t * 2.2, (i + 5) % 10) * .4 + wind) * w, (i + 4) % 12, .5, true);
  }
  if (tips.length && R() < dt * 2.2 * L){
    const tp = tips[R() * tips.length | 0];
    wisps.push({ x: tp[0], y: tp[1] + tp[2] * .2, w: tp[2] * .3, age: 0, life: .35 + R() * .35, vy: -(.18 + .12 * R()) * H });
  }
  for (let i = wisps.length - 1; i >= 0; i--){
    const q = wisps[i]; q.age += dt;
    if (q.age > q.life){ wisps.splice(i, 1); continue; }
    q.y += q.vy * dt; q.x += wind * 30 * dt;
    const k = 1 - q.age / q.life, rw = Math.max(.5, q.w * .5 * k), rh = Math.max(.5, q.w * 1.3 * k);
    const gq = c.createRadialGradient(q.x, q.y, 0, q.x, q.y, rh);
    gq.addColorStop(0, `rgba(255,${Math.round(lerp(120, 200, L))},70,${.55 * k})`); gq.addColorStop(1, 'rgba(230,70,0,0)');
    c.fillStyle = gq; c.beginPath(); c.ellipse(q.x, q.y, rw, rh, 0, 0, 6.283); c.fill();
  }

  // sparks rising
  if (R() < dt * 4.5 * L * L && sparks.length < 40){
    sparks.push({ x: cxm + (R() - .5) * fw * .4, y: base - fh * .35 * R(), vy: -(.1 + .17 * R()) * H, ph: R() * 6.3, sw: (R() - .5) * 30, age: 0, life: 1.6 + R() * 2, r: .9 + R() * 1.5 });
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i]; s.age += dt;
    if (s.age > s.life){ sparks.splice(i, 1); continue; }
    s.y += s.vy * dt; s.vy *= (1 - dt * .25);
    const x = s.x + Math.sin(s.age * 2.2 + s.ph) * s.sw + wind * 40 * s.age;
    const al = (1 - s.age / s.life) * (.65 + .35 * Math.sin(s.age * 9 + s.ph));
    c.fillStyle = `rgba(255,${Math.round(170 + 50 * (1 - s.age / s.life))},90,${al})`;
    c.beginPath(); c.arc(x, s.y, s.r, 0, 6.283); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
}

    state.sosOpen = false; save(); sosEl.hidden = true; document.body.classList.remove('sosopen');
    sosBack = true; guideSec = g.dataset.ss || null;
    go('guide', 'tool:' + g.dataset.sg);
    return;
  }
  const a = e.target.closest('[data-sa]');
  if (!a) return;
  const k = a.dataset.sa;
  if (k === 'exit') closeSos();
  else if (k === 'hue'){ state.sosHue = a.dataset.h || null; save(); renderSos(); } // 0.11.2: Vanlig, Rødt or Grønt, any time
  else if (k === 'pos') sosGetPos();
  else if (k === 'white') openLight('white');
  else if (k === 'six') openLight('six');
  else if (k === 'sosl') openLight('sos');
});
/* hold a Nødmodus button 1 s (delegated, the buttons are redrawn with the page; works in Regnlås) */
(function(){
  let btn = null, timer = null, held = false, sx = 0, sy = 0;
  const pt = e => e.touches ? e.touches[0] : e;
  const cancel = () => { clearTimeout(timer); if (btn) btn.classList.remove('holding'); btn = null; };
  const start = (b, e) => {
    if (e.cancelable) e.preventDefault();
    cancel(); btn = b; held = false;
    const p = pt(e); sx = p.clientX; sy = p.clientY;
    b.classList.add('holding');
    timer = setTimeout(() => { held = true; cancel(); openSos(); }, 1000);
  };
  const move = e => { if (!btn) return; const p = pt(e); if (Math.hypot(p.clientX - sx, p.clientY - sy) > 12) cancel(); };
  const end = () => { if (held){ held = false; return; } if (!btn) return; cancel(); showToast(t().sos.holdMsg); };
  main.addEventListener('touchstart', e => { const b = e.target.closest('[data-sos-hold]'); if (b) start(b, e); }, {passive:false});
  main.addEventListener('touchmove', move, {passive:true});
  main.addEventListener('touchend', end);
  main.addEventListener('touchcancel', cancel);
  main.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; const b = e.target.closest('[data-sos-hold]'); if (b) start(b, e); });
  main.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') move(e); });
  main.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') end(); });
  main.addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') cancel(); });
  main.addEventListener('contextmenu', e => { if (e.target.closest('[data-sos-hold]')) e.preventDefault(); });
  main.addEventListener('keydown', e => { const b = e.target.closest && e.target.closest('[data-sos-hold]'); if (b && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openSos(); } });
})();
let wakeLock = null;
async function updateWake(){
  try {
    if ((state.field || slMode) && document.visibilityState === 'visible'){
      if (!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', updateWake);

render();
updateWake();
if (!state.introDone) showIntro(0, checkShared); else checkShared();
if (state.sosOpen) openSos(); // 0.11.0: closed while in Nødmodus → opens in Nødmodus again, no time limit
// v32: ask the browser to keep the data when space runs low (installed app only; nothing is sent anywhere)
try {
  if (navigator.storage && navigator.storage.persist && (matchMedia('(display-mode: standalone)').matches || navigator.standalone))
    navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {});
} catch(e){}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  // a new version takes over: reload once so it is in use straight away
  // 0.5.1: wait while a sheet, the introduction, the full-screen light or a text field is in use, then reload on the page you were on
  // 0.11.4: an open Nødmodus counts as busy too, so an update never reloads the page in an emergency
  const busy = () => !!sortDrag || !overlay.hidden || !$('intro').hidden || !!slMode || !sosEl.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  const reloadWhenSafe = () => { if (document.visibilityState === 'visible' && busy()){ setTimeout(reloadWhenSafe, 1500); return; } location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; reloadWhenSafe(); });
  let swReg = null, lastCheck = 0;
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { swReg = r; lastCheck = Date.now(); return r.update(); }).catch(() => {}); });
  // 0.5.1: Android often keeps the app in memory, so also look for a new version when it comes back to the front with a connection
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !swReg || navigator.onLine === false || Date.now() - lastCheck < 30000) return;
    lastCheck = Date.now(); swReg.update().catch(() => {});
  });
}
})();
