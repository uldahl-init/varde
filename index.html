<style>
/* Barlow and Barlow Condensed (SIL Open Font License 1.1, fonts/OFL.txt), bundled so headings look right offline */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format('woff2')}
:root{
  --bg:#E7EBE8; --surface:#F6F8F6; --ink:#1D2B2A; --muted:#5E6B69;
  --line:#D2D9D5; --line-strong:#A9B5B0; --red:#C42127; --lichen:#6F875A;
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#142120; --surface:#1C2B2A; --ink:#E3EAE6; --muted:#93A29F;
    --line:#2C3D3B; --line-strong:#4A5E5B; --red:#E5484D; --lichen:#9DB58A;
  }
}
:root[data-theme="dark"]{
  --bg:#142120; --surface:#1C2B2A; --ink:#E3EAE6; --muted:#93A29F;
  --line:#2C3D3B; --line-strong:#4A5E5B; --red:#E5484D; --lichen:#9DB58A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--lichen);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd,var(--bg));color:var(--hdt,var(--ink));padding:12px 0 14px}
.title-row{display:flex;align-items:center;gap:4px}
.list-switch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
.list-switch h1{margin:0;font-family:var(--head);font-weight:600;font-size:1.9rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-switch svg{flex:none;width:20px;height:20px;stroke:var(--muted)}
.list-switch svg{stroke:currentColor !important;opacity:.7}
.progress{display:flex;align-items:center;gap:12px;margin-top:6px}
.bar{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--red);transition:width .25s ease}
.prog-text{font-size:.9rem;color:inherit;opacity:.8;white-space:nowrap;font-variant-numeric:tabular-nums}

main.wrap{padding:4px 16px calc(110px + env(safe-area-inset-bottom,0px))}
body.field main.wrap{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
.cat{margin-top:20px}
.cat-head{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 2px;cursor:pointer;text-align:left}
.cat-head h2{flex:1;margin:0;font-family:var(--head);font-weight:600;font-size:1.35rem;line-height:1.2}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.complete .count{color:var(--red);font-weight:600}
.chev{width:18px;height:18px;stroke:var(--muted);transition:transform .2s ease}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed .items,.cat.closed .cat-tools{display:none}
.cat-tools{display:flex;gap:8px;margin:2px 0 8px}

.items{list-style:none;margin:4px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;border-top:1px solid var(--line)}
.items > li:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.mark{flex:none;width:26px;height:26px;border:2px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;background:var(--bg)}
.mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .15s ease,transform .22s cubic-bezier(.3,1.6,.5,1)}
.item.done .mark{border-color:var(--red);background:var(--red)}
.item.done .mark svg{opacity:1;transform:scale(1)}
.txt{overflow-wrap:anywhere}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.icon{flex:none;width:44px;height:44px;margin-right:2px;background:none;border:0;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.icon.del{color:var(--red)}
.note-row{padding:12px 14px;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}
.item.sub .check{padding-left:50px;min-height:44px;font-size:.95rem}
.item.sub .mark{width:22px;height:22px}
.item.sub .mark svg{width:15px;height:15px}
.cat-note{margin:0 2px 6px;color:var(--lichen);font-size:.9rem}
textarea.plain{font-family:var(--body);font-size:1rem;min-height:260px}
.modes{margin-top:16px}
.modes-label{display:block;font-size:.9rem;color:var(--muted);font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lk{opacity:.55}
.link-btn{flex:none;display:flex;align-items:center;gap:2px;margin-right:8px;padding:6px 8px 6px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.link-btn.complete{border-color:var(--red);color:var(--red)}
.link-btn svg,.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.back{display:inline-flex;align-items:center;gap:4px;margin-top:14px;background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:6px 0}
.tool-sub{color:var(--muted);margin:6px 0 0}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;align-items:end}
.cfield{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);font-weight:600}
.cfield input{font-size:1.15rem;font-variant-numeric:tabular-nums}
.calc-result{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.calc-result:empty{display:none}
.calc-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc-pair .big{display:block;font-family:var(--head);font-weight:600;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.calc-pair > div:first-child .big{color:var(--red)}
.calc-pair .lbl{color:var(--muted);font-size:.9rem}
.calc-boils{margin:12px 0 0;font-weight:600}
.calc-err{margin:0;color:var(--red);font-weight:600}
.tool-tip{color:var(--muted);font-size:.9rem;margin-top:14px}

.calc.one{grid-template-columns:1fr}
.chips.tight{margin-top:4px}
.calc-basis{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.calc-warn{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--red);background:var(--bg);font-size:.95rem}
.reset-link{background:none;border:0;padding:0;color:var(--lichen);font-weight:600;font-size:.85rem;cursor:pointer;text-align:left}
.manual{margin-top:26px}
.manual h2{margin:0 0 8px;font-family:var(--head);font-weight:600;font-size:1.35rem}
.manual details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.manual summary{padding:12px 14px;font-weight:600;cursor:pointer}
.manual details p{margin:0;padding:0 14px 14px;line-height:1.55}
.food-out{list-style:none;margin:0;padding:0}
.food-out li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.food-out li:first-child{border-top:0}
.food-out .q{font-family:var(--head);font-weight:600;font-size:1.35rem;color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums}
.kcal-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:16px}
.kcal-head .q{font-family:var(--head);font-weight:600;font-size:1.35rem;font-variant-numeric:tabular-nums}
.energy details{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.energy summary{padding:12px 14px;font-weight:600;cursor:pointer}
.energy .calc{padding:0 14px 14px;margin-top:0}
.knot{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.knot summary{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.knot summary b{font-family:var(--head);font-weight:600;font-size:1.3rem}
.knot summary span{color:var(--muted);font-size:.95rem}
.knot ol{margin:0;padding:0 16px 4px 36px;line-height:1.55}
.knot ol li{margin-bottom:6px}
.knot .check-tip{margin:0;padding:8px 14px 14px;font-size:.95rem}
.guide p{margin:0 0 10px;padding:0 14px;line-height:1.55}
.guide ul{margin:0 0 12px;padding:0 16px 0 34px;line-height:1.55}
.guide li{margin-bottom:6px}
.key-rule{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--red);font-weight:600;line-height:1.5}
.lchart{margin:0 14px 12px;font-size:.8rem}
.lc-head,.lc-row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px}
.lc-cols{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;color:var(--muted);font-weight:600;line-height:1.2}
.lc-row{padding:6px 0;border-top:1px solid var(--line)}
.lc-lab{font-weight:600;line-height:1.2}
.lc-lab small{display:block;color:var(--muted);font-weight:400}
.lc-track{position:relative;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--bg) 0 20%,transparent 20% 40%)}
.lc-track i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--ink)}
body.notlist .progress{display:none}
body.notlist .list-switch svg{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--red)}
.toolbar{display:flex;gap:8px;margin:14px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .chip{flex:none}
.toolbar .chip{padding:9px 14px}
.chip.field-on{background:var(--red);border-color:var(--red);color:#fff}
.chip:disabled{opacity:.4;cursor:default}
.modes-toggle{width:100%;display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;text-align:left;cursor:pointer}
.modes-toggle .mt-val{flex:1;min-width:0;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes-toggle .chev{flex:none}
.modes-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.modes-open{margin-top:10px}
.subhead{padding:14px 14px 4px;font-weight:600;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.items > li.subhead:first-child{border-top:0}
.index{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.index button{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer}
.index .ix-t{display:block;font-family:var(--head);font-weight:600;font-size:1.35rem;line-height:1.2}
.index .ix-d{display:block;color:var(--muted);font-size:.95rem}
.index .ix-txt{flex:1}
.note-full{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note-full h2{margin:0;font-family:var(--head);font-weight:600;font-size:1.35rem}
.note-date{margin:2px 0 10px;color:var(--muted);font-size:.85rem}
.note-body{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.notes-ix .note-prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.notes-ix .note-date{margin:4px 0 0;font-size:.8rem}
.notes-ix .ix-t{font-size:1.15rem}
.note-area{min-height:40vh}
#noteTitle,#noteText{display:block}
#noteTitle{margin-bottom:12px;font-weight:600}
.w-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.w-list li{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-top:1px solid var(--line)}
.w-list li:first-child{border-top:0}
.w-name{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.w-tag{padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);font-size:.75rem;font-weight:600}
.w-tag.dog{border-color:var(--red);color:var(--red)}
.w-in{flex:none;display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:600}
.w-in input{width:5.5em !important;min-width:0;padding:8px 10px;text-align:right;font-size:1.05rem;font-variant-numeric:tabular-nums}
.w-pick{max-height:55vh;overflow:auto}
.w-pi{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.w-pi input{width:22px;height:22px;flex:none}
.w-pi input:disabled + span{color:var(--muted)}
#panel select{width:100%;font-size:1.05rem;padding:10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink)}
.m-kcal{color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.ix-group{display:flex;align-items:center;gap:8px;margin:22px 0 -6px;font-family:var(--head);font-weight:600;font-size:.95rem;letter-spacing:.02em}
.ix-group i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.ix-group{color:var(--gc)}
.index button.g-gear,.index button.g-field,.index button.g-safety{border-left:5px solid var(--gc)}
.g-gear{--gc:var(--lichen)}.g-field{--gc:var(--red)}.g-safety{--gc:var(--gsafe)}
body{--gsafe:#3F7FA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--gsafe:#7FB2D4}}
:root[data-theme="dark"] body{--gsafe:#7FB2D4}
.index svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round}
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;max-width:608px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
.toast[hidden]{display:none}
.toast span{flex:1}
.toast button{border:0;border-radius:8px;padding:10px 14px;background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer}
.rainlock{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 16px 12px;background:var(--surface);border-top:2px solid var(--red);pointer-events:auto}
.lock-btns{display:flex;gap:10px;max-width:520px;width:100%;margin:0 auto}
.lock-btns .unlock{flex:1;padding:14px 10px}
.unlock small{display:block;font-weight:400;font-size:.8rem;opacity:.8}
.nav-time{height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:520px;width:100%;margin:0 auto}
.nav-time i{display:block;height:100%;background:var(--red);width:0}
header .list-switch{gap:10px;color:inherit;border-radius:14px}
header .list-switch:not(.plain){background:rgba(255,255,255,.13);padding:8px 12px;min-height:54px}
header .list-switch .ls-ic{flex:none;display:grid}
header .list-switch .ls-ic svg,header .list-switch .ls-chev{width:22px;height:22px;stroke:currentColor !important;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
header .list-switch .ls-chev{width:18px;height:18px;stroke-width:2.6}
header .list-switch .ls-text{flex:1;min-width:0}
header .list-switch h1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:1.6rem;line-height:1.1}
header .list-switch .ls-lbl{flex:none;font-size:.8rem;font-weight:600;opacity:.85;white-space:nowrap}
header .list-switch.long .ls-lbl{display:none}
header .list-switch.plain{background:none;padding:4px 0;pointer-events:none}
header .list-switch.plain .ls-ic,header .list-switch.plain .ls-lbl,header .list-switch.plain .ls-chev{display:none}
header .list-switch.plain h1{font-size:1.9rem}
.hdr-rain{display:none;flex:none;align-items:center;gap:6px;margin-left:10px;padding:8px 12px;min-height:44px;border-radius:999px;border:1px solid currentColor;background:none;color:inherit;font-weight:600;font-size:.85rem;cursor:pointer;opacity:.95}
body.field .hdr-rain{display:flex}

    cInfo:[['How to use it','<p>Hold the phone <b>flat</b> like a normal compass, or <b>upright</b> in front of you and point it at a peak on the horizon. Tap <b>Hold reading</b> to freeze the direction and read it calmly.</p>'],
      ['Sun and moon on the compass','<p>The two round buttons under Hold reading switch these on and off. <b>Sun and moon now</b> (sun and moon symbol) shows where the sun and the moon are right now. Faded means below the horizon. <b>Sunrise and sunset</b> (half sun with arrows, the same symbol as in the Sun details below) marks the directions where the sun rises (arrow up) and sets (arrow down) on the chosen date, with a short line at the edge for the exact direction. Both need your position, and both are on from the start.</p>'],
      ['Accuracy','<p>A phone compass is typically accurate to within 5–10 degrees: good for telling which peak is which, <b>not for navigation</b>. Use map and compass for that. It shows magnetic north. Metal, magnets in phone cases and electronics nearby disturb it. If it seems off, move the phone in a figure-of-eight a few times to recalibrate.</p>']],

    phoneSub:'Make the phone work for you in bad weather, without depending on it for safety.',
    phone:[
      ['Rain','<p>Water on the screen can register as touches. Wipe the screen with a dry cloth or sleeve before use, it makes the biggest difference. A hydrophobic or matte screen protector makes water bead and run off, and a waterproof pouch keeps the screen itself dry. If your phone has a glove mode or increased touch sensitivity, turn it <b>off</b> in rain, as it makes the screen more sensitive to water too.</p><p>In this app: switch on <b>Outdoor mode</b> and use <b>Rain lock</b> to read your list without anything reacting.</p>'],
      ['Cold and battery','<p>Cold drains the battery fast, and the phone can shut down even with charge left. Keep it in an inner pocket close to your body, and keep the power bank warm too. Low power mode, lower brightness and flight mode when you do not need coverage all save battery. Dark screens use less power on most phones, so <b>Night light</b> helps as well.</p>'],
      ['Gloves and cold fingers','<p>Thin touchscreen gloves work on most phones. Many Android phones have a glove mode in the display settings that makes the screen more sensitive. In this app, <b>Outdoor mode</b> gives larger text and buttons.</p>'],
      ['Before you go','<p>Download offline maps and charge everything. This app works without coverage once it is installed. But never depend on the phone for safety: bring map and compass, and a satellite messenger or emergency beacon for areas without coverage.</p>'],
      ['Outdoor mode in this app','<p><b>Outdoor mode</b> gives larger text and buttons, keeps the screen on, and locks editing so nothing can be deleted by accident. Only clear, single taps count, so water drops are less likely to tick anything.</p><p><b>Rain lock</b> stops all changes, but you can still scroll and read. Hold <b>Navigate</b> to change page, open sections or read your notes. Navigation stays open for a few seconds, and each tap extends it, while ticks and changes stay locked the whole time. Hold <b>Unlock</b> to turn Rain lock off.</p><p><b>Night light</b> turns the app red so you keep your night vision, and <b>Undo</b> takes back the last tick.</p>']
    ],
    sunCond:['Snow / fog','Overcast','Partly sunny','Sun','Bright sun / glacier'], sunCat:'Cat.', sunVlt:'VLT is how much visible light the lens lets through. Many manufacturers publish an overview like this for their lenses: use it to choose lenses for the light conditions.',
    sunTool:'Sunglasses', sunShort:'Choose the right glasses', sunSub:'Wrong glasses can cost you your sight for days, or make it hard to read the terrain. Choose for protection, not for looks.',
    sunKey:'Always choose glasses marked UV400 or 100 % UV protection. How dark the lens is (filter category) says nothing about UV protection: dark lenses without a UV filter are worse than no glasses, because the pupil opens and lets in more UV.',
    sun:[
      ['Snow blindness','<p>Snow blindness is a sunburn of the cornea. Fresh snow reflects up to 80 % of UV radiation, and UV increases with altitude, so it can happen on overcast days too. Symptoms often come hours later: strong pain, a gritty feeling, watering eyes and sensitivity to light.</p>'],
      ['Filter categories','<ul><li><b>0:</b> clear or faintly tinted. Evening and dark.</li><li><b>1:</b> lightly tinted. Overcast, flat light.</li><li><b>2:</b> medium. Normal daylight, forest and lowland.</li><li><b>3:</b> dark. Strong sun, mountains, sea and snow. The most used for hiking.</li><li><b>4:</b> extra dark. Glaciers, high mountains and extreme sun on snow. Not for driving.</li></ul>'],
      ['Lens colour','<p>Brown, amber, copper and rose increase contrast, making it easier to read the terrain and the snow surface in flat light. Grey gives the most natural colours in strong sun. Yellow and orange in a low category help in fog and dusk. Mirror coating reduces glare in bright light.</p>'],
      ['Polarised and photochromic','<p><b>Polarised</b> lenses remove glare from water and wet surfaces, excellent for fishing, paddling and coastal trips. On snow and ice, they can hide icy patches and make the surface harder to read, and GPS and phone screens can be hard to see.</p><p><b>Photochromic</b> lenses adapt to the light, for example category 1–3. Useful when the light changes a lot, as on ski tours. They can change more slowly in the cold.</p>'],
      ['Choose by trip','<ul><li><b>Light summer hike</b> in forest and lowland: category 2–3, light sunglasses are fine.</li><li><b>Summer mountain hike:</b> category 3, preferably with good side coverage.</li><li><b>Winter hike and skiing:</b> category 3 in sun, category 1–2 in a contrast colour (amber, rose) in flat light. Goggles in wind and drifting snow.</li><li><b>Ski touring / randonee:</b> photochromic 1–3, or two pairs, since the light changes from forest to open mountainside. Goggles for the descent.</li><li><b>Glacier and high altitude:</b> category 4 with side protection (glacier glasses), and always a spare pair.</li><li><b>Water and fishing:</b> polarised category 3.</li></ul>'],
      ['Goggles','<ul><li>A <b>light lens</b> (yellow, orange or rose) suits the flat light of a Scandinavian winter; a darker lens suits spring sun.</li><li>If they <b>fog up</b>, do not wipe the inside: wave them in the air or put them in a dry, warm pocket.</li><li>If you wear glasses, look for goggles marked <b>OTG</b> (over the glasses).</li><li>Thick, soft foam gives a comfortable fit, and avoid the widest models if you wear a helmet.</li></ul>'],
      ['If it happens','<p><b>Snow blindness:</b> find darkness or cover the eyes, do not rub them, remove contact lenses, and cool compresses ease the pain. It usually passes in 1–3 days. Get medical help for strong pain or if it does not improve.</p><p><b>Lost your glasses?</b> Make emergency glasses: cut narrow slits in cardboard, tape or a piece of fabric, and fasten it in front of the eyes. It lets in far less light. On winter and glacier trips, always bring a spare pair.</p>']
    ],
    sbTool:'Stove board', sbShort:'Make your own', guideLink:'Guide',
    sbSub:'A steady base keeps the stove upright on snow and uneven ground, and stops it tipping over in the vestibule. Most people make their own.',
    sbFig1:['The board: floor laminate or plywood','Aluminium heat shield under the stove','Stove fixed with wing screws','Strap around the middle of the bottle, through two slots','Fuel hose with slack, so the bottle can turn half a turn','Tape mark showing ON and OFF','Foam under the board (seen from the side), so it does not melt down into the snow'],
    sbFig2Title:'How the strap holds the bottle (seen from the end of the bottle)',
    sbFig2:[['A','Two slots in the board, as wide as the strap, one on each side of the bottle.'],['B','The strap goes over the bottle and holds it by friction.'],['C','The buckle sits on the side: loosen a notch, turn the bottle, and tighten again.'],['D','Under the board, the strap runs from slot to slot. Fit it before gluing on the foam, or cut a groove in the foam.']],
    sb:[
      ['Materials','<p><b>Floor laminate</b> or thin <b>plywood</b> (3–5 mm, varnished) is stiff and tolerates spilt fuel. A thin <b>aluminium tray</b> is light and will not burn, but leads heat straight into the snow, so foam underneath matters even more. Avoid <b>plastic</b>: it can soften, melt or catch fire when you prime the stove. The board only needs to be big enough for the stove to stand firmly, with the bottle beside it.</p>'],
      ['The heat shield','<p>An aluminium plate or aluminium tape under the stove protects the board from radiant heat and flare-ups when priming. Laminate tolerates short flare-ups, but its surface can scorch and give off unpleasant fumes under direct flame over time. Check the board now and then for scorch marks.</p>'],
      ['The stove','<p><b>Wing screws</b> through the board hold the stove steady and are easy to undo with mittens on. <b>Cable ties or wire</b> give a simpler set-up that is always ready.</p>'],
      ['The bottle','<p>The bottle must lie steady, but still turn around its own length: on most liquid fuel stoves you turn it to switch off and empty the fuel line. A <b>strap through two slots</b> is the recommended solution. Alternatives: a snug loop that turns with a firm twist, or a small cradle that stops the bottle rolling. Put the strap around the middle of the bottle, never by the neck, leave slack in the hose, and mark ON and OFF with tape. Some prefer the bottle loose beside the board; that works as long as it lies steady and does not pull on the hose.</p>'],
      ['Safety','<p>Prime the stove outdoors or with the tent door open, and never use it in a closed tent: there is a risk of fire and carbon monoxide poisoning. Keep the bottle and spare fuel away from the flame.</p>']
    ],
    winterTool:'Winter advice', winterShort:'Cold, clothing and winter camp', winterSub:'Short advice for cold weather, based on the Norwegian Armed Forces and the Directorate of Health, among others.',
    winterAdv:[
      ['Dress in layers','<ul><li><b>Three layers:</b> wool closest to the skin, a looser mid layer, and a roomy wind- and water-repellent shell. Air between the layers insulates.</li><li><b>Mittens</b> keep warmer than gloves.</li><li>A <b>windproof hat that covers the ears</b>, and a neck gaiter or scarf: head, neck and face lose a lot of heat.</li><li><b>Boots one or two sizes bigger</b>, with room for thick wool socks and a good insole.</li></ul>'],
      ['Avoid sweat and damp','<p>Damp is one of the biggest enemies in the cold. Take off a layer before you start sweating, vent your clothes, and change into something dry when you stop. Keep a dry set that is only used in the tent.</p>'],
      ['Skin, metal and nicotine','<ul><li>Avoid <b>moisturiser and liquid make-up</b>: they contain water and increase the risk of frostbite. Use a water-free cold cream instead.</li><li>Avoid shaving and heavy face washing before going out: the skin\'s natural oils protect it.</li><li>Do not touch <b>bare metal</b> with your fingers in hard frost; at –10 °C it can damage skin quickly. Be aware of rings, earrings and watches.</li><li><b>Nicotine</b> narrows the blood vessels in fingers and toes and increases the risk of cold injuries.</li></ul>'],
      ['Food and drink','<p>The body needs about <b>30 % more energy</b> in the cold, so eat often. Too little fluid makes it harder for the body to keep warm and increases the risk of cold injuries. Carry the water bottle inside your jacket so it does not freeze, and bring a thermos with a hot drink.</p>'],
      ['Warning signs of cold injury','<ul><li>Fingers that get clumsy</li><li>Pain in hands or feet</li><li>Red skin, swelling, stinging, tingling or numbness</li><li>White patches or blisters, first on the nose, cheeks, ears and fingers</li></ul><p>Warm up early, check each other\'s faces, and seek medical help for blisters or skin that stays white and hard.</p>'],
      ['The tent on a winter evening','<p>Pack what goes into the tent in its own stuff sacks, so you get in quickly. Take in: the <b>dry tent clothes</b> (thick wool socks and underwear, balaclava, down booties and mittens), the food you need for the evening, thermos and bottle, stove, pot and fuel, toiletries, head torch and tent lamp, <b>batteries in the sleeping bag</b>, a snow brush, and a large bag of clean snow for melting. Keep the camera in a zip bag against condensation, and the first aid and repair kits close by. The rest can stay in the pulk.</p>'],
      ['A hot water bottle in the sleeping bag','<p>Fill a tight bottle with about 1 litre of freshly boiled water and wrap it in a thick wool sock. It still gives warmth in the morning, and the water is ready to drink. Check the lid carefully.</p>'],
      ['Children, older people and hard exercise','<p>Children and older people lose heat faster and need extra attention. Avoid hard intervals when it is colder than about –15 °C, and change into dry clothes as soon as the trip is over.</p>']
    ],
    knotTool:'Knots', knotShort:'Seven essential knots', knotSub:'Short reminders for when you need a knot quickly. Practise them at home: a knot you have only read about is hard to tie in wind and cold.',
    knotWarn:'For gear, tarp and tent. Not for climbing or belaying.', credits:'Image credits', noAuthor:'author not stated', illFrom:'illustration from', photoFrom:'photo from', adaptedPlain:'adapted (cropped, colours)', adaptedScaled:'adapted (scaled)', adaptedColours:'adapted (colours)', adaptedCrop:'adapted (cropped, scaled)', adaptedPrusik:'adapted (cropped, background lightened, enlarged)', adaptedBg:'adapted (cropped, background made white)', illBy:'illustration by', photoBy:'photo by', adapted:'adapted (cropped, labels removed, colours)', adaptedPhoto:'adapted (cropped, shadow softened)',
    knots:[
      {n:'Bowline', u:'A fixed loop that does not slip, and is easy to untie after load. Around a tree, a person, or a pack.', s:['Make a small loop in the standing part, with the working end side on top.','Bring the end up through the small loop from below.','Pass it around behind the standing part.','Bring it back down through the small loop.','Hold the end and the big loop together, and pull the standing part tight.'], c:'Remember: the rabbit comes out of the hole, around the tree, and back down the hole. Leave the end at least 10 cm long.'},
      {n:'Taut-line hitch', u:'An adjustable loop for guy lines on tents and tarps. Slide the knot to tighten or loosen.', s:['Pass the end around the peg or anchor.','Make two turns around the standing part, working back towards the peg, inside the loop.','Make one more turn around the standing part, on the far side of the first two (furthest from the peg), and tuck the end under itself in this turn, so it forms a separate half hitch.','Pull it tight.','Slide the knot up the line to tighten, and down to loosen.'], c:'In Norwegian it is called teltstikk. Often confused with the similar Magnus hitch (Magnus-stikk). Check: the last turn should sit on its own, separate from the first two, with the end leaving from there. If the end goes back down between the turns, you have tied the Magnus variant. The taut-line hitch is the best choice for guy lines. If it slips in thin or slippery cord, add one more inside turn.'},
      {n:'Clove hitch', u:'A quick hitch around a pole, branch or tree. Good for starting a lashing or fastening a line.', s:['Lay the rope around the pole.','Cross it over itself and go around the pole once more.','Tuck the end under the last turn, so the two ends leave in opposite directions between the turns.','Pull both ends tight.'], c:'It can work loose when the load shifts: secure it with a half hitch around the standing part.'},
      {n:'Sheet bend', u:'Joins two ropes, also of different thickness. Good for lengthening a line.', s:['Make a U-shaped bight in the thicker rope.','Bring the end of the thinner rope up through the bight from below.','Pass it around behind both legs of the bight.','Tuck it under itself, but over the bight, not through it.','Pull tight on all four parts.'], c:'Both short ends should be on the same side. For slippery rope, take one more turn around the bight (double sheet bend).'},
      {n:'Prusik', u:'A friction hitch that grips when loaded and slides when slack. For fastening a tarp to a ridgeline, tensioning, or hanging gear on a line.', s:['Use a closed loop of cord that is clearly thinner than the main rope.','Lay the loop behind the main rope.','Pass one end of the loop around the main rope and through itself, inside the loop.','Make one more wrap, inside the first, so you have two wraps (four turns around the rope), as in the picture. The standard is three wraps (six turns), which gives more grip.','Straighten the wraps so they lie neatly side by side, and pull tight.'], c:'It grips when loaded and slides when you push it while slack. More wraps give more grip, especially on slippery rope.'},
      {n:'Timber hitch', u:'Fastens a rope around a tree, pole or log. Holds well under load and is easy to untie. Good at the tree end of a tarp ridgeline, or for dragging wood.', s:['Pass the rope around the tree.','Take the end around the standing part, and then back around itself.','Twist the end around itself at least three times.','Pull the standing part so the hitch tightens against the tree.'], c:'The end should be twisted around itself, not around the standing part. It only holds under load, and can loosen when the rope is slack.'},
      {n:'Figure-eight knot and loop', u:'A stopper knot at the end of a rope, and, tied with the rope doubled, a strong fixed loop for a carabiner, peg or pole.', s:['<b>Single:</b> make a loop near the end.','Take the end behind the standing part and down through the loop, and pull tight.','<b>Loop:</b> double the rope for about 30 cm, and tie the same knot with the doubled rope.','Straighten it so the strands lie parallel, and leave the tail at least a hand\'s width long.'], c:'The single knot looks like an 8 and is easy to untie, even after load. On the loop, check for two parallel strands all the way, with no crossings. Climbers tie a threaded version through the harness; learn that on a course.'}
    ],

    pack:[
      ['Day rations','Pack each day\'s breakfast, lunch and snacks together in one bag, and mark it with the day number. You take one bag per day, it is easy to see that you have enough, and nothing gets eaten too early.'],
      ['Oats dry and tight','Measure out each breakfast at home in its own zip or freezer bag, with sugar and extras added. Squeeze out the air and close it well. Put all the bags inside a larger bag or a dry bag, so a hole in one bag does not spread oats through the backpack.'],
      ['Keep food away from fuel','Fuel and food never go in the same bag. Carry the fuel bottle upright, check the cap and seal before you pack, and keep it below or away from the food, so a leak cannot drip onto it. Fuel spilled on food ruins it, and it is not safe to eat.'],
      ['One food bag','Keep all food together in one dry bag. It stays dry, is easy to find, and is easy to keep closed at camp, where mice and birds may be interested.'],
      ['Less packaging','Remove outer cardboard and extra packaging at home to save weight and rubbish, but keep the cooking instructions for trail meals. Bring a bag for rubbish and carry it home.']
    ],

    manGas:['Gas','The simplest and cleanest: screw on and light. Best for summer and shorter trips. Ordinary canisters work poorly below freezing, so in winter use a winter mix and keep the canister warm. Empty canisters must be carried home.'],
    manPetrol:['Petrol / multifuel','The most reliable choice in cold weather and high mountains, and fuel is available almost everywhere. Needs priming and some maintenance, and can soot. The first choice for winter trips and melting snow.'],
    manSpirit:['Methylated spirit','A simple, reliable burner with no moving parts: quiet and cheap. Gives less heat per litre than gas and petrol, so you need more, and it is slow in the cold. The flame is almost invisible in daylight.'],

    cInfo:[['Slik bruker du det','<p>Hold mobilen <b>flatt</b> som et vanlig kompass, eller <b>oppreist</b> foran deg og pek mot en topp i horisonten. Trykk <b>Hold retningen</b> for å fryse retningen og lese den i ro.</p>'],
      ['Sol og måne på kompasset','<p>De to runde knappene under Hold retningen slår dette av og på. <b>Sol og måne nå</b> (symbol med sol og måne) viser hvor solen og månen står akkurat nå. Blek betyr under horisonten. <b>Soloppgang og solnedgang</b> (halv sol med piler, samme symbol som under Sol lenger ned) markerer retningen der solen står opp (pil opp) og går ned (pil ned) på valgt dato, med en kort strek ytterst for nøyaktig retning. Begge trenger posisjonen din, og begge er på fra start.</p>'],
      ['Nøyaktighet','<p>Et mobilkompass er typisk nøyaktig innenfor 5–10 grader: godt nok til å se hvilken topp som er hvilken, <b>ikke til navigasjon</b>. Bruk kart og kompass til det. Det viser magnetisk nord. Metall, magneter i mobiletuier og elektronikk i nærheten forstyrrer det. Virker det feil, beveg mobilen i et åttetall noen ganger for å kalibrere.</p>']],

    phoneSub:'Få mobilen til å fungere i dårlig vær, uten å være avhengig av den for sikkerheten.',
    phone:[
      ['Regn','<p>Vann på skjermen kan registreres som berøring. Tørk skjermen med en tørr klut eller ermet før bruk, det utgjør den største forskjellen. En vannavstøtende eller matt skjermbeskytter får vannet til å perle seg og renne av, og et vanntett etui holder selve skjermen tørr. Har mobilen hanskemodus eller økt berøringsfølsomhet, slå det <b>av</b> i regn, for det gjør skjermen mer følsom for vann også.</p><p>I appen: slå på <b>Utemodus</b> og bruk <b>Regnlås</b> for å lese listen uten at noe reagerer.</p>'],
      ['Kulde og batteri','<p>Kulde tapper batteriet raskt, og mobilen kan slå seg av selv med strøm igjen. Ha den i en innerlomme tett inntil kroppen, og hold powerbanken varm også. Strømsparemodus, lavere lysstyrke og flymodus når du ikke trenger dekning sparer batteri. Mørke skjermer bruker mindre strøm på de fleste mobiler, så <b>Nattlys</b> hjelper også.</p>'],
      ['Hansker og kalde fingre','<p>Tynne hansker for berøringsskjerm fungerer på de fleste mobiler. Mange Android-mobiler har hanskemodus i skjerminnstillingene, som gjør skjermen mer følsom. I appen gir <b>Utemodus</b> større tekst og knapper.</p>'],
      ['Før turen','<p>Last ned offline kart og lad alt. Denne appen virker uten dekning når den er installert. Men vær aldri avhengig av mobilen for sikkerheten: ha med kart og kompass, og satellittkommunikator eller nødpeilesender der det ikke er dekning.</p>'],
      ['Utemodus i appen','<p><b>Utemodus</b> gir større tekst og knapper, holder skjermen påslått, og låser redigering så ingenting kan slettes ved et uhell. Bare tydelige enkelttrykk teller, så vanndråper krysser sjeldnere av noe.</p><p><b>Regnlås</b> stopper alle endringer, men du kan fortsatt rulle og lese. Hold <b>Naviger</b> for å bytte side, åpne seksjoner eller lese notatene. Navigeringen er åpen i noen sekunder, og hvert trykk forlenger den, mens avkrysning og endringer er låst hele tiden. Hold <b>Lås opp</b> for å slå Regnlås av.</p><p><b>Nattlys</b> gjør appen rød, så du beholder nattsynet, og <b>Angre</b> tar tilbake siste avkrysning.</p>']
    ],
    sunCond:['Snø / tåke','Overskyet','Delvis sol','Sol','Sterk sol / bre'], sunCat:'Kat.', sunVlt:'VLT er hvor mye synlig lys glasset slipper gjennom. Mange produsenter har en oversikt som denne for sine glass: bruk den til å velge glass etter lysforholdene.',
    sunTool:'Solbriller', sunShort:'Velg riktige briller', sunSub:'Feil briller kan koste deg synet i flere dager, eller gjøre det vanskelig å lese terrenget. Velg for beskyttelse, ikke for utseende.',
    sunKey:'Velg alltid briller merket UV400 eller 100 % UV-beskyttelse. Hvor mørkt glasset er (filterkategori), sier ingenting om UV-beskyttelsen: mørke glass uten UV-filter er verre enn ingen briller, fordi pupillen åpner seg og slipper inn mer UV.',
    sun:[
      ['Snøblindhet','<p>Snøblindhet er en solforbrenning av hornhinnen. Nysnø reflekterer opptil 80 % av UV-strålingen, og UV øker med høyden, så det kan skje også på overskyede dager. Symptomene kommer gjerne først etter noen timer: sterke smerter, sandfølelse, rennende øyne og lysømfintlighet.</p>'],
      ['Filterkategorier','<ul><li><b>0:</b> klart eller svakt farget. Kveld og mørke.</li><li><b>1:</b> lett tonet. Overskyet, flatt lys.</li><li><b>2:</b> middels. Vanlig dagslys, skog og lavland.</li><li><b>3:</b> mørkt. Sterk sol, fjell, sjø og snø. Mest brukt på tur.</li><li><b>4:</b> ekstra mørkt. Bre, høyfjell og ekstrem sol på snø. Ikke til bilkjøring.</li></ul>'],
      ['Farge på glasset','<p>Brun, rav, kobber og rosa øker kontrasten, og gjør det lettere å lese terrenget og snøoverflaten i flatt lys. Grå gir de mest naturlige fargene i sterk sol. Gul og oransje i lav kategori hjelper i tåke og skumring. Speilbelegg reduserer blending i sterkt lys.</p>'],
      ['Polarisert og selvtonende','<p><b>Polariserte</b> glass fjerner gjenskinn fra vann og våte flater, ypperlig til fiske, padling og kystturer. På snø og is kan de skjule isflekker og gjøre overflaten vanskeligere å lese, og skjermer på GPS og mobil kan bli vanskelige å se.</p><p><b>Selvtonende</b> (fotokromatiske) glass tilpasser seg lyset, for eksempel kategori 1–3. Praktisk når lyset skifter mye, som på topptur. De kan skifte tregere i kulde.</p>'],
      ['Velg etter tur','<ul><li><b>Lett sommertur</b> i skog og lavland: kategori 2–3, lette solbriller holder.</li><li><b>Fjelltur om sommeren:</b> kategori 3, gjerne med god dekning på sidene.</li><li><b>Vintertur og skitur:</b> kategori 3 i sol, kategori 1–2 i kontrastfarge (rav, rosa) i flatt lys. Goggles i vind og snøfokk.</li><li><b>Topptur / randonee:</b> selvtonende 1–3, eller to par, fordi lyset skifter fra skog til åpen fjellside. Goggles til nedkjøringen.</li><li><b>Bre og høyfjell:</b> kategori 4 med sidebeskyttelse (brebriller), og alltid et reservepar.</li><li><b>Vann og fiske:</b> polarisert kategori 3.</li></ul>'],
      ['Goggles','<ul><li>Et <b>lyst glass</b> (gult, oransje eller rosa) passer det flate lyset i en skandinavisk vinter; et mørkere glass passer vårsola.</li><li>Hvis de <b>dugger</b>, ikke tørk innsiden: vift dem i lufta eller legg dem i en tørr, varm lomme.</li><li>Bruker du briller, se etter goggles merket <b>OTG</b> (over the glasses).</li><li>Tykt, mykt skum gir god passform, og unngå de bredeste modellene hvis du bruker hjelm.</li></ul>'],
      ['Hvis uhellet er ute','<p><b>Snøblindhet:</b> søk mørke eller dekk til øynene, ikke gni, ta ut kontaktlinser, og kalde kompresser lindrer. Det går vanligvis over på 1–3 døgn. Søk legehjelp ved sterke smerter eller hvis det ikke bedres.</p><p><b>Mistet brillene?</b> Lag nødbriller: skjær smale spalter i papp, tape eller et stykke stoff, og fest det foran øynene. Det slipper inn langt mindre lys. Ha alltid et reservepar på vinter- og breturer.</p>']
    ],
    sbTool:'Brennerplate', sbShort:'Lag din egen', guideLink:'Guide',
    sbSub:'Et stødig underlag gjør at brenneren står trygt på snø og ujevnt underlag, og ikke velter i forteltet. De fleste lager den selv.',
    sbFig1:['Platen: gulvlaminat eller kryssfiner','Varmeskjold av aluminium under brenneren','Brenneren festet med vingeskruer','Stropp rundt midten av flasken, gjennom to slisser','Slange med slakk, så flasken kan snus en halv omdreining','Teipmerke som viser ON og OFF','Skum under platen (sett fra siden), så den ikke smelter seg ned i snøen'],
    sbFig2Title:'Slik holder stroppen flasken (sett fra enden av flasken)',
    sbFig2:[['A','To slisser i platen, like brede som stroppen, én på hver side av flasken.'],['B','Stroppen går over flasken og holder den på plass med friksjon.'],['C','Spennen sitter på siden: løsne et hakk, snu flasken og stram igjen.'],['D','Under platen går stroppen fra slisse til slisse. Legg den før du limer på skummet, eller lag en rille i skummet.']],
    sb:[
      ['Materialer','<p><b>Gulvlaminat</b> eller tynn <b>kryssfiner</b> (3–5 mm, lakkert) er stivt og tåler drivstoffsøl. Et tynt <b>aluminiumsbrett</b> er lett og brenner ikke, men leder varme rett ned i snøen, så skum under er ekstra viktig. Unngå <b>plast</b>: den kan bli myk, smelte eller ta fyr når du forvarmer. Platen trenger bare være stor nok til at brenneren står stødig, med flasken ved siden av.</p>'],
      ['Varmeskjoldet','<p>En aluminiumsplate eller aluminiumstape under brenneren beskytter platen mot strålevarme og stikkflammer når du forvarmer. Laminat tåler korte stikkflammer, men overflaten kan svi seg og avgi ubehagelig røyk ved direkte flamme over tid. Sjekk platen av og til for svimerker.</p>'],
      ['Brenneren','<p><b>Vingeskruer</b> gjennom platen holder brenneren stødig og er lette å løsne med votter. <b>Strips eller ståltråd</b> gir et enklere oppsett som alltid står klart.</p>'],
      ['Flasken','<p>Flasken må ligge stødig, men fortsatt kunne snus rundt sin egen lengde: på de fleste brennere for flytende drivstoff snur du den for å slå av og tømme slangen. En <b>stropp gjennom to slisser</b> er den anbefalte løsningen. Alternativer: en tett løkke som kan snus med et fast grep, eller en liten vugge som hindrer at flasken ruller. Ha stroppen rundt midten av flasken, aldri ved halsen, la slangen ha slakk, og merk ON og OFF med teip. Noen foretrekker å la flasken ligge løst ved siden av platen; det går fint så lenge den ligger stødig og ikke drar i slangen.</p>'],
      ['Sikkerhet','<p>Forvarm ute eller med teltdøra åpen, og bruk aldri brenneren i lukket telt: det gir fare for brann og kullosforgiftning. Hold flasken og ekstra drivstoff unna flammen.</p>']
    ],
    winterTool:'Vinterråd', winterShort:'Kulde, klær og vinterleir', winterSub:'Korte råd for kalde dager, blant annet fra Forsvaret og Helsedirektoratet.',
    winterAdv:[
      ['Kle deg i lag','<ul><li><b>Tre lag:</b> ull innerst, et løsere mellomlag, og et romslig vindtett og vannavvisende ytterlag. Luften mellom lagene isolerer.</li><li><b>Votter</b> holder varmere enn hansker.</li><li><b>Vindtett lue som dekker ørene</b>, og hals eller skjerf: hode, hals og ansikt taper mye varme.</li><li><b>Sko en til to størrelser større</b>, med plass til tykke ullsokker og en god såle.</li></ul>'],
      ['Unngå svette og fukt','<p>Fukt er en av de største fiendene i kulda. Ta av et lag før du blir svett, luft ut klærne, og skift til noe tørt når du stopper. Ha et tørt sett som bare brukes i teltet.</p>'],
      ['Hud, metall og nikotin','<ul><li>Unngå <b>fuktighetskrem og flytende sminke</b>: de inneholder vann og øker faren for frostskader. Bruk heller kuldekrem uten vann.</li><li>Unngå barbering og kraftig ansiktsvask før du går ut: hudens naturlige fett beskytter.</li><li>Ikke ta på <b>bart metall</b> med fingrene i sprengkulde; ved –10 °C kan det skade huden raskt. Tenk på ringer, øreringer og klokker.</li><li><b>Nikotin</b> trekker sammen blodårene i fingre og tær og øker faren for kuldeskader.</li></ul>'],
      ['Mat og drikke','<p>Kroppen trenger omtrent <b>30 % mer energi</b> i kulde, så spis ofte. For lite væske gjør det vanskeligere for kroppen å holde varmen og øker faren for kuldeskader. Bær vannflasken innenfor jakka så den ikke fryser, og ha med termos med varm drikke.</p>'],
      ['Faresignaler for kuldeskader','<ul><li>Fingre som blir klønete</li><li>Smerter i hender eller føtter</li><li>Rød hud, hevelse, stikking, prikking eller nummenhet</li><li>Hvite flekker eller blemmer, først på nese, kinn, ører og fingre</li></ul><p>Varm opp tidlig, sjekk ansiktene til hverandre, og søk legehjelp ved blemmer eller hud som forblir hvit og hard.</p>'],
      ['Teltet en vinterkveld','<p>Pakk det som skal inn i teltet i egne pakkposer, så kommer du raskt inn. Ta inn: <b>de tørre teltklærne</b> (tykke ullsokker og ullundertøy, balaklava, dunsokker og dunvotter), maten du trenger for kvelden, termos og flaske, brenner, kjele og brensel, toalettsaker, hodelykt og teltlykt, <b>batterier i soveposen</b>, en snøbørste, og en stor pose ren snø til smelting. Ha kameraet i en zippose mot kondens, og førstehjelps- og reparasjonssettet i nærheten. Resten kan ligge i pulken.</p>'],
      ['Varmeflaske i soveposen','<p>Fyll en tett flaske med omtrent 1 liter nykokt vann og pakk den inn i en tykk ullsokk. Den gir fortsatt varme om morgenen, og vannet er klart til å drikke. Sjekk lokket nøye.</p>'],
      ['Barn, eldre og hard trening','<p>Barn og eldre taper varme raskere og trenger ekstra oppfølging. Unngå harde intervaller når det er kaldere enn rundt –15 °C, og skift til tørre klær så snart turen er over.</p>']
    ],
    knotTool:'Knuter', knotShort:'Sju viktige knuter', knotSub:'Korte påminnelser for når du trenger en knute raskt. Øv på dem hjemme: en knute du bare har lest om, er vanskelig å slå i vind og kulde.',
    knotWarn:'For utstyr, tarp og telt. Ikke for klatring eller sikring.', credits:'Bildekreditter', noAuthor:'forfatter ikke oppgitt', illFrom:'illustrasjon fra', photoFrom:'foto fra', adaptedPlain:'tilpasset (utsnitt, farger)', adaptedScaled:'tilpasset (skalert)', adaptedColours:'tilpasset (farger)', adaptedCrop:'tilpasset (utsnitt, skalert)', adaptedPrusik:'tilpasset (utsnitt, bakgrunn lysnet, forstørret)', adaptedBg:'tilpasset (utsnitt, hvit bakgrunn)', illBy:'illustrasjon av', photoBy:'foto av', adapted:'tilpasset (utsnitt, merking fjernet, farger)', adaptedPhoto:'tilpasset (utsnitt, skygge dempet)',
    knots:[
      {n:'Pålestikk (Bowline)', u:'En fast løkke som ikke glir, og som er lett å løse opp etter belastning. Rundt et tre, en person eller en sekk.', s:['Lag en liten løkke i den faste parten, med tamp-siden øverst.','Før tampen opp gjennom den lille løkka nedenfra.','Før den rundt bak den faste parten.','Før den ned igjen gjennom den lille løkka.','Hold tampen og den store løkka sammen, og trekk til i den faste parten.'], c:'Husk: haren kommer opp av hullet, løper rundt treet, og hopper ned i hullet igjen. La tampen være minst 10 cm lang.'},
      {n:'Teltstikk (Taut Line Hitch)', u:'En justerbar løkke for barduner på telt og tarp. Skyv knuten for å stramme eller slakke.', s:['Før tampen rundt pluggen eller festet.','Ta to tørn rundt den faste parten, innover mot pluggen, på innsiden av løkka.','Ta ett tørn til rundt den faste parten, på motsatt side av de to første (lengst fra pluggen), og stikk tampen under seg selv i dette tørnet, så det blir et eget halvstikk.','Trekk til.','Skyv knuten oppover for å stramme, nedover for å slakke.'], c:'Forveksles ofte med Magnus-stikket, som ligner. Sjekk: det siste tørnet skal ligge for seg selv, adskilt fra de to første, og tampen går ut derfra. Går tampen tilbake ned mellom tørnene, har du slått Magnus-varianten. Taut Line Hitch er det beste valget til barduner. Glir det i tynn eller glatt snor, ta ett ekstra tørn på innsiden.'},
      {n:'Dobbelt halvstikk (Clove Hitch)', u:'Et raskt stikk rundt en stang, gren eller et tre. Bra for å starte en surring eller feste en line.', s:['Legg tauet rundt stangen.','Kryss over seg selv og gå rundt stangen en gang til.','Stikk tampen under det siste tørnet, slik at endene går ut i hver sin retning mellom tørnene.','Trekk til i begge ender.'], c:'Den kan løsne når belastningen skifter: sikre med et halvstikk rundt den faste parten.'},
      {n:'Flaggstikk (Sheet Bend)', u:'Skjøter to tau, også med ulik tykkelse. Bra for å forlenge en line.', s:['Lag en U-formet bukt i det tykkeste tauet.','Før tampen på det tynne tauet opp gjennom bukten nedenfra.','Før den rundt bak begge partene av bukten.','Stikk den under seg selv, men over bukten, ikke gjennom den.','Trekk til i alle fire partene.'], c:'Begge de korte tampene skal være på samme side. På glatt tau, ta ett ekstra tørn rundt bukten (dobbelt flaggstikk).'},
      {n:'Prusik', u:'En friksjonsknute som låser når den belastes og kan skyves når den er slakk. For å feste tarp til en møneline, stramme, eller henge opp utstyr på en line.', s:['Bruk en lukket slynge av snor som er tydelig tynnere enn hovedtauet.','Legg slyngen bak hovedtauet.','Før den ene enden av slyngen rundt hovedtauet og gjennom seg selv, inne i slyngen.','Ta én omgang til, innenfor den første, så du har to omganger (fire tørn rundt tauet), som på bildet. Standard er tre omganger (seks tørn), som gir mer grep.','Rett opp tørnene så de ligger pent side om side, og trekk til.'], c:'Den låser ved belastning og glir når du skyver den mens den er slakk. Flere tørn gir mer grep, spesielt på glatt tau.'},
      {n:'Tømmerstikk (Timber Hitch)', u:'Fester et tau rundt et tre, en stang eller en stokk. Holder godt så lenge tauet er belastet, og er lett å løse opp etterpå. Fint i treenden av en møneline til tarpen, eller for å slepe ved.', s:['Før tauet rundt treet.','Legg tampen rundt det stående partet og deretter tilbake rundt seg selv.','Tvinn tampen rundt seg selv minst tre ganger.','Trekk i det stående partet så stikket strammer seg mot treet.'], c:'Tampen skal være tvunnet rundt seg selv, ikke rundt det stående partet. Holder bare under belastning, og kan løsne når tauet er slakt.'},
      {n:'Åttetallsknute (enkel og dobbel)', u:'En stoppeknute i enden av et tau, og, slått med dobbelt tau, en sterk, fast løkke til en karabin, en plugg eller en stang.', s:['<b>Enkel:</b> lag en løkke nær enden.','Før tampen bak det stående partet og ned gjennom løkken, og trekk til.','<b>Dobbel (løkke):</b> legg tauet dobbelt på ca. 30 cm, og slå den samme knuten med det doble tauet.','Rett den opp så partene ligger parallelt, og la tampen være minst en håndbredde lang.'], c:'Den enkle knuten ser ut som et 8-tall og er lett å løse opp, også etter belastning. På løkken: sjekk at det er to parallelle parter hele veien, uten kryss. Klatrere knytter en tredd variant gjennom selen; den læres på kurs.'}
    ],

    packTitle:'Pakking av mat',
    pack:[
      ['Dagsrasjoner','Pakk frokost, lunsj og snacks for hver dag sammen i én pose, og merk den med dagnummer. Du tar én pose per dag, det er lett å se at maten holder, og ingenting blir spist for tidlig.'],
      ['Havre tørr og tett','Mål opp hver frokost hjemme i sin egen zip- eller frysepose, med sukker og tilbehør. Klem ut luften og lukk godt. Legg alle posene i en større pose eller en drybag, så et hull i én pose ikke sprer havre i hele sekken.'],
      ['Hold mat og drivstoff adskilt','Drivstoff og mat skal aldri i samme pose. Bær drivstoffflasken stående, sjekk lokk og pakning før du pakker, og legg den under eller unna maten, så en lekkasje ikke kan renne ned på den. Mat med drivstoffsøl er ødelagt, og den er ikke trygg å spise.'],
      ['Én matpose','Hold all mat samlet i én drybag. Den holder seg tørr, er lett å finne, og er lett å holde lukket i leiren, der mus og fugler kan være interessert.'],
      ['Mindre emballasje','Fjern ytre papp og ekstra emballasje hjemme for å spare vekt og søppel, men ta vare på koketiden for turmaten. Ha med en søppelpose og bær alt hjem.']
    ],

    warnGasCold:'Vanlige gassbokser fungerer dårlig under frysepunktet. Bruk vintergass med propan, hold boksen varm (f.eks. i soveposen), eller velg bensin / multifuel.',
    warnSpiritSnow:'Rødsprit er treg i kulde og lite egnet til å smelte mye snø. Vurder bensin / multifuel på vinterturer.',

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function detectLang(){
  const l = (navigator.language || 'en').toLowerCase();
  return /^(nb|nn|no)\b/.test(l) ? 'no' : 'en';
}
function parseItem(x, ids){
  let sub = false, link = null, light = false;
  if (x.startsWith('> ')){ sub = true; x = x.slice(2); }
  if (x.startsWith('* ')){ light = true; x = x.slice(2); }
  const m = x.match(/^@(\w+) (.*)$/);
  if (m){ link = ids[m[1]] || null; x = m[2]; }
  return {id:uid(), text:x, done:false, sub, link, light};
}
function cloneList(src, keepDone){
  const map = {};
  const cats = (Array.isArray(src.cats) ? src.cats : []).filter(c => c && Array.isArray(c.items)).map(c => {
    const id = uid(); map[c.id] = id;
    return { id, icon: typeof c.icon === 'string' ? c.icon : null, name:String(c.name || t().category), note: typeof c.note === 'string' ? c.note : '',
      mode: (typeof c.mode === 'string' && MODES[c.mode]) ? c.mode : null, bag: !!c.bag, lightOnly: !!c.lightOnly, open:true,
      items: c.items.filter(i => i && i.text).map(i => ({ id:uid(), text:String(i.text), done: keepDone ? !!i.done : false, sub:!!i.sub, link: i.link || null, light:!!i.light })) };
  });
  cats.forEach(c => c.items.forEach(i => { if (i.link) i.link = map[i.link] || null; }));
  const modes = {};
  if (src.modes && typeof src.modes === 'object') Object.keys(src.modes).forEach(k => { if (MODES[k]) modes[k] = !!src.modes[k]; });
  return { id:uid(), name:String(src.name || t().myList), notes: typeof src.notes === 'string' ? src.notes : '', modes, cats };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.lists)) return s; } catch(e){}
  return null;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

let state = load();
if (!state) state = { lists:[], hidePacked:false, lang:detectLang() };
if (!state.lang) state.lang = detectLang();

/* ---------- standard list (built in, follows the language) ---------- */
const slug = x => String(x).replace(/^> /,'').replace(/^\* /,'').replace(/^@\w+ /,'').trim().toLowerCase();
const stdId = (key, no) => 'std:' + key + ':' + slug(no);
let stdCache = null;
function stdList(){
  if (stdCache && stdCache.lang === state.lang) return stdCache;
  const tp = friluftsliv(state.lang), S = state.std, ids = {};
  tp.cats.forEach(c => ids[c.key] = 'std:' + c.key);
  stdCache = { id:'std', std:true, lang:state.lang, name:tp.name, notes:'', modes:S.modes, cats: tp.cats.map(c => ({
    id: ids[c.key], icon:c.key, name:c.name, note:c.note || '', mode:c.mode || null, bag:!!c.bag,
    lightOnly: !!S.light[ids[c.key]], open: S.open[ids[c.key]] !== false,
    items: c.items.map(x => { const it = parseItem(x.t, ids); it.id = stdId(c.key, x.no); it.done = !!S.done[it.id]; return it; })
  }))};
  return stdCache;
}
const isStd = c => typeof c.id === 'string' && c.id.indexOf('std:') === 0;
function setDone(c, i, v){ if (isStd(c)){ if (v) state.std.done[i.id] = true; else delete state.std.done[i.id]; } else i.done = v; stdCache = null; }
function setOpen(c, v){ if (isStd(c)) state.std.open[c.id] = v; else c.open = v; stdCache = null; }
function setLight(c, v){ if (isStd(c)) state.std.light[c.id] = v; else c.lightOnly = v; stdCache = null; }
function mainList(){ return (state.main && state.main !== 'std' && state.lists.find(l => l.id === state.main)) || stdList(); }
function ownList(id){ return state.lists.find(l => l.id === id); }

      h += `<button class="btn" data-la="reset" data-id="${L.id}">${T.reset}</button>`;
      if (!L.std) h += `<button class="btn danger" data-la="delete" data-id="${L.id}">${T.del}</button>`;
    }
    h += '</div></div>';
  }
  return h + '</div>';
}
function renderLists(){

  $('listName').textContent = T.yourLists;
  document.title = T.yourLists + ' · ' + T.app;
  document.body.classList.add('notlist');
  let html = `<button class="back" data-nav data-act="back">${CHEV_L}${esc(mainList().name)}</button>
    <p class="tool-sub">${T.listsSub}</p>${state.field ? `<p class="calc-warn">${T.editLocked}</p>` : ''}
    <div class="section-label">${T.stdList}</div>${listCard(stdList())}
    <div class="section-label">${T.ownLists}</div>`;
  const own = state.lists.filter(L => !L.sharedIn), shared = state.lists.filter(L => L.sharedIn);
  if (!own.length) html += `<p class="empty-own">${T.noOwn}</p>`;
  own.forEach(L => { html += listCard(L); });
  html += `<div class="section-label">${T.sharedLists}</div>`;
  if (!shared.length) html += `<p class="empty-own">${T.noShared}</p>`;
  shared.forEach(L => { html += listCard(L); });
  if (!state.field) html += `<div class="row-btns"><button class="btn primary" data-la="new">${T.newList}</button><button class="btn" data-la="backup">${T.backup}</button></div>`;
  html += `
    <div class="section-label">${T.appearance}</div>
    <div class="skins">${Object.entries(SKINS).map(([k, v]) => `<button class="skin-btn" data-skin="${k}" aria-pressed="${(state.skin || 'fjell') === k}"><span class="sw">${v.c.map(c => `<i style="background:${c}"></i>`).join('')}</span>${v[state.lang] || v.en}</button>`).join('')}</div>
    <div class="section-label">${T.language}</div>
    <div class="row-btns"><button class="btn" data-lang="no" aria-pressed="${state.lang === 'no'}">Norsk</button><button class="btn" data-lang="en" aria-pressed="${state.lang === 'en'}">English</button></div>
    <p class="tool-tip">${T.langNote}</p>
    <div class="section-label">${T.help}</div>
    <div class="row-btns"><button class="btn" data-la="howto">${T.howTool}</button><button class="btn" data-la="intro">${T.showIntro}</button></div>
    <p class="tool-tip">${T.versionLbl} ${APP_VERSION}</p>`;
  if (!state.field) html += `<div class="section-label">${T.startOver}</div><p class="tool-tip">${T.startOverHint}</p>
    <div class="row-btns"><button class="btn danger" data-la="startOver">${T.startOver}</button></div>`;
  main.innerHTML = html;
}
function renderIndex(){
