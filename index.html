    phoneTool:'Mobilen på tur', phoneShort:'Regn, kulde og hansker',
    phoneSub:'Få mobilen til å fungere i dårlig vær, uten å være avhengig av den for sikkerheten.',
    phone:[
      ['Regn','<p>Vann på skjermen kan registreres som berøring. Tørk skjermen med en tørr klut eller ermet før bruk, det utgjør den største forskjellen. En vannavstøtende eller matt skjermbeskytter får vannet til å perle seg og renne av, og et vanntett etui holder selve skjermen tørr. Har mobilen hanskemodus eller økt berøringsfølsomhet, slå det <b>av</b> i regn, for det gjør skjermen mer følsom for vann også.</p><p>I appen: slå på <b>Utemodus</b> og bruk <b>Regnlås</b>. Da kan du rulle og lese, men trykk gjør ingenting. Hold <b>Naviger</b> for å bytte side, og <b>Lås opp</b> for å slå den av.</p>'],
      ['Kulde og batteri','<p>Kulde tapper batteriet raskt, og mobilen kan slå seg av selv med strøm igjen. Ha den i en innerlomme tett inntil kroppen, og hold powerbanken varm også. Strømsparemodus, lavere lysstyrke og flymodus når du ikke trenger dekning sparer batteri. Mørke skjermer bruker mindre strøm på de fleste mobiler, så <b>nattlyset</b> hjelper også.</p>', 'battery'],
      ['Hansker og kalde fingre','<p>Tynne hansker for berøringsskjerm fungerer på de fleste mobiler. Mange Android-mobiler har hanskemodus i skjerminnstillingene, som gjør skjermen mer følsom. I appen gir <b>Utemodus</b> større tekst og knapper.</p>'],
      ['Før turen','<p>Last ned offline kart og lad alt. Denne appen virker uten dekning når den er installert. Men vær aldri avhengig av mobilen for sikkerheten: ha med kart og kompass, og satellittkommunikator eller nødpeilesender der det ikke er dekning.</p>'],
      ['Utemodus i appen','<p><b>Utemodus</b> gir større tekst og knapper, holder skjermen påslått, og låser redigering så ingenting kan slettes ved et uhell. Bare tydelige enkelttrykk teller, så vanndråper krysser sjeldnere av noe. Et fjellmerke øverst viser at den er på.</p><p>Listen er samlet i én linje, <b>Pakkliste</b>, som viser hvor mye som er pakket. Trykk på den for å åpne listen. Turtypene vises ikke i Utemodus: velg dem før turen, med Utemodus av.</p><p><b>Lås listen</b> slås på sammen med Utemodus, så våt skjerm eller hansker ikke krysser av noe. Trykk Lås listen når du vil krysse av mens du pakker; den går tilbake til slik den var når Utemodus slås av.</p><p><b>Regnlås</b>, knappen med blå ramme øverst, stopper alle endringer, men du kan fortsatt rulle og lese. Hold <b>Naviger</b> for å bytte side, åpne seksjoner eller lese notatene. Navigeringen er åpen i noen sekunder, og hvert trykk forlenger den, mens avkrysning og endringer er låst hele tiden. Hold <b>Lås opp</b> for å slå Regnlås av.</p><p><b>Rødt nattlys</b> gjør appen rød, så du beholder nattsynet; det er også best før du skal sove. <b>Grønt nattlys</b> er lettere å lese ved lav lysstyrke, men koster litt mer av nattsynet. Hold en av dem, eller <b>Bål</b>, for å bruke hele skjermen som lys; dra knappen nederst for å låse opp. Lysstyrken stiller du på mobilen.</p><p><b>Bål</b> gjør skjermen til et lite bål som knitrer. Lyden kommer sakte; volumet stiller du med knappene på mobilen. Bålet brenner ned til glør i løpet av 45 minutter: hold en finger stille på skjermen for å legge på ved. Sitter du lenge nok, kan du få besøk. Vil du ha bålet på TV-en på hytta? Snu mobilen og speil skjermen til TV-en.</p>'],
      ['Nødfunksjoner på mobilen','<p>Mobilen har egne nødfunksjoner. Lær dem hjemme, for de virker litt ulikt fra mobil til mobil.</p><p><b>Nød-SOS:</b> på de fleste Android-mobiler starter fem raske trykk på av/på-knappen Nød-SOS, som kan ringe nødnummeret, varsle nødkontaktene dine og spille av en alarm. På iPhone holder du inne sideknappen og en volumknapp, eller trykker sideknappen fem ganger hvis det er slått på. Sjekk innstillingene: noen mobiler ringer etter en kort nedtelling, så fem trykk ved et uhell kan bli en nødsamtale.</p><p><b>Nødinformasjon på låseskjermen:</b> legg inn nødkontakter og medisinsk informasjon, i innstillingene under sikkerhet og nød (Android) eller som Medisinsk ID i Helse-appen (iPhone), og slå på at den vises når skjermen er låst. Da kan redningsfolk se den uten å låse opp mobilen, men det kan også alle andre som finner den.</p><p><b>Lommelykt:</b> ligger i hurtiginnstillingene (Android) og i Kontrollsenter (iPhone). Lyset kan brukes til signalene i Nødsituasjon.</p><p><b>Nødmodus i appen:</b> åpne Nødmodus én gang hjemme og tillat posisjon når mobilen spør. Nødmodus henter posisjonen med en gang den åpnes, og da slipper du å møte spørsmålet for første gang når det haster.</p><p><button class="btn small" data-nav data-act="openGuide" data-guide="emergency" data-sec="signals">Nødsituasjon: Signaler ›</button></p>', 'sos']
    ],
    sunCond:['Snø / tåke','Overskyet','Delvis sol','Sol','Sterk sol / bre'], sunCat:'Kat.', sunVlt:'VLT er hvor mye synlig lys glasset slipper gjennom. Mange produsenter har en oversikt som denne for sine glass: bruk den til å velge glass etter lysforholdene.',
    sunTool:'Solbriller', sunShort:'Velg riktige briller', sunSub:'Feil briller kan koste deg synet i flere dager, eller gjøre det vanskelig å lese terrenget. Velg for beskyttelse, ikke for utseende.',
    sunKey:'Velg alltid briller merket UV400 eller 100 % UV-beskyttelse. Hvor mørkt glasset er (filterkategori), sier ingenting om UV-beskyttelsen: mørke glass uten UV-filter er verre enn ingen briller, fordi pupillen åpner seg og slipper inn mer UV.',
    sun:[
      ['Snøblindhet','<p>Snøblindhet er en solforbrenning av hornhinnen. Nysnø reflekterer opptil 80 % av UV-strålingen, og UV øker med høyden, så det kan skje også på overskyede dager. Symptomene kommer gjerne først etter noen timer: sterke smerter, sandfølelse, rennende øyne og lysømfintlighet.</p>'],
      ['Filterkategorier','<ul><li><b>0:</b> klart eller svakt farget. Kveld og mørke.</li><li><b>1:</b> lett tonet. Overskyet, flatt lys.</li><li><b>2:</b> middels. Vanlig dagslys, skog og lavland.</li><li><b>3:</b> mørkt. Sterk sol, fjell, sjø og snø. Mest brukt på tur.</li><li><b>4:</b> ekstra mørkt. Bre, høyfjell og ekstrem sol på snø. Ikke til bilkjøring.</li></ul>'],
      ['Farge på glasset','<p>Brun, rav, kobber og rosa øker kontrasten, og gjør det lettere å lese terrenget og snøoverflaten i flatt lys. Grå gir de mest naturlige fargene i sterk sol. Gul og oransje i lav kategori hjelper i tåke og skumring. Speilbelegg reduserer blending i sterkt lys.</p>'],
      ['Polarisert og selvtonende','<p><b>Polariserte</b> glass fjerner gjenskinn fra vann og våte flater, ypperlig til fiske, padling og kystturer. På snø og is kan de skjule isflekker og gjøre overflaten vanskeligere å lese, og skjermer på GPS og mobil kan bli vanskelige å se.</p><p><b>Selvtonende</b> (fotokromatiske) glass tilpasser seg lyset, for eksempel kategori 1–3. Praktisk når lyset skifter mye, som på topptur. De kan skifte tregere i kulde.</p>'],
      ['Velg etter tur','<ul><li><b>Lett sommertur</b> i skog og lavland: kategori 2–3, lette solbriller holder.</li><li><b>Fjelltur om sommeren:</b> kategori 3, gjerne med god dekning på sidene.</li><li><b>Vintertur og skitur:</b> kategori 3 i sol, kategori 1–2 i kontrastfarge (rav, rosa) i flatt lys. Goggles i vind og snøfokk.</li><li><b>Topptur / randonee:</b> selvtonende 1–3, eller to par, fordi lyset skifter fra skog til åpen fjellside. Goggles til nedkjøringen.</li><li><b>Bre og høyfjell:</b> kategori 4 med sidebeskyttelse (brebriller), og alltid et reservepar.</li><li><b>Vann og fiske:</b> polarisert kategori 3.</li></ul>'],
      ['Goggles','<ul><li>Et <b>lyst glass</b> (gult, oransje eller rosa) passer det flate lyset i en skandinavisk vinter; et mørkere glass passer vårsola.</li><li>Hvis de <b>dugger</b>, ikke tørk innsiden: vift dem i lufta eller legg dem i en tørr, varm lomme.</li><li>Bruker du briller, se etter goggles merket <b>OTG</b> (over the glasses).</li><li>Tykt, mykt skum gir god passform, og unngå de bredeste modellene hvis du bruker hjelm.</li></ul>'],
      ['Hvis uhellet er ute','<p><b>Snøblindhet:</b> søk mørke eller dekk til øynene, ikke gni, ta ut kontaktlinser, og kalde kompresser lindrer. Det går vanligvis over på 1–3 døgn. Søk legehjelp ved sterke smerter eller hvis det ikke bedres.</p><p><b>Mistet brillene?</b> Lag nødbriller: skjær smale spalter i papp, tape eller et stykke stoff, og fest det foran øynene. Det slipper inn langt mindre lys. Ha alltid et reservepar på vinter- og breturer.</p>']
    ],
    sbTool:'Brennerplate', sbShort:'Lag din egen', guideLink:'Guide',
    sbSub:'Et stødig underlag gjør at brenneren står trygt på snø og ujevnt underlag, og ikke velter i forteltet. De fleste lager den selv.',
    sbFig1:['Platen: gulvlaminat eller kryssfiner','Varmeskjold av aluminium under brenneren','Brenneren festet med vingeskruer','Stropp rundt midten av flasken, gjennom to slisser','Slange med slakk, så flasken kan snus en halv omdreining','Teipmerke som viser ON og OFF','Skum under platen (sett fra siden), så den ikke smelter seg ned i snøen'],
    sbFig2Title:'Slik holder stroppen flasken (sett fra enden av flasken)',
    sbFig2:[['A','To slisser i platen, like brede som stroppen, én på hver side av flasken.'],['B','Stroppen går over flasken og holder den på plass med friksjon.'],['C','Spennen sitter på siden: løsne et hakk, snu flasken og stram igjen.'],['D','Under platen går stroppen fra slisse til slisse. Legg den før du limer på skummet, eller lag en rille i skummet.']],
    sb:[
      ['Materialer','<p><b>Gulvlaminat</b> eller tynn <b>kryssfiner</b> (3–5 mm, lakkert) er stivt og tåler drivstoffsøl. Et tynt <b>aluminiumsbrett</b> er lett og brenner ikke, men leder varme rett ned i snøen, så skum under er ekstra viktig. Unngå <b>plast</b>: den kan bli myk, smelte eller ta fyr når du forvarmer. Platen trenger bare være stor nok til at brenneren står stødig, med flasken ved siden av.</p>'],
      ['Varmeskjoldet','<p>En aluminiumsplate eller aluminiumstape under brenneren beskytter platen mot strålevarme og stikkflammer når du forvarmer. Laminat tåler korte stikkflammer, men overflaten kan svi seg og avgi ubehagelig røyk ved direkte flamme over tid. Sjekk platen av og til for svimerker.</p>'],
      ['Brenneren','<p><b>Vingeskruer</b> gjennom platen holder brenneren stødig og er lette å løsne med votter. <b>Strips eller ståltråd</b> gir et enklere oppsett som alltid står klart.</p>'],
      ['Flasken','<p>Flasken må ligge stødig, men fortsatt kunne snus rundt sin egen lengde: på de fleste brennere for flytende drivstoff snur du den for å slå av og tømme slangen. En <b>stropp gjennom to slisser</b> er den anbefalte løsningen. Alternativer: en tett løkke som kan snus med et fast grep, eller en liten vugge som hindrer at flasken ruller. Ha stroppen rundt midten av flasken, aldri ved halsen, la slangen ha slakk, og merk ON og OFF med teip. Noen foretrekker å la flasken ligge løst ved siden av platen; det går fint så lenge den ligger stødig og ikke drar i slangen.</p>'],
      ['Sikkerhet','<p>Forvarm ute eller med teltdøra åpen, og bruk aldri brenneren i lukket telt: det gir fare for brann og kullosforgiftning. Hold flasken og ekstra drivstoff unna flammen.</p>']
    ],
    winterTool:'Vinterråd', winterShort:'Kulde, klær og vinterleir', winterSub:'Korte råd for kalde dager.',
    winterAdv:[
      ['Kle deg i lag','<ul><li><b>Tre lag:</b> ull innerst, et løsere mellomlag, og et romslig vindtett og vannavvisende ytterlag. Luften mellom lagene isolerer.</li><li><b>Votter</b> holder varmere enn hansker.</li><li><b>Vindtett lue som dekker ørene</b>, og hals eller skjerf: hode, hals og ansikt taper mye varme.</li><li><b>Sko en til to størrelser større</b>, med plass til tykke ullsokker og en god såle.</li></ul>'],
      ['Unngå svette og fukt','<p>Fukt er en av de største fiendene i kulda. Ta av et lag før du blir svett, luft ut klærne, og skift til noe tørt når du stopper. Ha et tørt sett som bare brukes i teltet.</p>'],
      ['Hud, metall og nikotin','<ul><li><b>Ingen krem beskytter mot frostskader</b>, heller ikke kuldekrem, og den kan gi falsk trygghet. Dekk til huden med klær. Bruker du fuktighetskrem, smør i god tid før du går ut, så vannet rekker å fordampe.</li><li>Unngå barbering og kraftig ansiktsvask før du går ut: hudens naturlige fett beskytter.</li><li>Ikke ta på <b>bart metall</b> med bare fingre i sterk kulde: huden kan fryse fast og skades raskt. Tenk på ringer, øreringer og klokker.</li><li><b>Nikotin</b> trekker sammen blodårene i fingre og tær og øker faren for kuldeskader.</li></ul>'],
      ['Mat og drikke','<p><b>Kulde, snø og tung sekk øker energibehovet</b>, så spis ofte, også litt før du sover. Kulde demper tørsten, så drikk mer enn tørsten tilsier. For lite væske gjør det vanskeligere for kroppen å holde varmen og øker faren for kuldeskader. Bær vannflasken innenfor jakka så den ikke fryser, og ha med termos med varm drikke.</p><p>Planlegg mat og energi til turen:</p><p>[[plan:food]]</p>'],
      ['Faresignaler for kuldeskader','<ul><li>Fingre som blir klønete</li><li>Smerter i hender eller føtter</li><li>Rød hud, hevelse, stikking, prikking eller nummenhet</li><li>Hvite flekker eller blemmer, først på nese, kinn, ører og fingre</li></ul><p>Varm opp tidlig, sjekk ansiktene til hverandre, og søk legehjelp ved blemmer eller hud som forblir hvit og hard.</p><p>Vind gjør det kaldere på bar hud.</p><p>[[plan:wind]]</p>'],
      ['Teltet en vinterkveld','<p>Pakk det som skal inn i teltet i egne pakkposer, så kommer du raskt inn. Ta inn: <b>de tørre teltklærne</b> (tykke ullsokker og ullundertøy, balaklava, dunsokker og dunvotter), maten du trenger for kvelden, termos og flaske, brenner, kjele og brensel, toalettsaker, hodelykt og teltlykt, <b>batterier i soveposen</b>, en snøbørste, og en stor pose ren snø til smelting. Ha kameraet i en zippose mot kondens, og førstehjelps- og reparasjonssettet i nærheten. Resten kan ligge i pulken.</p><p>Snøsmelting krever mye brensel:</p><p>[[plan:fuel]]</p>'],
      ['Varmeflaske i soveposen','<p>Fyll en tett flaske med omtrent 1 liter nykokt vann og pakk den inn i en tykk ullsokk. Den gir fortsatt varme om morgenen, og vannet er klart til å drikke. Sjekk lokket nøye.</p><p>Mer om å sove varmt: <button class="btn small" data-nav data-act="openGuide" data-guide="sleep">Sove godt på tur ›</button></p>'],
      ['Barn, eldre og hard trening','<p>Barn og eldre taper varme raskere og trenger ekstra oppfølging. Unngå harde intervaller når det er kaldere enn rundt –15 °C, og skift til tørre klær så snart turen er over.</p>']
    ],
    fishTool:'Fiske', fishShort:'Knuter for krok, svivel og sluk', fishSub:'Knuter og råd til fisketuren. Øv på knutene hjemme, med snøret du fisker med.', fishHd:'Knuter',
    fishKnots:[
      {n:'Forbedret uniknute', u:'Fester snøret til krok, svivel eller sluk. Holder godt i nylon, fluorkarbon og glatt flettesnøre, og sluken trenger aldri gjennom en løkke.', s:['Træ snøret gjennom øyet to ganger, så det ligger en dobbel runde rundt øyet.','Legg tampen tilbake langs snøret og lag en løkke ved å legge den over det doble snøret.','Surr tampen 5–6 ganger rundt det doble snøret, inne i løkken. I flettesnøre 7–8.','Fukt og trekk i tampen så surringene samler seg.','Trekk i snøret til knuten glir ned mot øyet, og klipp tampen.'], c:'Sjekk: surringene ligger tett og jevnt uten kryss, og den doble runden ligger stramt rundt øyet. Fukt alltid før du strammer, så snøret ikke svekkes av friksjonsvarme, og gi knuten et fast drag før du kaster. Det er en vanlig uniknute der snøret går to ganger gjennom øyet: den doble runden gir mer friksjon og fordeler trekket. Kalles også modifisert uniknute.'},
      {n:'Palomarknute', u:'Svært sterk knute for krok, svivel eller liten sluk, god i flettesnøre. Hele kroken eller sluken må gjennom løkken, så til store sluker passer forbedret uniknute bedre.', s:['Legg snøret dobbelt på ca. 15 cm og før den doble enden gjennom øyet.','Slå en løs halvknute med det doble snøret, uten å vri det.','Før kroken eller sluken gjennom løkken.','Fukt og stram ved å trekke i både snøret og tampen, så løkken legger seg over øyet.','Klipp tampen.'], c:'Sjekk: løkken ligger rundt øyet, over knuten, og de to partene gjennom øyet ligger parallelt uten kryss. Er øyet for lite til dobbelt snøre, bruk forbedret uniknute.'}
    ],
    knotTool:'Knuter', knotShort:'Sju viktige knuter', knotSub:'Korte påminnelser for når du trenger en knute raskt. Øv på dem hjemme: en knute du bare har lest om, er vanskelig å slå i vind og kulde.',
    knotWarn:'For utstyr, tarp og telt. Ikke for klatring eller sikring.', credits:'Bildekreditter', noAuthor:'forfatter ikke oppgitt', illFrom:'illustrasjon fra', photoFrom:'foto fra', adaptedPlain:'tilpasset (utsnitt, farger)', adaptedScaled:'tilpasset (skalert)', adaptedColours:'tilpasset (farger)', adaptedCrop:'tilpasset (utsnitt, skalert)', adaptedCut:'tilpasset (utsnitt)', adaptedPrusik:'tilpasset (utsnitt, bakgrunn lysnet, forstørret)', adaptedBg:'tilpasset (utsnitt, hvit bakgrunn)', illBy:'illustrasjon av', photoBy:'foto av', adapted:'tilpasset (utsnitt, merking fjernet, farger)', adaptedPhoto:'tilpasset (utsnitt, skygge dempet)',
    knots:[
      {n:'Pålestikk (Bowline)', u:'En fast løkke som ikke glir, og som er lett å løse opp etter belastning. Rundt et tre, en person eller en sekk.', s:['Lag en liten løkke i den faste parten, med tamp-siden øverst.','Før tampen opp gjennom den lille løkka nedenfra.','Før den rundt bak den faste parten.','Før den ned igjen gjennom den lille løkka.','Hold tampen og den store løkka sammen, og trekk til i den faste parten.'], c:'Husk: haren kommer opp av hullet, løper rundt treet, og hopper ned i hullet igjen. La tampen være minst 10 cm lang.'},
      {n:'Teltstikk (Taut Line Hitch)', u:'En justerbar løkke for barduner på telt og tarp. Skyv knuten for å stramme eller slakke.', s:['Før tampen rundt pluggen eller festet.','Ta to tørn rundt den faste parten, innover mot pluggen, på innsiden av løkka.','Ta ett tørn til rundt den faste parten, på motsatt side av de to første (lengst fra pluggen), og stikk tampen under seg selv i dette tørnet, så det blir et eget halvstikk.','Trekk til.','Skyv knuten oppover for å stramme, nedover for å slakke.'], c:'Forveksles ofte med Magnus-stikket, som ligner. Sjekk: det siste tørnet skal ligge for seg selv, adskilt fra de to første, og tampen går ut derfra. Går tampen tilbake ned mellom tørnene, har du slått Magnus-varianten. Taut Line Hitch er det beste valget til barduner. Glir det i tynn eller glatt snor, ta ett ekstra tørn på innsiden.'},
      {n:'Dobbelt halvstikk (Clove Hitch)', u:'Et raskt stikk rundt en stang, gren eller et tre. Bra for å starte en surring eller feste en line.', s:['Legg tauet rundt stangen.','Kryss over seg selv og gå rundt stangen en gang til.','Stikk tampen under det siste tørnet, slik at endene går ut i hver sin retning mellom tørnene.','Trekk til i begge ender.'], c:'Den kan løsne når belastningen skifter: sikre med et halvstikk rundt den faste parten.'},
      {n:'Flaggstikk (Sheet Bend)', u:'Skjøter to tau, også med ulik tykkelse. Bra for å forlenge en line.', s:['Lag en U-formet bukt i det tykkeste tauet.','Før tampen på det tynne tauet opp gjennom bukten nedenfra.','Før den rundt bak begge partene av bukten.','Stikk den under seg selv, men over bukten, ikke gjennom den.','Trekk til i alle fire partene.'], c:'Begge de korte tampene skal være på samme side. På glatt tau, ta ett ekstra tørn rundt bukten (dobbelt flaggstikk).'},
      {n:'Prusik', u:'En friksjonsknute som låser når den belastes og kan skyves når den er slakk. For å feste tarp til en møneline, stramme, eller henge opp utstyr på en line.', s:['Bruk en lukket slynge av snor som er tydelig tynnere enn hovedtauet.','Legg slyngen bak hovedtauet.','Før den ene enden av slyngen rundt hovedtauet og gjennom seg selv, inne i slyngen.','Ta én omgang til, innenfor den første, så du har to omganger (fire tørn rundt tauet), som på bildet. Standard er tre omganger (seks tørn), som gir mer grep.','Rett opp tørnene så de ligger pent side om side, og trekk til.'], c:'Den låser ved belastning og glir når du skyver den mens den er slakk. Flere tørn gir mer grep, spesielt på glatt tau.'},
      {n:'Tømmerstikk (Timber Hitch)', u:'Fester et tau rundt et tre, en stang eller en stokk. Holder godt så lenge tauet er belastet, og er lett å løse opp etterpå. Fint i treenden av en møneline til tarpen, eller for å slepe ved.', s:['Før tauet rundt treet.','Legg tampen rundt det stående partet og deretter tilbake rundt seg selv.','Tvinn tampen rundt seg selv minst tre ganger.','Trekk i det stående partet så stikket strammer seg mot treet.'], c:'Tampen skal være tvunnet rundt seg selv, ikke rundt det stående partet. Holder bare under belastning, og kan løsne når tauet er slakt.'},
      {n:'Åttetallsknute (enkel og dobbel)', u:'En stoppeknute i enden av et tau, og, slått med dobbelt tau, en sterk, fast løkke til en karabin, en plugg eller en stang.', s:['<b>Enkel:</b> lag en løkke nær enden.','Før tampen bak det stående partet og ned gjennom løkken, og trekk til.','<b>Dobbel (løkke):</b> legg tauet dobbelt på ca. 30 cm, og slå den samme knuten med det doble tauet.','Rett den opp så partene ligger parallelt, og la tampen være minst en håndbredde lang.'], c:'Den enkle knuten ser ut som et 8-tall og er lett å løse opp, også etter belastning. På løkken: sjekk at det er to parallelle parter hele veien, uten kryss. Klatrere knytter en tredd variant gjennom selen; den læres på kurs.'}
    ],

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function detectLang(){
  const l = (navigator.language || 'en').toLowerCase();
  return /^(nb|nn|no)\b/.test(l) ? 'no' : 'en';
}
function parseItem(x, ids){
  let sub = false, link = null, light = false;
  if (x.startsWith('> ')){ sub = true; x = x.slice(2); }
  if (x.startsWith('* ')){ light = true; x = x.slice(2); }
  const m = x.match(/^@(\w+) (.*)$/);
  if (m){ link = ids[m[1]] || null; x = m[2]; }
  return {id:uid(), text:x, done:false, sub, link, light};
}
function cloneList(src, keepDone){
  const map = {};
  const cats = (Array.isArray(src.cats) ? src.cats : []).filter(c => c && Array.isArray(c.items)).map(c => {
    const id = uid(); map[c.id] = id;
    return { id, icon: typeof c.icon === 'string' ? c.icon : null, name:String(c.name || t().category), note: typeof c.note === 'string' ? c.note : '',
      mode: (typeof c.mode === 'string' && MODES[c.mode]) ? c.mode : null, bag: !!c.bag, lightOnly: !!c.lightOnly, open:true,
      items: c.items.filter(i => i && i.text).map(i => ({ id:uid(), text:String(i.text), done: keepDone ? !!i.done : false, sub:!!i.sub, link: i.link || null, light:!!i.light })) };
  });
  cats.forEach(c => c.items.forEach(i => { if (i.link) i.link = map[i.link] || null; }));
  const modes = {};
  if (src.modes && typeof src.modes === 'object') Object.keys(src.modes).forEach(k => { if (MODES[k]) modes[k] = !!src.modes[k]; });
  return { id:uid(), name:String(src.name || t().myList), notes: typeof src.notes === 'string' ? src.notes : '', modes, cats };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.lists)) return s; } catch(e){}
  return null;
}
function save(){ bkTrack(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- backup bookkeeping (v32) ---------- */
// Personal content, without ticks, folds and other state that changes on every trip.
const BK_PLAN = ['calc', 'fuelCalc', 'foodCalc', 'wind'];
const BK_REMIND_MS = 14 * 86400000, BK_SNOOZE_MS = 7 * 86400000;
function listSig(L){ return [L.name, (L.cats || []).map(c => [c.name, c.note || '', (c.items || []).map(i => (i.sub ? '>' : '') + i.text)])]; }
function strHash(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function personalSig(){
  return strHash(JSON.stringify([(state.lists || []).map(listSig), (state.notes || []).map(n => { const a = (n.pin || n.rcv) ? [n.title, n.text, !!n.pin, n.rcv ? (n.rcv.n || '-') : ''] : [n.title, n.text]; if (n.c) a.push('c' + n.c); return a; }),
    ((state.packW || {}).items || []).map(i => [i.name, i.g, i.cat, !!i.cons, !!i.dog]), (state.links || []).map(l => [l.n, l.u])].concat((state.noteColors || []).some(Boolean) ? [state.noteColors] : [])));
}
function hasOwnContent(){
  return (state.lists || []).length > 0 || (state.notes || []).length > 0 || ((state.packW || {}).items || []).length > 0 || (state.links || []).length > 0;
}
function bkTrack(){
  if (!state) return;
  const sig = personalSig();
  if (sig === state.bkSig) state.bkDirtyT = 0;
  else if (!state.bkDirtyT) state.bkDirtyT = Date.now();
}
function bkDirty(){ return hasOwnContent() && personalSig() !== state.bkSig; }
function bkMarkDone(){ state.bkLast = Date.now(); state.bkSig = personalSig(); state.bkDirtyT = 0; state.bkSnooze = 0; save(); }
function bkRemindDue(){
  if (state.field || !bkDirty() || !state.bkDirtyT) return false;
  const now = Date.now();
  return now - state.bkDirtyT > BK_REMIND_MS && !(state.bkSnooze > now);
}
function bkData(){
  const plan = {};
  BK_PLAN.forEach(k => { if (state[k]) plan[k] = state[k]; });
  return JSON.stringify({app:'trip-checklist', version:3, t:Date.now(), lists:state.lists, notes:state.notes, noteColors:state.noteColors || [],
    packW:{items:(state.packW || {}).items || []}, links:state.links || [], plan});
}
function bkFileName(){ return APP_NAME.toLowerCase() + '-' + (state.lang === 'no' ? 'sikkerhetskopi' : 'backup') + '-' + new Date().toISOString().slice(0, 10) + '.json'; }
// Adds what is new; never overwrites. Returns counts, or null if the text is not a backup.
/* 0.6.0: pinned state and share tags, copied from a backup; only known fields, cleaned */
function noteMeta(nn, src){
  if (src.pin) nn.pin = true;
  if (src.rcv && typeof src.rcv === 'object') nn.rcv = {n:String(src.rcv.n || '').slice(0, 40), t:+src.rcv.t || nn.t};
  if (+src.shT) nn.shT = +src.shT;
  if (+src.c >= 1 && +src.c <= 5) nn.c = +src.c;
  return nn;
}
function bkRestore(text){
  let obj;
  try { obj = JSON.parse(text); } catch(e){ return null; }
  if (!obj || !Array.isArray(obj.lists)) return null;
  const a = {l:0, n:0, w:0, k:0, p:0};
  const have = new Set((state.lists || []).map(L => JSON.stringify(listSig(L))));
  obj.lists.forEach(l => {
    if (!l || typeof l.name !== 'string' || !Array.isArray(l.cats)) return;
    const c = cloneList(l, true); c.tripType = !!l.tripType; c.sharedIn = !!l.sharedIn; notesFromList(c);
    const sig = JSON.stringify(listSig(c));
    if (have.has(sig)) return;
    have.add(sig); state.lists.push(c); a.l++;
  });
  if (Array.isArray(obj.notes)) obj.notes.forEach(n => {
    if (!n || typeof n.text !== 'string' || state.notes.some(x => x.id === n.id || (x.title === n.title && x.text === n.text))) return;
    state.notes.push(noteMeta({id:typeof n.id === 'string' ? n.id : uid(), title:String(n.title || ''), text:n.text, t:+n.t || Date.now()}, n)); a.n++;
  });
  // colour names: only fill names that are empty here, never overwrite
  if (Array.isArray(obj.noteColors)) obj.noteColors.slice(0, 5).forEach((nm, k) => { if (typeof nm === 'string' && nm.trim() && !state.noteColors[k]) state.noteColors[k] = nm.trim().slice(0, 20); });
  if (obj.packW && Array.isArray(obj.packW.items)){
    const pw = packW();
    obj.packW.items.forEach(i => {
      if (!i || typeof i.name !== 'string' || !isFinite(+i.g) || pw.items.some(x => x.id === i.id)) return;
      pw.items.push({id:typeof i.id === 'string' ? i.id : uid(), name:i.name, g:+i.g, cat:String(i.cat || ''), cons:!!i.cons, dog:!!i.dog}); a.w++;
    });
  }
  if (Array.isArray(obj.links)) obj.links.forEach(l => {
    if (!l || typeof l.u !== 'string' || !/^https?:\/\//.test(l.u) || (state.links || []).some(x => x.u === l.u)) return;
    state.links = (state.links || []).concat([{n:String(l.n || hostOf(l.u)), u:l.u}]); a.k++;
  });
  // Planner figures only where this phone has none of its own.
  if (obj.plan && typeof obj.plan === 'object') BK_PLAN.forEach(k => {
    if (obj.plan[k] && typeof obj.plan[k] === 'object' && !state[k]){ state[k] = obj.plan[k]; a.p = 1; }
  });
  return a;
}

  if (!c.lightOnly || !hasLight(c)) return c.items;
  const keep = new Set();
  let parent = null;
  c.items.forEach(i => {
    if (!i.sub) parent = i;
    if (i.light){ keep.add(i); if (i.sub && parent) keep.add(parent); }
  });
  return c.items.filter(i => keep.has(i));

    `</div>${hits.length > GS_MAX ? `<p class="gs-count">${T.gsMore(GS_MAX)}</p>` : ''}`;
}
// after a guide opens from a result: unfold the section with that heading and scroll it into view
function openHit(){
  const want = guideHit; guideHit = null;
  if (!want) return;
  const norm = s => gsLow(s.replace(/\s+/g, ' ').trim());
  const d = [...main.querySelectorAll('details')].find(x => { const su = x.querySelector('summary'); return su && norm(su.textContent).includes(norm(want)); });
  if (!d) return;
  d.open = true;
  for (let p = d.parentElement; p && p !== main; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  requestAnimationFrame(() => d.scrollIntoView({block:'start'}));
}
