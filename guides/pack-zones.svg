<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 190 230" role="img" aria-label="Packing zones in a backpack, seen from the side, back panel to the left" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink{stroke:var(--sb-ink,#1D2B2A);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:var(--sb-ink,#1D2B2A);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <clipPath id="pz-body">
      <path d="M72 66C72 54 84 48 102 48C132 48 158 54 166 72C171 82 172 94 173 106L178 196C180 220 166 232 140 232L80 232C74 232 70 228 70 222Z"/>
    </clipPath>
  </defs>
  <!-- shoulder strap (behind the back panel), curving out where the shoulder goes -->
  <path d="M68 76C52 76 40 88 38 106C36 128 40 152 48 168C52 176 58 180 66 182" fill="none" stroke="var(--sb-ink,#1D2B2A)" stroke-width="11" stroke-linecap="round"/>
  <path d="M68 76C52 76 40 88 38 106C36 128 40 152 48 168C52 176 58 180 66 182" fill="none" stroke="var(--sb-strap,#3F7A8C)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- hip belt wing, where the weight is carried -->
  <path d="M70 194L32 198C22 200 22 216 32 218L70 222Z" style="fill:var(--sb-strap,#3F7A8C)" class="ink"/>
  <rect x="20" y="201" width="9" height="14" rx="2" style="fill:var(--sb-surface,#fff)" class="thin"/>
  <!-- pack contents, as a cut-away -->
  <g clip-path="url(#pz-body)">
    <rect x="66" y="40" width="120" height="200" style="fill:var(--sb-surface,#fff)"/>
    <!-- on top: what you need on the way -->
    <rect x="66" y="40" width="120" height="72" style="fill:var(--sb-foam,#9DB58A)"/>
    <!-- heavy, against the back -->
    <rect x="66" y="114" width="46" height="66" fill="var(--sb-heavy,#4F5A58)"/>
    <!-- lighter, outer side -->
    <rect x="114" y="114" width="72" height="66" fill="var(--sb-alu,#C9D0D3)"/>
    <!-- light and bulky at the bottom: the sleeping bag -->
    <rect x="66" y="182" width="120" height="58" style="fill:var(--sb-board,#E3D3B5)"/>
    <path d="M82 196c22 8 64 8 86 0M82 212c22 8 64 8 86 0" class="thin" stroke-opacity=".5"/>
  </g>
  <!-- pack outline -->
  <path d="M72 66C72 54 84 48 102 48C132 48 158 54 166 72C171 82 172 94 173 106L178 196C180 220 166 232 140 232L80 232C74 232 70 228 70 222Z" class="ink"/>
  <!-- padded back panel against the back -->
  <rect x="62" y="72" width="11" height="156" rx="5" style="fill:var(--sb-strap,#3F7A8C)" class="ink"/>
  <path d="M65 90h5M65 110h5M65 130h5M65 150h5M65 170h5" class="thin" stroke-opacity=".5"/>
  <!-- lid, a little over the front -->
  <path d="M70 66C74 38 158 34 172 62C176 72 170 80 160 80L82 80C74 80 69 74 70 66Z" style="fill:var(--sb-foam,#9DB58A)" class="ink"/>
  <!-- grab loop -->
  <path d="M76 62c-4-8 2-14 8-10" class="ink" stroke-width="2.5"/>
  <!-- load lifter from the top of the pack to the shoulder strap -->
  <path d="M74 64L46 90" class="ink" stroke-width="3"/>
  <!-- lid strap with buckle down the front -->
  <path d="M172 76l3 34" class="ink" stroke-width="3"/>
  <rect x="169" y="100" width="11" height="9" rx="2" style="fill:var(--sb-surface,#fff)" class="thin"/>
  <!-- side compression straps -->
  <path d="M170 140l14-2M172 170l14-2" class="ink" stroke-width="3"/>
</svg>
