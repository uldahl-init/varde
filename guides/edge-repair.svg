<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-label="Patching a tear at an edge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink{stroke:var(--sb-ink,#1D2B2A);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .acc{stroke:var(--sb-accent,#C8372D);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .cord{stroke:var(--sb-strap,#3F7A8C);fill:none;stroke-width:5;stroke-linecap:round}
  </style>
  <!-- LEFT: the tear running in from the edge -->
  <rect x="12" y="40" width="130" height="130" rx="4" style="fill:var(--sb-foam,#9DB58A)" class="ink"/>
  <path d="M12 48h130" class="ink" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M74 40l6 12-7 10 8 12-6 10 7 12" class="ink" stroke-width="2.5"/>
  <!-- arrow to the right -->
  <path d="M152 105h22" class="acc"/><path d="M168 98l8 7-8 7" class="acc"/>
  <!-- RIGHT: cord along the edge, patch folded over it, patch on the back too -->
  <rect x="182" y="40" width="130" height="130" rx="4" style="fill:var(--sb-foam,#9DB58A)" class="ink"/>
  <path d="M182 48h130" class="ink" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- tear, seen faintly under the patch -->
  <path d="M244 40l6 12-7 10 8 12-6 10 7 12" class="ink" stroke-width="1.5" stroke-opacity=".35"/>
  <!-- patch on the back (dashed, slightly offset) -->
  <rect x="202" y="40" width="88" height="96" rx="14" class="ink" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- cord along the edge, sticking out on both sides of the patch -->
  <path d="M188 44h22M282 44h24" class="cord"/>
  <!-- front patch, folded over the edge -->
  <path d="M214 26h64a8 8 0 0 1 8 8v78a12 12 0 0 1-12 12h-56a12 12 0 0 1-12-12V34a8 8 0 0 1 8-8z" style="fill:var(--sb-board,#E3D3B5)" class="ink"/>
  <!-- the fold over the edge -->
  <path d="M206 40h80" class="ink" stroke-width="1.5"/>
  <path d="M214 26h64a8 8 0 0 1 8 8v6h-80v-6a8 8 0 0 1 8-8z" fill="var(--sb-ink,#1D2B2A)" fill-opacity=".18"/>
  <!-- cord inside the fold, hidden by the patch -->
  <path d="M214 44h64" class="cord" stroke-opacity=".5" stroke-dasharray="6 4"/>
  <!-- round corners hint -->
</svg>
