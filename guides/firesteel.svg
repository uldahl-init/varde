<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" role="img" aria-label="Striking a fire steel onto birch bark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink{stroke:var(--sb-ink,#1D2B2A);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:var(--sb-ink,#1D2B2A);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
    .acc{stroke:var(--sb-accent,#C8372D);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <!-- ground and a few twigs under the tinder -->
  <path d="M10 188h280" class="ink" stroke-width="1.5" stroke-opacity=".4"/>
  <path d="M40 186l60-10M70 188l70-14M110 187l46-6" class="ink" stroke-width="2.5" stroke-opacity=".55"/>
  <!-- birch bark: curled sheets with the dark marks of birch bark -->
  <g class="ink" style="fill:var(--sb-board,#E3D3B5)">
    <path d="M54 184c-6-16 6-28 22-28 12 0 18 10 12 17-4 5-11 4-12-1"/>
    <path d="M84 186c-2-18 12-30 30-28 14 2 18 13 11 20-5 5-13 3-13-2"/>
    <path d="M116 186c2-14 16-20 30-15 10 4 10 13 3 16"/>
  </g>
  <g stroke="var(--sb-ink,#1D2B2A)" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".7">
    <path d="M62 170h6M70 163h5M92 172h7M100 164h6M108 175h5M128 177h5M136 172h4"/>
  </g>
  <!-- the rod: shiny metal, the handle in wood -->
  <path d="M116 126L232 58" stroke="var(--sb-ink,#1D2B2A)" stroke-width="12" stroke-linecap="round"/>
  <path d="M116 126L232 58" stroke="var(--sb-alu,#C9D0D3)" stroke-width="8" stroke-linecap="round"/>
  <path d="M122 120L226 59" stroke="var(--sb-surface,#fff)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M226 62l50-29" stroke="var(--sb-ink,#1D2B2A)" stroke-width="22" stroke-linecap="round"/>
  <path d="M226 62l50-29" stroke="var(--sb-board,#E3D3B5)" stroke-width="18" stroke-linecap="round"/>
  <path d="M234 60c12-6 24-14 36-21M232 54c12-7 24-14 36-21" class="thin" stroke-opacity=".45"/>
  <circle cx="276" cy="33" r="3.5" style="fill:var(--sb-surface,#fff)" class="thin"/>
  <!-- cord from the handle to the striker -->
  <path d="M278 32c14 10 4 44-28 56-30 12-90 8-120-6" fill="none" stroke="var(--sb-strap,#3F7A8C)" stroke-width="2" stroke-linecap="round"/>
  <!-- striker: a flat steel plate held still across the rod -->
  <path d="M104 84l14-7 36 66-14 7z" style="fill:var(--sb-alu,#C9D0D3)" class="ink"/>
  <path d="M120 96l9 16" stroke="var(--sb-surface,#fff)" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="114" cy="90" r="4" style="fill:var(--sb-surface,#fff)" class="thin"/>
  <!-- the plate stays still -->
  <path d="M94 80l-6-10M102 74l-6-10" class="ink" stroke-width="1.6"/>
  <!-- the rod is pulled back -->
  <path d="M156 84l52-30" class="acc"/>
  <path d="M196 51l13 2-6 12" class="acc"/>
  <!-- sparks: hot streaks falling onto the bark -->
  <g stroke="var(--sb-accent,#C8372D)" stroke-linecap="round">
    <path d="M122 138l-8 16" stroke-width="2.5"/>
    <path d="M130 140l-3 15" stroke-width="2.5"/>
    <path d="M115 134l-12 11" stroke-width="2"/>
    <path d="M136 138l5 11" stroke-width="2"/>
    <path d="M110 150l-6 8M126 158l-2 5" stroke-width="1.5" stroke-opacity=".7"/>
  </g>
  <g fill="var(--sb-accent,#C8372D)">
    <circle cx="104" cy="160" r="2"/><circle cx="120" cy="164" r="2.2"/><circle cx="96" cy="150" r="1.6"/><circle cx="140" cy="156" r="1.8"/>
  </g>
</svg>
